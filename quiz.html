        {ch: "第六章", q: "列宁得出社会主义可能在一国或数国首先取得胜利的结论依据是（  ）。", o: ["A.资本主义必然灭亡、社会主义和共产主义必然胜利的规律", "B.资本主义的发展在各个国家是极不平衡的", "C.资本主义国家无产阶级与资产阶级斗争的规律", "D.无产阶级是最先进、最革命的阶级的原理"], a: "B"},
        {ch: "第六章", q: "社会主义必然代替资本主义的决定性因素是（  ）。", o: ["A.无产阶级与资产阶级斗争尖锐化", "B.个别企业有组织的生产与整个社会生产无政府状态之间的矛盾", "C.现代无产阶级的日益壮大", "D.生产的社会化与生产资料资本主义私人占有制之间的矛盾"], a: "D"},
        {ch: "第六章", q: "在马克思主义科学体系中，处于核心地位的是（  ）。", o: ["A.马克思主义哲学", "B.马克思主义政治经济学", "C.科学社会主义", "D.马克思主义政治学"], a: "C"},
        {ch: "第六章", q: "造成社会主义发展道路多样性的现实原因是（   ）。", o: ["A.无产阶级政党自身成熟程度的不同", "B.历史文化传统的差异性", "C.时代和实践的不断发展", "D.革命传统不同"], a: "C"},
        {ch: "第六章", q: "科学社会主义的直接理论来源是（   ）。", o: ["A.空想社会主义的学说", "B.19世纪初期以圣西门、傅立叶、欧文为代表的空想社会主义", "C.空想平均共产主义", "D.唯物史观和剩余价值学说"], a: "B"},
        {ch: "第六章", q: "（   ）实现了社会主义从理想到现实的伟大飞跃，开辟了人类历史的新纪元。", o: ["A.十月革命", "B.巴黎公社革命", "C.欧洲三大工人运动", "D.法国大革命"], a: "A"},
        {ch: "第六章", q: "社会主义从空想到科学的飞跃，此后在（   ）的指引下，社会主义实现了从理想到现实的飞跃。", o: ["A.启源运动", "B.科学社会主义", "C.文艺复兴", "D.空想社会主义"], a: "B"},
        {ch: "第六章", q: "马克思和恩格斯建立的第一个无产阶级政党是（   ）。", o: ["A.共产主义者同盟", "B.正义者同盟", "C.国际工人协会", "D.社会主义工人国际"], a: "A"},
        {ch: "第六章", q: "人民民主专政的实质是（   ）。", o: ["A.无产阶级专政", "B.最大多数人对极少数人的统治", "C.民主具有广泛性", "D.保障国家的长治久安"], a: "A"},
        {ch: "第六章", q: "（   ）是最先进最革命的阶级，肩负着推翻资本主义旧世界、建立社会主义和共产主义新世界的历史使命。", o: ["A.资产阶级", "B.无产阶级", "C.地主阶级", "D.农民阶级"], a: "B"},
        {ch: "第六章", q: "空想社会主义的开山之作是（   ）。", o: ["A.《乌托邦》", "B.《太阳城》", "C.《自然法典》", "D.《论法制或法律的原则》"], a: "A"},
        {ch: "第六章", q: "在第一阶段，也就是在社会主义社会，个人消费品的分配应当实行（   ）。", o: ["A.“各尽所能，按需分配”", "B.“按资分配”", "C.“多种分配方式并存”", "D.“按劳分配”"], a: "D"},
        {ch: "第六章", q: "下列不属于科学社会主义基本原则的是（   ）。", o: ["A.资本主义必然灭亡、社会主义必然胜利", "B.要对社会生产进行有计划的调节，实行按需分配的原则", "C.要合乎自然规律地改造和利用自然，努力实现人与自然的和谐共生", "D.必须坚持科学的理论指导，大力发展社会主义先进文化"], a: "B"},
        {ch: "第六章", q: "从莫尔1516年发表《乌托邦》到现在，社会主义已经有500多年的历史了。社会主义发展史上的第一次历史性飞跃是指（   ）。", o: ["A.19世纪中叶，社会主义从空想发展到科学", "B.20世纪初，社会主义从理论发展到建立社会主义制度的实践", "C.社会主义从一国实践发展到多国实践", "D.20世纪 70 年代末开始的社会主义改革"], a: "A"},
        {ch: "第六章", q: "无产阶级革命取得胜利的根本保证是（   ）。", o: ["A.无产阶级政党的正确领导", "B.建立革命的统一战线", "C.人民群众革命积极性的极大提高", "D.国家政权问题"], a: "A"},
        {ch: "第六章", q: "科学社会主义的核心命题是（   ），是马克思、恩格斯研究人类历史发展所得出的基本结论。", o: ["A.资本主义必然灭亡，社会主义必然胜利", "B.人的本质是一切社会关系的总和", "C.资本主义社会的基本矛盾", "D.无产阶级是最先进最革命的阶级"], a: "A"},
        {ch: "第六章", q: "列宁对社会主义革命学说的重大贡献是（   ）。", o: ["A.提出了新经济政策", "B.提出了战时共产主义政策", "C.提出了社会主义革命将首先在一国或数国取得胜利的理论", "D.提出了利用国家资本主义过渡到社会主义的理论"], a: "C"},
        {ch: "第六章", q: "社会主义国家的改革，其性质应该是（   ）。", o: ["A.社会主义基本制度的变革", "B.社会主义制度的自我完善和发展", "C.社会主义原有体制的修补", "D.社会主义经济运行方式的改变"], a: "B"},
        {ch: "第六章", q: "（   ）是马克思主义追求的一个基本目标，是社会主义的一个本质特征，也是社会主义优越性的突出体现。", o: ["A.扩大改革开放，成为社会的主人", "B.不断发展生产，增加社会财富", "C.共同富裕", "D.实行按劳分配，改善人民生活"], a: "C"},
        {ch: "第六章", q: "（   ）是马克思主义政党的本质属性，是马克思主义政党的生命所系、力量所在。", o: ["A.先进性", "B.无产阶级专政", "C.工农联盟", "D.无产阶级先锋队"], a: "A"},
        {ch: "第六章", q: "为实现社会主义从空想到科学的飞跃奠定坚实理论基础的是（   ）的创立和发展。", o: ["A.空想社会主义学说", "B.德国古典哲学", "C.唯物史观和剩余价值学说", "D.英国古典政治经济学"], a: "C"},
        {ch: "第六章", q: "社会主义各个阶段的划分依据最终应以（   ）。", o: ["A.生产力的发展为标准", "B.生产关系为标准", "C.生产数据的公有制程度为标准", "D.以阶级斗争为标准"], a: "A"},
        {ch: "第六章", q: "社会主义政治制度的基本特征是（  ）。", o: ["A.坚持社会主义方向", "B.无产阶级政党领导", "C.无产阶级专政的政权", "D.马克思主义的指导"], a: "C"},
        {ch: "第六章", q: "社会主义国家政权的阶级基础是（   ）。", o: ["A.无产阶级先锋队", "B.工农联盟", "C.无产阶级专政", "D.社会主义民主"], a: "B"},
        {ch: "第六章", q: "无产阶级反抗资产阶级的斗争中最关键的是（   ）。", o: ["A.经济斗争", "B.政治斗争", "C.思想斗争", "D.舆论斗争"], a: "B"},
        {ch: "第六章", q: "我国实行按劳分配为主体、多种分配方式并存的分配体制，是由（   ）。", o: ["A.我国的基本国情决定的", "B.无产阶级政党决定的", "C.人民民主专政决定的", "D.改革开放决定的"], a: "A"},
        {ch: "第六章", q: "马克思、恩格斯认为，（   ）是造成资本主义罪恶和不平等现象的总根源。", o: ["A.贫富差距", "B.生产资料的过度集中", "C.资本集中", "D.生产资料私有制"], a: "D"},
        {ch: "第六章", q: "（   ）是社会主义制度的自我完善和发展。", o: ["A.革命", "B.民主", "C.改革", "D.文明"], a: "C"},
        {ch: "第六章", q: "（   ）是社会主义经济制度的根根基，社会主义国家任何时候都不能放弃。", o: ["A.生产资料公有制", "B.人民民主专政", "C.无产阶级专政", "D.国家政权"], a: "A"},
        {ch: "第六章", q: "（   ）是立党立国的根本指导思想。", o: ["A.民主主义", "B.马克思主义", "C.社会主义", "D.共产主义"], a: "B"},
        {ch: "第六章", q: "经济文化相对落后国家建设社会主义具有（   ）。", o: ["A.盲动性", "B.短暂性", "C.不可能性", "D.历史长期性"], a: "D"},
        {ch: "第六章", q: "空想社会主义的历史功绩是（   ）。", o: ["A.对过去社会作出了天才的反省", "B.揭示了资本主义灭亡、社会主义胜利的客观规律", "C.对资本主义的弊病进行了深刻的揭露和猛烈的抨击", "D.找到了变革社会的革命力量"], a: "C"},

        // 第七章
        {ch: "第七章", q: "“通过批判旧世界来发现新世界”是（  ）。", o: ["A.空想社会主义预见未来社会的方法", "B.马克思主义预见未来社会的方法", "C.唯物主义预见未来社会的方法", "D.唯心主义预见未来社会的方法"], a: "B"},
        {ch: "第七章", q: "马克思主义认为，消灭“三大差别”的关键在于（  ）。", o: ["A.消灭工业与农业的差别", "B.消灭城市和乡村的差别", "C.消灭脑力劳动和体力劳动的差别", "D.消灭私有制"], a: "D"},
        {ch: "第七章", q: "实行“各尽所能，按需分配”是（  ）。", o: ["A.原始社会的分配方式", "B.阶级社会的分配方式", "C.社会主义社会的分配方式", "D.共产主义社会的分配方式"], a: "D"},
        {ch: "第七章", q: "习近平指出：“我们现在坚持和发展中国特色社会主义，就是向着最高理想所进行的实实在在努力。”这里的“最高理想”是指（  ）。", o: ["A.共产主义远大理想", "B.建设中国特色社会主义共同理想", "C.个人对美好生活的向往与追求", "D.个人对将来职业的向往与追求"], a: "A"},
        {ch: "第七章", q: "共产主义是人类解放的实现，共产主义社会最根本的特征是（  ）。", o: ["A.物质财富极大丰富，消费资料按需分配", "B.社会关系高度和谐", "C.人们的精神境界极大提高", "D.实现人的自由而全面发展"], a: "D"},
        {ch: "第七章", q: "阶级消灭和国家消亡的实现是在（    ）。", o: ["A.社会主义革命中", "B.社会主义初级阶段", "C.社会主义高级阶段", "D.共产主义社会"], a: "D"},
        {ch: "第七章", q: "马克思主义指出，在共产主义社会，劳动是（  ）。", o: ["A.人们谋生的手段", "B.人们生活的第一需要", "C.休闲的手段", "D.完全由个人自由选择的活动"], a: "B"},
        {ch: "第七章", q: "社会主义和共产主义都存在的经济关系是（    ）。", o: ["A.实行生产资料公有制", "B.实行按劳分配制度", "C.实行按需分配制度", "D.实行生产资料私有制"], a: "A"},
        {ch: "第七章", q: "共产主义社会的初级阶段和必由之路是（    ）。", o: ["A.社会主义革命和无产阶级专政", "B.向社会主义过渡时期", "C.社会主义初级阶段", "D.社会主义社会"], a: "D"},
        {ch: "第七章", q: "在展望未来社会问题上，马克思主义与空想社会主义的根本区别（  ）。", o: ["A.是否对资本主义进行了辛辣地批判", "B.是否对未来社会进行了描绘", "C.是否坚持科学的立场、观点和方法", "D.是否看到了资本主义旧制度灭亡的命运"], a: "C"},
        {ch: "第七章", q: "马克思主义经典作家揭示了未来社会发展的（  ）。", o: ["A.具体细节", "B.一般特征", "C.具体阶段", "D.特殊规律"], a: "B"},
        {ch: "第七章", q: "共产主义理想一定会实现，是以人类社会发展规律以及（   ）的基本矛盾发展为依据的。", o: ["A.奴隶社会", "B.封建社会", "C.资本主义社会", "D.社会主义社会"], a: "C"},
        {ch: "第七章", q: "到了共产主义社会，国家将消亡，这里国家将消亡是指（   ）。", o: ["A.政治国家的消亡", "B.领土和主权的丧失", "C.国家的界限消失", "D.社会组织管理机构的消亡"], a: "A"},
        {ch: "第七章", q: "在共产主义社会里，高尚的精神境界表现为（   ）。", o: ["A.个人价值的实现", "B.人的自由而全面的发展", "C.个人主义", "D.自觉地为他人、社会服务和奉献"], a: "D"},
        {ch: "第七章", q: "马克思、恩格斯关于未来社会的预测，是在科学地批判和剖析（   ）的过程中作出的。", o: ["A.奴隶社会", "B.封建社会", "C.资本主义社会", "D.社会主义社会"], a: "C"},
        {ch: "第七章", q: "共产主义社会，个人消费品的分配方式是（   ）。", o: ["A.各尽所能，按劳分配", "B.各尽所能，按资分配", "C.各尽所能，按需分配", "D.实行有计划的分配"], a: "C"},
        {ch: "第七章", q: "共产主义社会，（   ）成为“生活的第一需要”。", o: ["A.消费", "B.劳动", "C.娱乐", "D.和谐"], a: "B"},
        {ch: "第七章", q: "下列说法，错误的是（   ）。", o: ["A.实现共产主义是历史发展的必然趋势", "B.共产主义社会是一种没有任何矛盾的社会", "C.共产主义社会将在一个更高的基础上不断发展和前进", "D.共产主义社会一定能够实现..."], a: "B"},
        {ch: "第七章", q: "共产主义理想之所以能够实现，是因为它（   ）。", o: ["A.具有客观可能性", "B.人类向往的美好境界", "C.具有客观必然性", "D.人类追求的目标"], a: "C"},
        {ch: "第七章", q: "下列不属于共产主义的基本特征的是（    ）。", o: ["A.社会财富极大丰富，消费品按需分配", "B.社会关系高度和谐，人们的精神境界极大提高", "C.每个人自由而全面的发展", "D.任何社会分工都不存在"], a: "D"},
        {ch: "第七章", q: "马克思主义追求的根本价值目标是（   ）。", o: ["A.社会关系高度和谐", "B.人的民主权利得到充分实现", "C.实现中华民族的伟大复兴", "D.实现人的自由而全面的发展"], a: "D"},
        {ch: "第七章", q: "共产主义社会实现的必要条件是（   ）。", o: ["A.人的思想境界的极大提高", "B.科学技术迅猛发展", "C.社会生产力高度发展，产品极大丰富", "D.无产阶级掌握国家政权"], a: "C"},
        {ch: "第七章", q: "在共产主义社会里，高尚的精神境界表现为（   ）。（重题）", o: ["A.个人价值的实现", "B.人的自由而全面的发展", "C.个人主义", "D.自觉地为他人、社会服务和奉献"], a: "D"},
        {ch: "第七章", q: "马克思根据人的发展状况，把人类历史划分为三大形态，它们是（   ）。", o: ["A.自然经济社会、商品经济社会、市场经济社会", "B.原始公有制社会、私有制社会、共产主义公有制社会", "C.农业社会、工业社会、信息社会", "D.人的依赖性社会、物的依赖性社会、人的自由全面发展社会"], a: "D"},
        {ch: "第七章", q: "实现了人的“自由个性”的发展，是（    ）。", o: ["A.资本主义社会以前的人的生存状态", "B.资本主义社会之中的人的生存状态", "C.社会主义社会之中的人的生存状态", "D.共产主义社会之中的人的生存状态"], a: "D"},
        {ch: "第七章", q: "我们是最低纲领与最高纲领的统一论者。党的最高纲领是（    ）。", o: ["A.实现共产主义", "B.构建和谐社会", "C.实现“天下为公”", "D.实现大同世界"], a: "A"},
        {ch: "第七章", q: "中华民族走向共产主义的必由之路是建设（  ）。", o: ["A.发达的社会主义", "B.真正的社会主义", "C.民主的社会主义", "D.中国特色社会主义"], a: "D"},
        {ch: "第七章", q: "马克思先后提出了“两个必然”和“两个决不会”的思想，这两个思想之间的关系是（   ）。", o: ["A.相互矛盾的", "B.后者否定前者", "C.各自独立的", "D.有内在联系，前者讲客观必然性，后者讲时间与条件"], a: "D"},
        {ch: "第七章", q: "自由王国是指人们（   ）。", o: ["A.处于绝对自由的原始社会状态", "B.不再受自然规律和社会规律支配的状态", "C.允许自由竞争的资本主义状态", "D.摆脱了自然和社会关系的奴役，成为自己社会关系主人的状态"], a: "D"},
        {ch: "第七章", q: "在共产主义社会，个人消费的分配方式是各尽所能，按需分配，实现这一分配方式的物质条件是（    ）。", o: ["A.劳动是人们生活的第一需要", "B.旧式分工消失，劳动不再是谋生手段", "C.脑力劳动和体力劳动对立的消除", "D.生产力高度发展，社会财富极大丰富"], a: "D"}
    ],
    multi: [
        // 导论
        {ch: "导论", q: "马克思主义是在实践中产生的，并在实践中得到发展和完善。这种发展包括（      ）、习近平新时代中国特色社会主义思想的形成和发展。", o: ["A.马克思、恩格斯根据实践的发展对自己创立的理论的不断充实和完善", "B.列宁在领导俄国革命中形成的相关理论", "C.毛泽东思想的形成和发展", "D.中国特色社会主义理论体系的形成和发展"], a: "ABCD"},
        {ch: "导论", q: "19世纪30-40年代，标志着现代无产阶级作为独立的政治力量已经登上了历史舞台的工人运动有（      ）。", o: ["A.1831年和1834年法国里昂工人两次起义", "B.1838年在英国爆发延续长达十余年的宪章运动", "C.1844年在德国西里西亚纺织工人起义", "D.1871年法国巴黎公社革命"], a: "ABC"},
        {ch: "导论", q: "马克思主义是科学性与革命性的统一，其具体表现为（      ）。", o: ["A.马克思主义科学理论在指导社会革命中，其人民性、实践性和发展性体现为革命性", "B.革命性是马克思主义的人本性、实践性和发展性的应有之义和必然要求", "C.马克思主义的革命性是建立在科学性基础上的，是与科学性高度统一的", "D.在无产阶级解放斗争和社会主义事业发展的任何时期，都必须始终坚持革命性"], a: "ABCD"},
        {ch: "导论", q: "大学生在学习马克思主义的过程中，要有的正确态度和科学方法是（      ）。", o: ["A.努力学习和掌握马克思主义的基本立场观点方法", "B.坚持理论联系实际的马克思主义学风", "C.自觉将马克思主义内化于心、外化于行", "D.努力学习和掌握马克思主义中国化时代化的理论成果"], a: "ABCD"},
        {ch: "导论", q: "马克思主义具有鲜明的（      ），这些鲜明特征体现了马克思主义的本质和使命，也展现出马克思主义的理论形象。", o: ["A.科学性", "B.人民性", "C.实践性", "D.发展性"], a: "ABCD"},
        {ch: "导论", q: "马克思主义的当代价值在于（      ）。", o: ["A.观察当代世界变化的认识工具", "B.指引当代中国发展的行动指南", "C.引领人类社会进步的科学真理", "D.是人们认识世界和改造世界的绝对真理"], a: "ABC"},
        {ch: "导论", q: "马克思主义同中国实际相结合产生的成果是（      ）。", o: ["A.毛泽东思想", "B.科学社会主义理论体系", "C.邓小平理论", "D.习近平新时代中国特色社会主义思想"], a: "ACD"},
        {ch: "导论", q: "马克思主义的直接理论来源是（      ）。", o: ["A.德国古典哲学", "B.英法空想社会主义", "C.英国唯物主义", "D.英国古典政治经济学"], a: "ABD"},
        {ch: "导论", q: "习近平新时代中国特色社会主义思想是（      ）。", o: ["A.马克思主义中国化时代化最新理论成果", "B.党和人民实践经验和集体智慧的结晶", "C.中国特色社会主义理论体系的重要组成部分", "D.全党全国人民为实现中华民族伟大复兴而奋斗的行动指南"], a: "ABCD"},
        {ch: "导论", q: "下列关于马克思主义的判断，正确的有（      ）。", o: ["A.马克思主义是关于无产阶级 and 人类解放的科学", "B.马克思主义的根本理论特征是科学性和革命性的统一", "C.马克思主义崇高的社会理想是实现共产主义", "D.马克思主义的理论品质是与时俱进"], a: "ABCD"},
        {ch: "导论", q: "下列说法错误的是（      ）。", o: ["A.马克思主义只是经验科学方法", "B.马克思主义只是政治战略策略原则", "C.马克思主义是一种世界观", "D.马克思主义是一种意识形态"], a: "AB"},
        {ch: "导论", q: "我们可以从（    ）的有机统一中，来学习把握马克思主义基本原理。", o: ["A.基本思路", "B.基本立场", "C.基本观点", "D.基本方法"], a: "BCD"},
        {ch: "导论", q: "马克思主义是马克思和恩格斯创立并为后继者不断发展的科学理论体系，是关于（    ）一般规律的学说。", o: ["A.自然", "B.社会", "C.人类思维发展", "D.意识"], a: "ABC"},
        {ch: "导论", q: "以下选项中，（    ）属于马克思主义的基本观点。", o: ["A.关于事物矛盾运动的观点", "B.关于阶级和阶级斗争的观点", "C.关于垄断资本主义的观点", "D.关于无产阶级政党建设的观点"], a: "ABCD"},
        {ch: "导论", q: "马克思主义的基本立场是（    ）。", o: ["A.是马克思主义观察、分析和解决问题的根本立足点和出发点", "B.以无产阶级的解放和全人类的解放为己任", "C.以人的自由而全面发展为美好目标", "D.以社会生产最大化为目的"], a: "ABC"},
        {ch: "导论", q: "马克思主义诞生于19世纪40年代，在那时，资本主义的发展已经经历过（    ）。", o: ["A.资本主义生产方式在西欧已经有了相当的发展", "B.工业革命和科技进步极大地推动了资本主义社会生产力的发展", "C.多次经济危机给资本主义世界造成了极大破坏", "D.十月革命胜利建立了第一个社会主义国家"], a: "ABC"},
        {ch: "导论", q: "以下选项中，（    ）属于马克思主义的基本方法。", o: ["A.矛盾分析法", "B.历史分析法", "C.阶级分析法", "D.群众路线法"], a: "ABCD"},
        {ch: "导论", q: "马克思、恩格斯生活的时代，资本主义生产方式造成了深重的社会灾难，主要表现在（    ）。", o: ["A.无产阶级登上历史舞台", "B.封建社会下土地矛盾不断激化", "C.社会两极分化，工人极端困苦", "D.周期性经济危机频繁爆发"], a: "CD"},
        {ch: "导论", q: "作为马克思主义产生阶级基础的19世纪三大工人运动是（    ）。", o: ["A.巴黎公社运动", "B.法国里昂工人运动", "C.英国宪章运动", "D.德国西里西亚纺织工人运动"], a: "BCD"},
        {ch: "导论", q: "马克思一生的两个伟大发现是（    ）。", o: ["A.辩证法", "B.唯物史观", "C.剩余价值学说", "D.共产主义理论"], a: "BC"},
        {ch: "导论", q: "中国共产党坚持把马克思主义基本原理同中国具体实际相结合，先后形成的理论成果是（    ）。", o: ["A.毛泽东思想", "B.邓小平理论", "C.“三个代表”重要思想、科学发展观", "D.习近平新时代中国特色社会主义思想"], a: "ABCD"},
        {ch: "导论", q: "习近平新时代中国特色社会主义思想是（    ）。（重题校验）", o: ["A.是当代中国马克思主义", "B.是二十一世纪马克思主义", "C.是中华文化和中国精神的时代精华", "D.实现了马克思主义中国化时代化新的飞跃"], a: "ABCD"},
        {ch: "导论", q: "以下选项中，（    ）属于马克思主义的基本特征。", o: ["A.实践性", "B.科学性", "C.人民性", "D.发展性"], a: "ABCD"},
        {ch: "导论", q: "习近平总书记在纪念马克思诞辰200周年大会上的讲话上指出，马克思主义（    ）。", o: ["A.是科学的理论，创造性揭示了人类社会发展规律", "B.是人民的理论，第一次创立了人民实现自身解放的思想体系", "C.是实践的理论，指引着人民改造世界的行动", "D.是不断发展的开放的理论，始终站在时代前沿"], a: "ABCD"},
        {ch: "导论", q: "对待马克思主义，必须（    ）。", o: ["A.解放思想、实事求是", "B.与时俱进、求真务实", "C.坚持实践创新与理论创新", "D.既要坚持马克思主义，又要发展马克思主义"], a: "ABCD"},

        // 第一章
        {ch: "第一章", q: "唯物辩证法就其本质来说是批判的、革命的，因为它（      ）。", o: ["A.对现存事物的必然灭亡的理解", "B.对每一种既成的形式都从其暂时性方面去理解", "C.认为事物变化发展只有间断性，没有连续性", "D.在对现存事物的肯定的理解中包含对现存事物的否定的理解"], a: "ABD"},
        {ch: "第一章", q: "下列关于分析和综合论述正确的是（      ）。", o: ["A.分析是在思维中把认识对象分解为各个部分以便分别加以研究", "B.综合是把整体分解为各个因素的基础上，再把各个因素组合成一个整体", "C.分析是综合的基础", "D.综合是分析的完成"], a: "ABCD"},
        {ch: "第一章", q: "马克思主义的物质范畴具有哪些理论意义（      ）。", o: ["A.坚持了唯物主义一元论，同唯心主义一元论和二元论划清了界限", "B.坚持了能动的反映论和可知论，批判了不可知论", "C.体现了唯物论和辩证法的统一，克服了形而上学唯物主义的缺陷", "D.体现了唯物主义自然观和历史观的统一"], a: "ABCD"},
        {ch: "第一章", q: "偶然和必然的辩证关系是（      ）。", o: ["A.没有脱离偶然的必然", "B.没有脱离必然的偶然", "C.偶然和必然可以相互转化", "D.大量的偶然中存在着必然"], a: "ABCD"},
        {ch: "第一章", q: "联系的特点主要包括（      ）。", o: ["A.联系具有客观性", "B.联系具有普遍性", "C.联系具有多样性", "D.联系具有条件性"], a: "ABCD"},
        {ch: "第一章", q: "下列关于唯物辩证法否定观的基本内容叙述正确的是（      ）。", o: ["A.否定是事物的自我否定，是事物内部矛盾运动的结果", "B.否定是事物发展的环节，是旧事物向新事物的转变", "C.否定是新旧事物联系的环节，新事物孕育产生于旧事物", "D.辩证否定的实质是新事物对旧事物彻底的否定"], a: "ABC"},
        {ch: "第一章", q: "下列关于矛盾同一性和斗争性关系描述正确的是（      ）。", o: ["A.矛盾同一性和斗争性相互联系、相辅相成", "B.没有斗争性就没有同一性", "C.没有同一性也没有斗争性", "D.同一性寓于斗争性之中"], a: "ABC"},
        {ch: "第一章", q: "本质和现象的关系是（      ）。", o: ["A.本质决定现象", "B.现象表现本质", "C.本质和现象是彼此分隔的", "D.假象不反映事物的本质"], a: "AB"},
        {ch: "第一章", q: "现象和本质的区别是（      ）。", o: ["A.本质是不变化的，现象则是富于变化的", "B.现象是表面和外在的，可以直接为人的感官所感知", "C.本质深藏于事物内部，只有通过理性思维才能把握", "D.本质是固定的，现象则是多变的"], a: "BC"},
        {ch: "第一章", q: "矛盾普遍性和特殊性的关系是（      ）。", o: ["A.普遍性存在于特殊性之中", "B.特殊性存在于普遍性之中", "C.普遍性和特殊性相互联结", "D.普遍性和特殊性是可以分离的"], a: "AC"},
        {ch: "第一章", q: "矛盾斗争性在事物发展中的作用是（      ）。", o: ["A.矛盾斗争性规定着事物转化的可能和发展趋势", "B.矛盾斗争性为对立面转化、事物的质变创造条件", "C.矛盾斗争性是一种矛盾统一体向另一种矛盾统一体过渡的决定力量", "D.矛盾斗争性是事物存在和发展的前提"], a: "BC"},
        {ch: "第一章", q: "人工智能为什么不能代替人类的意识？（      ）。", o: ["A.人工智能不具备情感、信念、意志等人类意识形式", "B.社会性是人的意识所固有的本质属性，而人工智能不可能真正具备人类的社会属性", "C.人脑中的所有东西都可以化约为数字信号", "D.人工智能难以完全具备理解自然语言真实意义的能力"], a: "ABD"},
        {ch: "第一章", q: "留一些熟透的柿子给喜鹊作食物，保证来年柿子丰收。这给我们的启示是（      ）。", o: ["A.事物之间有其固有的客观联系", "B.人们可以发现并利用规律来实现自己的目的", "C.人与自然的关系是相互利用的关系", "D.保持生态系统平衡是人类生存发展的必要条件"], a: "ABD"},
        {ch: "第一章", q: "鲁迅说“描神画鬼，毫无对证...写出来的却是三只眼、长颈子...”这段话说明（      ）。", o: ["A.人按照自己的形象塑造出来的", "B.人脑对客观世界的歪曲反映", "C.人脑对鬼神的虚幻反映", "D.可以从人世间找到它的原型"], a: "ABD"},
        {ch: "第一章", q: "辩证唯物主义认为，意识的能动作用主要体现在（      ）。", o: ["A.意识活动有目的性", "B.意识具有计划性", "C.意识具有创造性，不依赖物质手段也能创造物质", "D.意识具有指导、控制人的行为和生理活动的作用"], a: "ABD"},
        {ch: "第一章", q: "运动是绝对的，静止是相对的，因为（       ）。", o: ["A.运动是物质的根本属性", "B.运动是普遍的、永恒的、无条件的", "C.静止是运动的特殊状态", "D.静止是暂时的、局部的，有条件的"], a: "ABCD"},
        {ch: "第一章", q: "矛盾的同一性在事物发展中的作用主要表现在（      ）。", o: ["A.同一性促进力量变化为质变创造条件", "B.同一性是事物存在和发展的前提", "C.同一性使矛盾双方相互吸收有利于自身的因素", "D.同一性规定着事物转化的可能和发展的趋势"], a: "BCD"},
        {ch: "第一章", q: "事物的肯定方面是指（      ）。", o: ["A.好的方面", "B.事物中维持其存在的方面", "C.正确的方面", "D.决定了一事物是其自身而不是他物的方面"], a: "BD"},
        {ch: "第一章", q: "否定之否定规律揭示了（      ）。", o: ["A.事物发展是螺旋式上升", "B.事物发展是波浪式前进", "C.事物发展周而复始的循环", "D.事物发展是前进性和曲折性统一"], a: "ABD"},
        {ch: "第一章", q: "下列选项中，属于唯物辩证法基本规律的有（      ）。", o: ["A.量变质变规律", "B.对立统一规律", "C.联系发展规律", "D.否定之否定规律"], a: "ABD"},
        {ch: "第一章", q: "下列说法体现正确对待矛盾特殊性原理的有（      ）。", o: ["A.物极必反，相反相成", "B.因材施教，因人而异", "C.因时制宜，因地制宜", "D.对症下药，量体裁衣"], a: "BCD"},
        {ch: "第一章", q: "下列选项中，体现量变引起质变这一哲学道理的有（      ）。", o: ["A.千里之堤，溃于蚁穴", "B.水滴石穿，绳锯木断", "C.近朱者赤，近墨者黑", "D.不积细流，无以成江海"], a: "ABD"},
        {ch: "第一章", q: "下列选项中，说明要坚持适度原则的有（      ）。", o: ["A.因地制宜", "B.掌握火候", "C.注意分寸", "D.适可而止"], a: "BCD"},
        {ch: "第一章", q: "“巧妇难为无米之炊”的哲学含义是（      ）。", o: ["A.意识是第一性的，物质是第二性的", "B.物质是第一性的，意识是第二性的", "C.主观能动性的发挥，必须尊重客观规律", "D.正确发挥人的主观能动性还要依赖于一定的物质条件和物质手段"], a: "BCD"},
        {ch: "第一章", q: "新事物之所以可以战胜旧事物其原因在于（      ）。", o: ["A.新事物具有新的结构和功能，它适应已经变化了的环境", "B.新事物既否定了旧事物中消极的东西，又保留了合理的因素", "C.在社会历史领域，新事物符合人民群众的利益和要求", "D.新事物从一开始就力量强大"], a: "ABC"},
        {ch: "第一章", q: "事物的发展体现着（   ）与（   ）的统一。", o: ["A.前进性", "B.曲折性", "C.稳定性", "D.长期性"], a: "AB"},
        {ch: "第一章", q: "思维和存在的关系问题包括（      ）。", o: ["A.物质世界是否发展变化的问题", "B.思维和存在何者为第一性的问题", "C.认识世界和改造世界的关系问题", "D.思维 and 存在有无同一性的问题"], a: "BD"},
        {ch: "第一章", q: "时间是物质运动的持续性、顺序性，它具有一维性的特征。下列符合的有（      ）。", o: ["A.少壮不努力，老大徒伤悲", "B.机不可失，时不再来", "C.盛年不重来，一日难再晨", "D.光阴好比河中水，只能流去不流回"], a: "ABCD"},
        {ch: "第一章", q: "形而上学唯物主义物质观的主要缺陷是（      ）。", o: ["A.把物质归结为某种“不可分”的实物粒子", "B.把原子的属性看成是物质的一般属性", "C.把物质的个别形态误认为是物质的共性", "D.混淆了自然科学的物质结构概念与哲学的物质范畴的界限"], a: "ABCD"},
        {ch: "第一章", q: "辩证唯物主义物质观认为，物质是（       ）。", o: ["A.从各种实物的总和中抽取出来的哲学概念", "B.各种具体物质形态的共性", "C.不依赖于人的感觉而存在的客观实在", "D.人的感觉的复合体"], a: "ABC"},
        {ch: "第一章", q: "以下各项中包含矛盾相互依存、相互转化思想的有（       ）。", o: ["A.物极必反，相反相成", "B.乐极生悲，苦尽甘来", "C.祸兮福所倚，福兮祸所伏", "D.千里之堤，溃于蚁穴"], a: "ABC"},
        {ch: "第一章", q: "意识是客观世界的主观映象，说明（        ）。", o: ["A.意识的内容是客观的，形式是主观的", "B.意识的内容是主观的，形式是客观的", "C.意识是人脑对客观世界的反映", "D.意识体现了主观与客观的统一"], a: "ACD"},
        {ch: "第一章", q: "意识是（         ）。", o: ["A.物质世界长期发展的产物", "B.人类社会历史发展的产物", "C.人脑特有的机能 and 属性", "D.客观世界的主观映象"], a: "ABCD"},
        {ch: "第一章", q: "意识能动性的主要表现是（         ）。", o: ["A.意识活动的目的性和计划性", "B.意识活动的创造性", "C.意识具有对调控人的行为和生理活动的作用", "D.对改造世界的指导作用"], a: "ABCD"},
        {ch: "第一章", q: "对立统一规律是唯物辩证法的实质和核心，是因为它（        ）。", o: ["A.揭示了事物发展的方向和道路", "B.揭示了事物普遍联系的根本内容和变化发展的内在动力", "C.提供了人们认识世界和改造世界的根本方法——矛盾分析方法", "D.是贯穿质量互变、否定之否定规律的中心线索"], a: "BCD"},
        {ch: "第一章", q: "下列格言或成语中，体现量变质变规律的有（         ）。", o: ["A.九层之台，起于垒土", "B.有无相生，前后相随", "C.月晕而风，础润而雨", "D.千里之堤，溃于蚁穴"], a: "AD"},
        {ch: "第一章", q: "世界的物质统一性表现在（        ）。", o: ["A.自然界是物质的", "B.人类社会本质上是生产实践基础上形成的物质体系", "C.人的意识统一于物质", "D.世界的物质统一性是哲学家们来证明的"], a: "ABC"},
        {ch: "第一章", q: "属于矛盾的特殊性的表现的有（        ）。", o: ["A.对症下药，量体裁衣", "B.欲擒故纵，声东击西", "C.因时制宜，因地制宜", "D.因材施教，因人而异"], a: "ACD"},
        {ch: "第一章", q: "人的活动与规律的关系是（        ）。", o: ["A.人不能创造规律", "B.人不能消灭规律", "C.人可以完善规律", "D.人可以认识和利用规律"], a: "ABD"},
        {ch: "第一章", q: "矛盾的同一性和斗争性的辩证关系是（          ）。", o: ["A.相互联结、相辅相成", "B.斗争性寓于同一性当中", "C.同一性通过斗争性体现", "D.矛盾的同一性和斗争性相结合，构成了事物的矛盾运动"], a: "ABCD"},
        {ch: "第一章", q: "物质世界的二重化包括：（         ）。", o: ["A.从自然界中分化出人类社会", "B.从物质世界中分化出生物界", "C.从客观世界中分化出主观世界", "D.从主观世界中分化出人类意识"], a: "AC"},
        {ch: "第一章", q: "下列说法中，正确体现主观能动性与客观规律性的关系的有（         ）。", o: ["A.巧妇难为无米之炊", "B.人在客观规律面前无能为力", "C.只有充分发挥主观能动性，才能正确认识和利用客观规律", "D.从现实条件出发，尊重客观规律"], a: "ACD"},
        {ch: "第一章", q: "辩证否定的实质是“扬弃”，“扬弃”是（        ）。", o: ["A.连续性和非连续性的统一", "B.联系和发展的统一", "C.包含着肯定的否定", "D.对旧事物只克服不保留"], a: "ABC"},
        {ch: "第一章", q: "在唯物辩证法看来，否定（        ）。", o: ["A.是事物的自我否定", "B.是事物发展的环节", "C.是新旧事物联系的环节", "D.实质是“扬弃”"], a: "ABCD"},

        // 第二章
        {ch: "第二章", q: "实践的中介系统包括（  ）。", o: ["A.作为人的肢体延长、感官延伸、体能放大的物质性工具系统", "B.语言符号工具系统", "C.进入主体认识和实践范围的各种物质系统", "D.在思维中把对象的某种属性、因素抽取出来的逻辑方法与操作系统"], a: "AB"},
        {ch: "第二章", q: "实践在认识中的决定作用表现在（  ）。", o: ["A.实践是认识的来源", "B.实践是认识发展的动力", "C.实践是认识的目的", "D.实践是检验认识真理性的唯一标准"], a: "ABCD"},
        {ch: "第二章", q: "大致看来，实践的形式可分为三种基本类型：（  ）。", o: ["A.物质生产实践", "B.社会政治实践", "C.科学文化实践", "D.虚拟实践"], a: "ABC"},
        {ch: "第二章", q: "从认识到实践的飞跃其必要性和重要性在于两方面：（  ）。", o: ["A.认识世界的目的是改造世界", "B.认识的真理性只有在实践中才能得到检验和发展", "C.理论本身就是物质力量", "D.理论的作用可以通过实践表现出来"], a: "AB"},
        {ch: "第二章", q: "辩证唯物主义认识论与旧唯物主义认识论的区别具体表现在（  ）。", o: ["A.辩证唯物主义是能动的反映论，旧唯物主义是直观的反映论", "B.辩证唯物主义把实践的观点引入了认识论", "C.辩证唯物主义把辩证法应用于反映论", "D.辩证唯物主义认为认识是一个不断发展的过程"], a: "ABCD"},
        {ch: "第二章", q: "价值的客观性在于（  ）。", o: ["A.主体的创造", "B.主体的存在和需要是客观的，而不是抽象的", "C.客体的存在、属性及作用是客观的", "D.真理的客观性决定了价值的客观性"], a: "BC"},
        {ch: "第二章", q: "下列说法正确的有（  ）。", o: ["A.真理是具体的就是说真理是唯一的", "B.价值是抽象的就是说价值是多维的", "C.主体和客体的不断变化决定了价值的社会历史性", "D.价值评价是对客观价值关系的主观反映"], a: "CD"},
        {ch: "第二章", q: "下列选项中，正确表述感性认识和理性认识关系的有（  ）。", o: ["A.感性认识和理性认识相互渗透", "B.理性认识是感性认识的总和", "C.理性认识依赖于感性认识", "D.感性认识有待于发展到理性认识"], a: "ACD"},
        {ch: "第二章", q: "认识世界和改造世界是辩证的统一，表现在（  ）。", o: ["A.认识的任务归根到底在于解释世界", "B.正确认识世界是有效改造世界的必要前提", "C.人们只有在改造世界的实践中才能不断地深化、拓展对世界的正确认识", "D.认识世界和改造世界的过程是从必然走向自由的过程"], a: "BCD"},
        {ch: "第二章", q: "“按图索骥”的错误在于（  ）。", o: ["A.理论脱离实际", "B.经验论", "C.教条主义", "D.唯理论"], a: "ACD"},
        {ch: "第二章", q: "价值和真理在实践中是辩证统一的，表现在（  ）。", o: ["A.人们的实践活动总是受着真理尺度和价值尺度的制约", "B.价值尺度必须以真理为前提", "C.真理是实践追求的根本目标", "D.人类自身需要的内在尺度，推动着人们不断发现新的真理"], a: "ABD"},
        {ch: "第二章", q: "感觉和概念的区别在于（  ）。", o: ["A.感觉是感性认识的形式，概念是理性认识的形式", "B.感觉是直接反映，概念是对本质属性的概括和反映", "C.感觉具有直接性，概念具有间接性", "D.感觉具有具体性，概念具有抽象性"], a: "ABCD"},
        {ch: "第二章", q: "下列属于理性认识的是（  ）。", o: ["A.余音绕梁，三日不绝", "B.蹲点调查，掌握材料", "C.调查研究，制定政策", "D.总结经验，深化认识"], a: "CD"},
        {ch: "第二章", q: "人的认识过程是一个在实践基础上不断深化的发展过程，表现为（  ）。", o: ["A.从间接经验到直接经验的转化", "B.从抽象到具体再到抽象的上升运动", "C.从实践到认识，再从认识到实践的循环往复和无限发展的总过程", "D.实践基础上由感性认识到理性认识，再从理性认识到实践的具体认识过程"], a: "CD"},
        {ch: "第二章", q: "辩证的认识运动包括两次飞跃，它们是（  ）。", o: ["A.从感性认识上升到理性认识", "B.从实践到新的实践", "C.从理性认识又回到感性认识", "D.从理性认识到实践"], a: "AD"},
        {ch: "第二章", q: "人们制订出蓝图，然后再施工完成，这件事说明（    ）。", o: ["A.逻辑证明有着比实践更为重要的作用", "B.逻辑证明同实践一样重要", "C.逻辑证明可以为实践活动提供理论论证", "D.已被逻辑证明了的东西，还必须经过实践的检验"], a: "CD"},
        {ch: "第二章", q: "实践标准的确定性或绝对性，由实践标准的（  ）所决定。", o: ["A.客观性", "B.唯一性", "C.相对性", "D.真理性"], a: "AB"},
        {ch: "第二章", q: "“谎言重复一千次就会变成真理”，这种说法的错误在于它认为是（    ）。", o: ["A.真理和谬误没有确定的界限", "B.真理和谬误有确定的界限", "C.真理在一定条件下可以转化为谬误", "D.真理没有客观标准"], a: "AD"},
        {ch: "第二章", q: "科学实践观的创立和发展的意义，主要表现在（  ）。", o: ["A.为辩证唯物主义奠定了科学的理论基础", "B.建立了科学的、能动的、革命的反映论", "C.第一次揭示了社会生活的实践本质", "D.为人们能动地认识世界和改造世界提供了基本的思想方法"], a: "ABCD"},
        {ch: "第二章", q: "真理与价值或真理尺度与价值尺度是紧密联系的辩证统一关系。以下说法正确的是（  ）。", o: ["A.真理尺度与价值尺度的统一是具体的、历史的", "B.人类自身需要的内在尺度，推动着人们不断发现新的真理", "C.价值尺度必须以真理为前提", "D.在实践中人们都是按照自己的尺度和需要去认识世界和改造世界"], a: "ABCD"},
        {ch: "第二章", q: "真理的客观性的含义是（  ）。", o: ["A.指真理的内容是对客观事物及其规律的正确反映", "B.客观性是真理的本质属性，但是真理的形式又是主观的", "C.事物及其规律本身就是真理", "D.真理中包含着不依赖于人和人的意识的客观内容"], a: "ABD"},
        {ch: "第二章", q: "读万卷书，更要行万里路。从哲学上讲，这是因为（  ）。", o: ["A.真理是永恒不变的", "B.理论是否正确要接受实践检验，并在实践中得到发展", "C.人们通过实践获得认识的最终目的是为实践服务", "D.感性认识高于理性认识"], a: "BC"},
        {ch: "第二章", q: "认识是主体对客体能动的反映，是摹写性与创造性的统一，把二者割裂开来会导致（  ）。", o: ["A.唯心主义认识论", "B.直观被动的反映论", "C.经验论", "D.唯理论"], a: "AB"},
        {ch: "第二章", q: "下列各项关于真理的绝对性的含义说法正确的有（    ）。", o: ["A.包含着不依赖人和人的意识的客观内容，都同谬误有原则的界限", "B.任何真理都是对客观世界各个方面的正确认识", "C.任何真理性的认识都会随着客观世界的变化而变化", "D.人类认识能够正确认识无限发展着的物质世界"], a: "AD"},
        {ch: "第二章", q: "真理的绝对性和真理的相对性是辩证统一的，表现在（  ）。", o: ["A.真理的绝对性和相对性相互依存", "B.真理的绝对性和相对性相互包含", "C.任何真理的相对性之中都包含着真理绝对性的颗粒", "D.真理的绝对性通过真理的相对性表现出来"], a: "ABCD"},
        {ch: "第二章", q: "实践是认识发展的动力，这是因为（    ）。", o: ["A.实践的需要推动认识的产生和发展", "B.实践推动人类的科学发现和技术发明", "C.实践推动人类的思想进步和理论创新", "D.实践为认识的发展提供了手段和条件"], a: "ABCD"},
        {ch: "第二章", q: "价值的客观性是（  ）。（与第6题稍有重合）", o: ["A.主体的存在和需要是客观的，而不是抽象的", "B.客体的存在、属性及作用是客观的", "C.价值关系的形成依赖于主体的存在", "D.价值关系的形成依赖于主体的创造"], a: "AB"},
        {ch: "第二章", q: "“只要再多走一小步，仿佛是向同一方向迈的一小步，真理便会变成错误。”这说明（  ）。", o: ["A.真理和谬误没有确定的界限", "B.真理和谬误在一定条件下可以相互转化", "C.沿着真理的方向继续前行会使真理变成谬误", "D.真理和谬误的对立只是在非常有限的领域内才有绝对的意义"], a: "BD"},
        {ch: "第二章", q: "下列选项中，正确说明真理与谬误关系的有（  ）。", o: ["A.真理和谬误在一定条件下是可以相互转化的", "B.真理和谬误相比较而存在", "C.真理和谬误相斗争而发展", "D.真理和谬误相互包含"], a: "ABC"},
        {ch: "第二章", q: "西红柿由无人敢吃到广为传播的故事包含的哲理是（  ）。", o: ["A.实践是认识的来源", "B.人的正确认识经过一次飞跃不行", "C.实践是检验认识正确与否的唯一标准", "D.人们对事物的认识经历着一个反复无限的过程"], a: "ACD"},
        {ch: "第二章", q: "在认识的本质问题上，旧唯物主义认识论的缺陷在于（  ）。", o: ["A.没有坚持从物到感觉的认识路线", "B.不了解实践对认识的决定作用", "C.看不到主观和客观之间的矛盾及其相互作用", "D.没有把认识看作一个不断发展的过程"], a: "BCD"},
        {ch: "第二章", q: "从实践到认识的过程中，认识采取的方式有（  ）。", o: ["A.感性认识", "B.直观反映论", "C.理性认识", "D.能动反映论"], a: "AC"},
        {ch: "第二章", q: "感性认识和理性认识密切相关，主要体现在（  ）。", o: ["A.理性认识依赖于感性认识", "B.感性认识有待于深化和发展为理性认识", "C.感性认识和理性认识相互包含", "D.感性认识和理性认识相互渗透"], a: "ABCD"},
        {ch: "第二章", q: "感性认识上升为理性认识所具备的条件是（  ）。", o: ["A.深入实践，获取合乎实际的感性材料", "B.将感性材料整理后，用来指导实践", "C.坚持理论和实际相结合的原则", "D.经过理性思考，对感性材料进行加工"], a: "AD"},
        {ch: "第二章", q: "“实践、认识、再实践、再认识，循环往复以至无穷...”这段话说明（  ）。", o: ["A.人们在实践中对真理的认识永远没有完结", "B.认识过程不是封闭式的循环，也不是直线式的发展", "C.认识过程是沿着科学性方向不断深化发展的过程", "D.认识过程是反复循环和无限发展的过程"], a: "ABCD"},
        {ch: "第二章", q: "“不了解、不熟悉马克思主义基本原理，就不可能真正了解和掌握中国特色社会主义理论体系。”这段话说明（  ）。", o: ["A.马克思主义经典作家没有穷尽真理", "B.在实践中我们必须以马克思主义为指导", "C.马克思主义是绝对性和相对性的统一", "D.在实践中我们必须丰富和发展马克思主义"], a: "ABCD"},
        {ch: "第二章", q: "“只要再多走一小步...真理就会变成错误。”这一论断说明（  ）。（重复题）", o: ["A.真理和谬误没有确定的界限", "B.真理和谬误在一定的条件下可以转化", "C.沿着真理的方向继续前进会使真理变成谬误", "D.真理和谬误的对立只有在非常有限的领域内才有绝对的意义"], a: "BD"},
        {ch: "第二章", q: "价值评价是一种关于价值现象的认识活动，其特点有（  ）。", o: ["A.评价结果依主体的特点而转移", "B.评价是以主客体的价值关系为认识对象", "C.评价结果的正确与否依赖于相关的知识性认识", "D.价值评价是一种没有任何客观标准的评价"], a: "ABC"},
        {ch: "第二章", q: "“实践没有止境，理论创新也没有止境。”这段话说明（  ）。", o: ["A.实践与认识的辩证运动是循环往复以至无穷的辩证发展过程", "B.经过两次飞跃，实践与认识的运动既完成了又没有完成", "C.正确的认识需要多次反复才能完成", "D.认识过程是一个波浪式前进和螺旋式上升的过程"], a: "ABCD"},
        {ch: "第二章", q: "割裂感性认识和理性认识的统一，就会导致（    ）。", o: ["A.唯理论", "B.诡辩论", "C.经验论", "D.宿命论"], a: "AC"},

        // 第三章
        {ch: "第三章", q: "社会存在也称社会物质生活条件，其中包括（  ）。", o: ["A.地理环境", "B.人口因素", "C.物质生产及生产方式", "D.生产关系性质"], a: "ABC"},
        {ch: "第三章", q: "国家是（  ）。", o: ["A.阶级矛盾不可调和的产物和表现", "B.统治阶级进行阶级压迫的暴力工具", "C.统治阶级的国家", "D.全体国民的国家"], a: "ABC"},
        {ch: "第三章", q: "下列关于生产关系的说法正确的有（  ）。", o: ["A.生产关系是生产力的形式，生产力是生产关系的内容", "B.生产关系体现着人与自然界的关系", "C.生产关系是人类各种关系中最核心的内容和最基本的关系", "D.生产资料所有制形式是生产关系各方面内容中起决定作用的方面"], a: "CD"},
        {ch: "第三章", q: "交往是人类实践活动的重要组成部分，对社会生活的重要影响包括（  ）。", o: ["A.促进生产力的发展", "B.促进社会关系的进步", "C.促进文化的发展与传播", "D.促进人的全面发展"], a: "ABCD"},
        {ch: "第三章", q: "物质生活资料的生产方式是人类社会存在和发展的决定力量。这是因为（  ）。", o: ["A.生产方式是人类生活资料谋得的方式", "B.生产方式决定整个社会的面貌", "C.生产方式决定社会制度的性质", "D.生产方式决定社会制度的更替"], a: "ABCD"},
        {ch: "第三章", q: "上层建筑是一个庞大的体系，可以把它们归结为两个组成部分。这两个部分是（  ）。", o: ["A.政治思想和制度", "B.法律思想和制度", "C.观念上层建筑", "D.政治上层建筑"], a: "CD"},
        {ch: "第三章", q: "生产资料所有制形式是整个生产关系的基础，这是因为（  ）。", o: ["A.它决定了整个生产关系的性质", "B.它决定人们在生产中的地位和作用", "C.它决定生产水平的高低", "D.它决定产品的分配方式"], a: "ABD"},
        {ch: "第三章", q: "人们对于社会形态的历史选择，最终决定于（  ）。", o: ["A.人民群众的根本利益", "B.人民群众的根本意愿", "C.人民群众对社会规律的把握和顺应程度", "D.领导层的根本利益和根本意愿"], a: "ABC"},
        {ch: "第三章", q: "事实雄辩证明，只有改革开放才能（  ）。", o: ["A.发展中国", "B.发展社会主义", "C.发展马克思主义", "D.形成和发展中国特色社会主义"], a: "ABCD"},
        {ch: "第三章", q: "英雄史观产生的根源有（  ）。", o: ["A.停留于历史现象表面的认识根源", "B.少数人从事政治统治、垄断精神文化生活的社会历史根源", "C.剥削阶级思想家出于阶级偏见的阶级根源", "D.人的认识能力有限的认识根源"], a: "ABC"},
        {ch: "第三章", q: "社会基本矛盾在社会历史发展中的作用主要表现在（  ）。", o: ["A.生产力是社会基本矛盾运动中最基本的动力因素", "B.生产力和生产关系的矛盾，决定着社会中其他矛盾的存在和发展", "C.社会基本矛盾具有不同的表现形式和解决方式", "D.社会基本矛盾从根本上影响和促进社会形态的变化和发展"], a: "ABCD"},
        {ch: "第三章", q: "社会意识的相对独立性表现为（  ）。", o: ["A.它的发展变化与社会存在的发展变化不完全同步", "B.它与社会经济水平之间发展上的不平衡性", "C.它的发展往往具有历史继承性", "D.各种社会意识形式之间的相互作用和影响"], a: "ABCD"},
        {ch: "第三章", q: "在生产力和生产关系的相互关系中，（  ）。", o: ["A.生产力决定生产关系", "B.生产关系决定生产力", "C.生产力决定生产关系，生产关系也决定生产力", "D.适合生产力状况的生产关系推动生产力的发展"], a: "AD"},
        {ch: "第三章", q: "经济基础对上层建筑的决定作用主要表现在（  ）。", o: ["A.经济基础决定上层建筑的产生、变化与发展", "B.经济基础决定上层建筑的性质", "C.经济基础决定上层建筑是否具有反作用", "D.经济基础决定上层建筑是否包括自然科学"], a: "AB"},
        {ch: "第三章", q: "文化对社会发展有着巨大的影响，积极作用体现在（  ）。", o: ["A.文化为社会发展提供思想指引", "B.文化为社会发展提供精神动力", "C.文化为社会发展提供凝聚力量", "D.文化为社会发展提供物质基础"], a: "ABC"},
        {ch: "第三章", q: "在社会存在与社会意识的关系问题上，唯物史观认为（  ）。", o: ["A.社会存在决定社会意识的产生和发展", "B.社会意识反映社会存在", "C.社会意识与社会存在的发展完全同步", "D.社会意识能动地反作用于社会存在"], a: "ABD"},
        {ch: "第三章", q: "生产力是人们（  ）。", o: ["A.能动地改造物质世界的实际能力", "B.不能自由选择的物质力量", "C.在生产中形成的物质利益关系", "D.解决人同自然之间矛盾的实际能力"], a: "ABD"},
        {ch: "第三章", q: "下列说法中，关于“社会存在”的正确理解是（  ）。", o: ["A.社会存在也就是指社会物质生活条件", "B.社会存在主要是指物质生活资料的生产及其生产方式", "C.社会存在是由社会意识所引导和决定的", "D.地理环境和人口因素也属于社会存在的范畴"], a: "ABD"},
        {ch: "第三章", q: "下面关于社会意识的理解中，正确的是（  ）。", o: ["A.社会意识是社会存在的反映", "B.社会意识包括政治法律思想、道德、宗教、哲学和艺术等方面", "C.社会意识是具体的、历史的", "D.在阶级社会中，社会意识形态是具有阶级性的"], a: "ABCD"},
        {ch: "第三章", q: "下列命题符合唯物史观的有（  ）。", o: ["A.社会发展程度越高，对地理环境的利用就越充分", "B.社会发展程度越高，就越能合理地利用地理环境", "C.社会越是发展，对地理环境的破坏就越大", "D.社会越是不发展，对地理环境的依赖性就越大"], a: "ABD"},
        {ch: "第三章", q: "物质生产方式对社会发展的决定作用主要表现在（  ）。", o: ["A.它是社会存在和发展的物质基础", "B.它规定了社会制度的性质", "C.它是社会制度变革的根本力量", "D.它决定了社会的基本面貌"], a: "ABCD"},
        {ch: "第三章", q: "人类社会发展是一个“自然历史过程”这意味着（  ）。", o: ["A.社会与自然界一样是一个合乎规律的辩证发展过程", "B.社会运动本质上是一种高级的物质运动形式", "C.人们有可能像自然科学那样用精确的眼光来研究人类社会", "D.社会规律与自然规律在本质上是相同的，但表现方式不同"], a: "ABCD"},
        {ch: "第三章", q: "社会意识的相对独立性主要表现在（  ）。（与12题侧重稍有不同）", o: ["A.社会意识对社会存在的反映有自己特有的发展形式和规律", "B.社会意识与社会存在的发展具有不平衡性", "C.社会意识内部各种形式均有自成系统、前后相继的历史链条", "D.社会意识对社会存在具有能动的反作用"], a: "ABCD"},
        {ch: "第三章", q: "正确解决社会存在和社会意识的关系的重大意义在于（  ）。", o: ["A.宣告了历史唯心主义的彻底破产", "B.为实现对社会现象的科学研究提供了理论依据", "C.为揭示社会发展的客观规律开辟了道路", "D.为无产阶级的革命实践提供了科学历史观和基本原则"], a: "ABCD"},
        {ch: "第三章", q: "文化是社会意识的重要组成部分，文化对社会发展的重要作用主要表现在（  ）。", o: ["A.文化为社会发展提供智力支持", "B.文化为社会发展提供凝聚力量", "C.文化为社会发展提供精神动力", "D.文化为社会发展提供思想保证"], a: "ABCD"},
        {ch: "第三章", q: "社会形态的更替具有如下特征（  ）。", o: ["A.社会形态的更替是统一性和多样性的统一", "B.社会形态的更替是必然性和人们的历史选择性的统一", "C.社会形态的更替是前进性和曲折性的统一", "D.社会形态的更替是顺序性和跨越性的统一"], a: "ABCD"},
        {ch: "第三章", q: "生产关系一定要适合生产力发展状况的规律其原因在于（  ）。", o: ["A.它揭示了人类社会发展的源泉、动力和一般过程", "B.它规定和制约着人类社会历史中的其他规律", "C.它决定并且制约着参与社会发展过程中自然界发展的客观规律", "D.它是人类社会在历史发展中始终起作用的规律"], a: "ABD"},
        {ch: "第三章", q: "面对生态环境被破坏的严峻情况，人类越来越重视环境问题，这是因为（  ）。", o: ["A.自然地理环境是人们生活和生产的自然基础", "B.自然地理环境能脱离社会生产而发生作用", "C.自然地理环境能决定社会的性质和社会发展的方向", "D.自然地理环境的优劣对社会发展起着促进或延缓的作用"], a: "AD"},
        {ch: "第三章", q: "生产力是人类在生产实践中形成的改造和影响自然以使其适合社会需要的物质力量。生产力（  ）。", o: ["A.具有客观现实性", "B.具有社会历史性", "C.表示人和社会的关系", "D.是生产的物质内容"], a: "ABD"},
        {ch: "第三章", q: "马克思的世界历史理论为我们观察全球化问题提供了指导。下列内容正确的有（  ）。", o: ["A.生产方式的发展变革是世界历史形成和发展的基础", "B.普遍交往是世界历史的基本特征", "C.世界历史的形成与发展为共产主义的实现提供了条件", "D.没有矛盾的和谐世界是世界历史发展的最终方向"], a: "ABC"},
        {ch: "第三章", q: "在马克思主义产生之前，唯心史观一直占据统治地位，它的主要缺陷是（  ）。", o: ["A.认为社会历史是精神发展史", "B.根本否定英雄人物对历史发展的作用", "C.根本否定精神对历史发展的作用", "D.根本否定人民群众是历史的创造者"], a: "AD"},
        {ch: "第三章", q: "阶级是（  ）。", o: ["A.历史范畴", "B.政治范畴", "C.经济范畴", "D.思想范畴"], a: "AC"},
        {ch: "第三章", q: "推动社会的发展是一个“动力系统”，其中（  ）。", o: ["A.社会基本矛盾是社会发展的根本动力", "B.阶级斗争是阶级社会发展的直接动力", "C.科技革命是推动历史前进的有力杠杆", "D.人人都是创造 and 推动历史前进的力量"], a: "ABC"},
        {ch: "第三章", q: "马克思指出：“各个人借以进行生产的社会关系...是随着生产力的变化和发展而改变的。”反映了（  ）。", o: ["A.生产力的任何变化都会立即引起生产关系的变革", "B.生产关系的反作用是生产力内在要求的体现", "C.生产力的发展要求决定生产关系的变革", "D.生产关系适合生产力状况的规律不以人类的意识为转移"], a: "CD"},
        {ch: "第三章", q: "“手推磨产生的是封建主义的社会，蒸汽磨产生的是工业资本家的社会。”这段话表明科学技术是（  ）。", o: ["A.历史上起推动作用的革命力量", "B.历史变革中的唯一决定性力量", "C.推动生产方式变革的重要力量", "D.一切社会变革中的自主性力量"], a: "AC"},
        {ch: "第三章", q: "社会意识的相对独立性表现为（   ）。（重复题）", o: ["A.社会意识可以脱离社会存在的制约而独立发展", "B.社会意识的发展同社会存在变化的不同步性", "C.社会意识的发展具有自身的历史继承性", "D.社会意识对社会存在具有能动的反作用"], a: "BCD"},
        {ch: "第三章", q: "社会革命的实质是（  ）。", o: ["A.国家政权在各阶级之间的相互转移", "B.国家政权在统治阶级内部各集团之间的相互转移", "C.革命阶级推翻反动阶级的统治", "D.用先进的社会制度代替腐朽的社会制度"], a: "CD"},
        {ch: "第三章", q: "马克思主义的社会形态理论指出（  ）。", o: ["A.社会形态是具体的、历史的", "B.社会形态是有机的统一整体", "C.社会形态是永恒的不变的", "D.社会形态是超社会的、超历史的"], a: "AB"},
        {ch: "第三章", q: "人民群众创造历史的决定作用表现在（  ）。", o: ["A.人民群众的活动创造了历史发展的规律", "B.人民群众是社会物质财富的创造者", "C.人民群众是变革社会制度的决定力量", "D.人民群众是社会精神财富的创造者"], a: "BCD"},
        {ch: "第三章", q: "唯物史观关于个人在历史上的作用，认为（  ）。", o: ["A.个人的作用只有顺应历史发展要求和人民群众意愿才是积极的", "B.历史人物在历史的发展过程中起着特殊的作用", "C.要从必然与偶然的辩证统一中理解个人的历史作用", "D.评价历史人物必须坚持历史分析方法和阶级分析方法"], a: "ABCD"},
        {ch: "第三章", q: "既承认人民群众的决定作用，又承认英雄人物对历史的重大影响作用。这种观点是（  ）。", o: ["A.坚持人民群众和英雄人物共同创造历史", "B.说明对群众作用的肯定内在地包含了对个人作用的肯定", "C.坚持人民群众创造历史的唯物史观", "D.把群众史观与英雄史观调和起来"], a: "BC"},
        {ch: "第三章", q: "“无论哪一种社会形态，在它所能容纳的全部生产力发挥出来以前，是决不会灭亡的...”这段话说明（  ）。", o: ["A.生产力的发展是促使社会形态更替的最终原因", "B.一种新的生产关系的产生需要客观的物质条件的成熟", "C.无论哪一种社会形态，当它还能够促进生产力发展时，是不会灭亡的", "D.社会形态总是具体的、历史的"], a: "ABCD"},

        // 第四章
        {ch: "第四章", q: "资本原始积累的主要途径（  ）。", o: ["A.资本家靠自身勤劳致富，兴办资本主义企业", "B.用暴力手段剥夺农民的土地", "C.用暴力手段掠夺货币财富", "D.资本家用经济手段诱使农民脱离土地成为雇佣劳动者"], a: "BC"},
        {ch: "第四章", q: "商品经济的基本矛盾是私人劳动和社会劳动的矛盾。这是因为（    ）。", o: ["A.它是商品经济各种内在矛盾的根源", "B.它决定私有制商品经济产生和发展的全过程", "C.它是决定和影响价格的重要因素", "D.它决定商品生产者的命运"], a: "ABD"},
        {ch: "第四章", q: "下列关于价值和使用价值的表述，正确的有（  ）。", o: ["A.使用价值是商品的自然属性", "B.使用价值是具体劳动创造的，而价值是由抽象劳动形成的", "C.使用价值和价值相互依存，互为条件，又相互对立", "D.价值是商品的社会属性"], a: "ABCD"},
        {ch: "第四章", q: "价值是商品的本质属性，它是（  ）。", o: ["A.凝结在商品中的抽象劳动", "B.商品的社会属性", "C.交换价值的基础", "D.反映商品生产者之间的社会关系"], a: "ABCD"},
        {ch: "第四章", q: "具体劳动和抽象劳动的区别是（  ）。", o: ["A.具体劳动是劳动的具体形式，抽象劳动是一般人类劳动", "B.具体劳动是体力劳动，抽象劳动是脑力劳动", "C.具体劳动反映人与自然的关系，抽象劳动反映社会生产关系", "D.具体劳动创造商品的使用价值，抽象劳动形成商品的价值"], a: "ACD"},
        {ch: "第四章", q: "商品价值形式经历的阶段有（  ）。", o: ["A.简单的或偶然的价值形式", "B.总和的或扩大的价值形式", "C.一般价值形式", "D.货币形式"], a: "ABCD"},
        {ch: "第四章", q: "下列关于价值规律表述，正确的是（  ）。", o: ["A.商品的价值量由生产商品的社会必要劳动时间决定的", "B.商品交换要以价值量为基础，按照等价交换的原则进行", "C.价值规律要求每一次商品交换价格都必须要符合价值", "D.价值规律的表现形式是价格围绕价值自发波动"], a: "ABD"},
        {ch: "第四章", q: "价值规律的作用表现在（  ）。", o: ["A.自发地调节生产资料和劳动力在社会各生产部门之间的分配比例", "B.自发地刺激社会生产力的发展", "C.自发地调节社会收入的分配", "D.自发地增加工人收入"], a: "ABC"},
        {ch: "第四章", q: "价值规律对经济活动会产生一些消极后果，这体现在（  ）。", o: ["A.导致社会资源浪费", "B.改善工人生活水平", "C.阻碍技术的进步", "D.导致收入两极分化"], a: "ACD"},
        {ch: "第四章", q: "使用价值、交换价值、价值三者之间的关系是（  ）。", o: ["A.使用价值是交换价值和价值的物质承担者", "B.价值寓于使用价值中", "C.价值是交换价值的基础和内容", "D.交换价值是价值的表现形式"], a: "ABCD"},
        {ch: "第四章", q: "价格围绕价值上下波动，不是对价值规律作用的否定，而是其表现形式，因为（  ）。", o: ["A.商品交换总是按照价格与价值相一致的原则进行的", "B.从商品交换的总体看，价格总额与价值总额是相等的", "C.从商品交换的较长时间看，价格与价值是趋于一致的", "D.各种商品价格的波动，是以各自的价值为基础的"], a: "BCD"},
        {ch: "第四章", q: "劳动力成为商品的基本条件是（  ）。", o: ["A.劳动力具有使用价值", "B.劳动者是“自由人”，能自由支配自己的劳动力", "C.劳动者除了自己的劳动力外一无所有，不得不靠出卖劳动力", "D.劳动力具有价值"], a: "BC"},
        {ch: "第四章", q: "劳动力商品的价值包括（  ）。", o: ["A.维持劳动者本人生存所必需的生活资料的价值", "B.为维持劳动者家属的生存所必需的生活资料的价值", "C.劳动者接受教育和训练所支出的费用", "D.劳动者在劳动过程中创造出来的自身的价值"], a: "ABC"},
        {ch: "第四章", q: "剩余价值理论的意义（  ）。", o: ["A.揭露了资本主义生产关系的剥削本质", "B.阐明了资产阶级和无产阶级之间阶级斗争的经济根源", "C.指出了无产阶级革命的历史必然性", "D.由于唯物史观和剩余价值的发现，社会主义由空想变为科学"], a: "ABCD"},
        {ch: "第四章", q: "资本主义政治制度的局限性表现为（  ）。", o: ["A.资本主义的民主是资产阶级精英统治下的民主", "B.法律名义上的平等掩盖着事实上的不平等", "C.政党制是维护资产阶级统治的政治制度", "D.政党恶斗，决策效率低下，激化社会矛盾"], a: "ABCD"},
        {ch: "第四章", q: "资本主义工资的形式主要有（  ）。", o: ["A.计时工资", "B.平均工资", "C.计件工资", "D.补贴工资"], a: "AC"},
        {ch: "第四章", q: "根据资本在剩余价值生产中所起的作用不同，可以将资本分为（  ）。", o: ["A.不变工资", "B.预付资本", "C.全部资本", "D.可变资本"], a: "AD"},
        {ch: "第四章", q: "商品经济是一定社会历史条件的产物。商品经济得以产生的社会条件有（  ）。", o: ["A.商品具有了使用价值与价值两个因素", "B.社会分工的出现及其存在", "C.生产资料和劳动产品属于不同的所有者", "D.交换过程中形成了充当一般等价物的商品"], a: "BC"},
        {ch: "第四章", q: "资本主义劳动过程同其他劳动过程相比较体现出来的特点是（    ）。", o: ["A.创造新的使用价值", "B.创造新的价值", "C.工人在资本家监督下劳动，他们的劳动属于资本家", "D.劳动产品归资本家所有"], a: "CD"},
        {ch: "第四章", q: "资本主义社会的资本（    ）。", o: ["A.总是通过各种物表现出来的", "B.就是指生产资料本身", "C.是带来剩余价值的价值", "D.是在物的外壳掩盖下的一种剥削关系"], a: "ACD"},
        {ch: "第四章", q: "商品经济产生和存在的条件是（  ）。（重复题）", o: ["A.社会分工的出现", "B.生产资料和劳动产品属于不同的所有者", "C.劳动分工的出现", "D.生产资料和劳动产品属于同一的所有者"], a: "AB"},
        {ch: "第四章", q: "在雾霾污染下，新鲜空气也可以装在容器中出售成为商品，根本原因是（  ）。", o: ["A.人们不能随便从自然界中得到新鲜空气", "B.能满足人们对新鲜空气的需要", "C.把新鲜空气净化压缩装进容器中需要经过人们劳动", "D.新鲜空气的生产以交换为目的"], a: "CD"},
        {ch: "第四章", q: "商品价值和交换价值的关系是（  ）。", o: ["A.价值是交换价值的内容 and 基础", "B.交换价值是价值的内容和基础", "C.交换价值是价值的表现形式", "D.价值是交换价值的表现形式"], a: "AC"},
        {ch: "第四章", q: "偏旁却都是“人”，示意价值在“人”。关于价值的主要观点有（  ）。", o: ["A.劳动是社会财富的唯一源泉", "B.具体劳动是商品价值的实体", "C.价值是凝结在商品中的一般人类劳动", "D.价值在本质上体现了生产者之间的社会关系"], a: "CD"},
        {ch: "第四章", q: "马克创立的劳动二重性理论具有重大意义，是因为（  ）。", o: ["A.它是建立科学劳动价值论的坚实基础", "B.它是剩余价值理论建立的重要基础", "C.它是划分不变资本和可变资本的根据", "D.它是理解资本积累、资本有机构成、资本再生产等理论的钥匙"], a: "ABD"},
        {ch: "第四章", q: "商品是（  ）。", o: ["A.用来交换的能满足人们某种需要的劳动产品", "B.使用价值和价值的矛盾统一体", "C.价值和交换价值的矛盾统一体", "D.伴随人类社会始终的"], a: "AB"},
        {ch: "第四章", q: "使用价值不同的商品之所以能按一定比例相交换，就因为它们都具有价值。由此可见（  ）。", o: ["A.商品交换实际上是商品生产者之间相互交换劳动的关系", "B.商品的价值在本质上体现了生产者之间一定的社会关系", "C.使用价值寓于价值之中并通过价值表现出来", "D.劳动是一切社会财富的唯一源泉"], a: "AB"},
        {ch: "第四章", q: "以下正确反映商品使用价值、交换价值、价值之间关系的有（  ）。", o: ["A.使用价值是交换价值的物质承担者", "B.价值是交换价值的基础", "C.使用价值是商品的价值实体", "D.交换价值是价值的表现形式"], a: "ABD"},
        {ch: "第四章", q: "具体劳动和抽象劳动是同一劳动的两种规定。以下说法正确的有（  ）。", o: ["A.具体劳动创造商品的使用价值，抽象劳动形成商品的价值", "B.具体劳动反映人与自然的关系，抽象劳动反映商品生产者的社会关系", "C.具体劳动转移不变资本的价值，抽象劳动转移可变资本的价值", "D.具体劳动和抽象劳动的矛盾是商品经济其他一切矛盾的基础"], a: "AB"},
        {ch: "第四章", q: "以私有制为基础的商品经济中，私人劳动和社会劳动的矛盾（  ）。", o: ["A.构成私有制基础上商品经济的基本矛盾", "B.决定着商品经济的本质及发展过程", "C.是商品经济其他一切矛盾的基础", "D.决定着商品生产者的命运"], a: "ABCD"},
        {ch: "第四章", q: "价值规律的内容和客观要求是（    ）。", o: ["A.商品的价值量由生产商品的社会必要劳动时间决定", "B.商品交换以商品的价值量为基础", "C.商品交换必须实行等价交换", "D.价格围绕价值上下波动"], a: "ABC"},
        {ch: "第四章", q: "劳动力的使用价值（   ）。", o: ["A.能创造大于自身价值的价值", "B.是资本积累的直接源泉", "C.是扩大再生产的直接源泉", "D.是价值的源泉"], a: "AD"},
        {ch: "第四章", q: "生产商品的劳动的二重性是（    ）。（重复题）", o: ["A.具体劳动", "B.社会劳动", "C.抽象劳动", "D.私人劳动"], a: "AC"},
        {ch: "第四章", q: "在商品经济中，使用价值、交换价值和价值之间的区别和关系是（   ）。", o: ["A.交换价值首先表现为两个使用价值交换时的量的比例", "B.价值是交换价值的基础，交换价值是价值的表现形式", "C.交换价值是价值的基础，价值是交换价值的表现形式", "D.商品的使用价值是不同质的，商品的价值则是同质的"], a: "ABD"},
        {ch: "第四章", q: "价值和交换价值的关系是（    ）。", o: ["A.交换价值是价值的基础", "B.交换价值是价值的表现形式", "C.价值是交换价值的表现形式", "D.价值是交换价值的基础"], a: "BD"},
        {ch: "第四章", q: "货币的最基本职能有（   ）。", o: ["A.价值尺度", "B.流通手段", "C.贮藏手段", "D.支付手段"], a: "AB"},
        {ch: "第四章", q: "货币的职能有（   ）。", o: ["A.价值尺度", "B.流通手段", "C.贮藏手段", "D.支付手段"], a: "ABCD"},
        {ch: "第四章", q: "如果部门劳动生产率不变，个别企业劳动生产率提高，则（   ）。", o: ["A.单位商品的价值不变", "B.该企业产品的个别价值低于社会价值", "C.单位商品的价值量增加", "D.该企业产品的个别劳动时间低于社会必要劳动时间"], a: "ABD"},
        {ch: "第四章", q: "资本的本质特征和属性是（   ）。", o: ["A.不是物，是一种社会生产关系", "B.带来剩余价值的价值", "C.资本的生命力在于运动", "D.具有增殖性和运动性"], a: "ABCD"},
        {ch: "第四章", q: "在商品经济运行中，价值、价格与供求关系三者之间的关系是（   ）。", o: ["A.商品价格由价值决定，同时受供求影响而波动", "B.价格只由供求关系来决定，价值不起决定作用", "C.每一次交换都要求严格按价值量相等的原则进行", "D.只有当供求关系平衡时，价格才等于商品的价值"], a: "AD"},

// 第五
        {ch: "第五章", q: "垄断形成的原因（    ）。", o: ["A.自由竞争引起生产集中", "B.生产集中引起资本高度集中", "C.少数大企业为避免两败俱伤", "D.生产和资本高度集中必然引起垄断"], a: "ABCD"},
{ch: "第五章", q: "下列各项正确表述垄断与竞争关系的有（    ）。", o: ["A.垄断是在自由竞争中形成的", "B.垄断消除了竞争", "C.垄断与竞争并存", "D.垄断是作为自由竞争的对立面产生的"], a: "ACD"},
{ch: "第五章", q: "金融寡头在经济领域的统治主要是通过（    ）。", o: ["A.参与制", "B.通过掌握一定数量的股票来层层控制企业", "C.同政府的个人联合", "D.把自己的代理人送进政府或议会"], a: "AB"},
{ch: "第五章", q: "垄断利润的主要来源（    ）。", o: ["A.对本国无产阶级和其他劳动人民剥削的加强获得更多利润", "B.垄断资本通过垄断高价 and 垄断低价来控制市场，获得的一些其他企业特别是非垄断企业的利润", "C.通过加强对其他国家劳动人民的剥削 and 掠夺从国外获取利润", "D.通过资本主义国家政权进行有利于垄断资本的再分配，从而将劳动人民创造的国民收入的一部分变成垄断资本的收入"], a: "ABCD"},
{ch: "第五章", q: "下列关于垄断价格的理解中正确的是（    ）。", o: ["A.垄断组织获取垄断利润的主要手段", "B.分为垄断高价 and 垄断低价两种", "C.是垄断组织凭借其垄断地位规定的价格", "D.它增加了价值总量"], a: "ABC"},
{ch: "第五章", q: "下列关于国家垄断资本主义的形成 and 发展说法正确的是（    ）。", o: ["A.是科技进步 and 生产社会化程度进一步提高的产物", "B.是资本主义基本矛盾进一步尖锐化的必然结果", "C.经济波动 and 经济危机的深化推动国家垄断资本主义的产生", "D.缓和社会矛盾、协调利益关系的需求，促使国家垄断资本主义的产生"], a: "ABCD"},
{ch: "第五章", q: "国家垄断资本主义的出现（    ）。", o: ["A.加大了对劳动人民的剥削 and 掠夺", "B.更好地保证了垄断资产阶级获得高额垄断利润", "C.更有利于维护资本主义制度", "D.从根本上改变垄断资本主义的性质"], a: "ABC"},
{ch: "第五章", q: "金融垄断资本的发展（    ）。", o: ["A.促进了资本主义经济的发展", "B.造成了经济过度虚拟化", "C.导致金融危机频繁发生", "D.从根本上改变垄断资本主义的性质"], a: "ABC"},
{ch: "第五章", q: "垄断资本向世界范围扩展的主要经济动因是（    ）。", o: ["A.将国内过剩的资本输出，以便在国外谋求高额利润", "B.将部分非要害的技术转移到国外，以取得在别国的垄断优势，攫取高额垄断利润", "C.争夺商品销售市场", "D.确保原材料 and 能源的可靠来源"], a: "ABCD"},
{ch: "第五章", q: "以下哪些是经济全球化的表现（    ）。", o: ["A.生产全球化", "B.贸易全球化", "C.金融全球化", "D.政治全球化"], a: "ABC"},
{ch: "第五章", q: "传统上关于经济全球化说法正确的是（    ）。", o: ["A.加剧了发展中国家资源短缺 and 环境污染", "B.经济全球化没有负面影响", "C.一定程度上增加了经济风险", "D.经济全球化体现了社会化生产的要求"], a: "ACD"},
{ch: "第五章", q: "第二次世界大战后，资本主义社会阶层 and 阶级结构的变化有（    ）。", o: ["A.资本家的地位 and 作用发生变化", "B.高级职业经理成为大公司经营活动的实际控制者", "C.知识性 and 服务型劳动者的数量增多", "D.工人阶级消失"], a: "ABC"},
{ch: "第五章", q: "第二次世界大战后，资本主义在政治制度上的新变化表现在（    ）。", o: ["A.政治制度出现多元化的趋势", "B.公民权利有所扩大", "C.重视并加强法制建设", "D.改良主义政党在政治舞台上的影响日益扩大"], a: "ABCD"},
{ch: "第五章", q: "第二次世界大战后，资本主义新变化的实质是（    ）。", o: ["A.是人类社会发展一般规律 and 资本主义经济规律作用的结果", "B.是在资本主义制度基本框架内部的变化", "C.资本主义生产关系的自我调整", "D.资本主义的一种倒退"], a: "ABC"},
{ch: "第五章", q: "资本主义制度的历史进步性主要表现在（    ）。", o: ["A.促使科学技术转变为生产力", "B.追求剩余价值的动力 and 竞争的压力推动了生产力发展", "C.资本主义政治制度促进 and 完善了资本主义生产方式", "D.资本主义意识形态促进 and 完善了资本主义生产方式"], a: "ABCD"},
{ch: "第五章", q: "垄断是在自由竞争中形成的，是作为自由竞争的对立面产生的。垄断条件下的竞争同自由竞争相比，具有的新特点包括（    ）。", o: ["A.目的获得更多利润或超额利润，不断扩大资本的积累", "B.除了采取各种形式的经济手段外，还采取非经济的手段", "C.不仅在国内市场上进行竞争，国际市场上的竞争也越来越激烈", "D.不仅经济领域的竞争多种多样，而且还扩大到经济领域以外"], a: "ABCD"},
{ch: "第五章", q: "垄断在自由竞争的基础上产生，但垄断没有消除竞争。垄断与竞争并存的原因是（   ）。", o: ["A.垄断没有消除产生竞争的经济条件，垄断组织间的竞争更激烈", "B.垄断必须通过竞争来维持", "C.科技进步 and 创新不断激发新的竞争", "D.社会生产是复杂多样的，任何垄断组织都不可能把包罗万象的社会生产都包下来"], a: "ABD"},
{ch: "第五章", q: "垄断利润主要是通过垄断组织制定的垄断价格来实现的。垄断价格包括垄断高价 and 垄断低价两种形式。垄断高价是指垄断组织出售商品时规定的高于生产价格的价格，垄断低价是指垄断组织在购买非垄断企业所生产的原材料等生产资料时规定的低于生产价格的价格。垄断组织操纵价格带来的结果是（    ）。", o: ["A.抑制了市场上价格的自由波动", "B.垄断价格一定时期内背离生产价格 and 价值", "C.对商品价值 and 剩余价值作了有利于垄断资本的再分配", "D.整个社会商品的价值不再是由生产它们的社会必要劳动时间决定"], a: "ABC"},
{ch: "第五章", q: "垄断资本在国内建立了垄断统治后，必然要把其统治势力扩展到国外，建立国际垄断统治。垄断资本向世界范围扩展的主要经济动因是（    ）。", o: ["A.将国内过剩的资本输出，以便在国外谋求高额利润", "B.将部分非要害的技术转移到国外，以取得在别国的垄断优势", "C.争夺商品销售市场，确保原材料 and 能源的可靠来源", "D.输出资本主义的意识形态，以颠覆或控制发展中国家的政权"], a: "ABC"},
{ch: "第五章", q: "导致经济全球化迅猛发展的因素主要有（    ）。", o: ["A.科学技术的进步 and 生产力的发展", "B.跨国公司的发展", "C.各国经济体制的变革 and 国际经济组织的发展", "D.发展中国家的斗争"], a: "ABC"},
{ch: "第五章", q: "垄断是（   ）。", o: ["A.在自由竞争 and 生产集中基础上发展起来的", "B.帝国主义的经济实质", "C.资本主义大企业或企业联合控制一个或几个部门的生产 and 市场", "D.帝国主义最基本的经济特征"], a: "ABCD"},
{ch: "第五章", q: "垄断价格是（   ）。", o: ["A.资本家可以获得超额利润的价格", "B.垄断组织凭其垄断地位规定的一种市场价格", "C.由垄断高价 and 垄断低价构成的", "D.保证垄断利润的主要手段"], a: "BCD"},
{ch: "第五章", q: "垄断高价 and 垄断低价并不否定价值规律，因为（    ）。", o: ["A.垄断价格只是使价值规律改变了表现形式", "B.按垄断低价买卖的行为，仍然是等价交换", "C.从整个社会看，商品的价格总额 and 价值总额是一致的", "D.垄断高价是把其它商品生产者的一部分利润转移到垄断高价的商品上"], a: "ACD"},
{ch: "第五章", q: "资本主义为社会主义所代替的历史必然性表现在（   ）。", o: ["A.资本主义的内在矛盾决定了资本主义必然被社会主义所代替", "B.资本积累推动资本主义最终否定资本主义自身", "C.国家垄断资本主义为向社会主义过渡准备了条件", "D.资本主义生产关系的调整促进了生产力的发展"], a: "ABC"},
{ch: "第五章", q: "垄断时期竞争的特点主要是（   ）。", o: ["A.目的是获得垄断高额利润", "B.手段更加多样化", "C.范围涉及到经济领域之外", "D.程度更加激烈"], a: "ABCD"},
{ch: "第五章", q: "垄断利润来自（      ）。", o: ["A.垄断企业雇佣工人创造的剩余价值", "B.通过国际不等价交换，占有其它国家人民创造的一部分价值", "C.资产阶级国家对国民收入作有利于垄断资本家的再分配", "D.通过向非垄断企业低价购买生产数据，占有它们的一部分利润"], a: "ABCD"},
{ch: "第五章", q: "资本输出的后果表现在（      ）。", o: ["A.使经济落后国自然经济瓦解 and 商品经济发展", "B.使经济落后国经济畸形化 and 依赖性增强", "C.引起帝国主义国家之间矛盾加剧", "D.引起资本输出国在一定程度上经济发展停滞"], a: "ABCD"},
{ch: "第五章", q: "当代资本主义的新变化没有改变资本主义生产关系的本质，因为（      ）。", o: ["A.没有改变资本主义私有制的经济基础", "B.没有改变资本主义剥削的实质", "C.没有改变工人阶级受雇佣的阶级地位", "D.没有改变资本主义的基本矛盾"], a: "ABCD"},
{ch: "第五章", q: "金融资本（        ）。", o: ["A.是垄断资本主义阶段居统治地位的资本", "B.是自由竞争资本主义阶段所产生的资本", "C.是在垄断基础上由银行垄断资本 and 工业垄断资本融合或混合生长而形成的新型资本", "D.主要是通过“参与制”在经济领域里进行统治的资本"], a: "ACD"},
{ch: "第五章", q: "垄断是在自由竞争中形成的，是作为自由竞争的对立面产生的。但是，垄断并不能消除竞争，反而使竞争变得更加复杂 and 激烈。这是因为（    ）。", o: ["A.垄断没有消除产生竞争的经济条件", "B.垄断必须通过竞争来维持", "C.垄断组织之外已经不存在任何中小企业，从而使得垄断组织之间的竞争更加激烈", "D.任何垄断组织都不可能把包罗万象的社会生产全部包下来"], a: "ABD"},
{ch: "第六章", q: "社会主义在经济文化相对落后国家建设的长期性的原因是（    ）。", o: ["A.生产力发展状况的制约", "B.经济基础 and 上层建筑发展状况的制约", "C.国际环境的严峻挑战", "D.马克思主义执政党对社会主义发展道路的探索 and 对社会主义建设规律认识"], a: "ABCD"},
{ch: "第六章", q: "下列关于“无产阶级政党”说法正确的是（    ）。", o: ["A.无产阶级政党是无产阶级反对资产阶级的斗争发展到一定阶段的产物", "B.无产阶级要从自发走向自觉并取得斗争的胜利，必须建立起自己的革命政党", "C.无产阶级政党由无产阶级中的先进分子所组成，是各国工人运动中最坚决的、始终推动运动前进的部分", "D.无产阶级政党是以科学理论武装起来的政党"], a: "ABCD"},
{ch: "第六章", q: "社会主义实现模式多样化的原因在于（    ）。", o: ["A.各个国家生产力发展状况", "B.历史传统不同", "C.指导思想不同", "D.时代 and 实践的不断发展"], a: "ABD"},
{ch: "第六章", q: "下列关于人民民主专政说法正确的是（    ）。", o: ["A.我国的国体", "B.实质是人民当家作主", "C.广泛而真实的人民民主", "D.中国共产党人把科学社会主义关于无产阶级专政的理论与中国实际相结合，创造性地提出的理论"], a: "ABCD"},
{ch: "第六章", q: "要探索符合本国国情的社会主义发展道路，就要（    ）。", o: ["A.以马克思主义理论为指导", "B.从本国国情出发", "C.吸收一切人类文明成果", "D.以发达国家为样板"], a: "ABC"},
{ch: "第六章", q: "空想社会主义的历史功绩（    ）。", o: ["A.对资本主义的弊病进行了深刻的揭露 and 猛烈的抨击", "B.揭示了资本主义灭亡、社会主义胜利的客观规律", "C.对未来社会作出了天才的设想", "D.找到了一条改造资本主义的正确途径"], a: "AC"},
{ch: "第六章", q: "关于社会主义，下列说法正确的是（    ）。", o: ["A.社会主义社会必然有一个漫长的自我发展过程", "B.社会主义社会必须大力发展生产力，并创造出比资本主义更高的劳动生产率", "C.革是社会主义自我完善 and 自我发展，是社会主义社会发展的强大动力", "D.社会主义社会只有在充分发展 and 高度发达的基础上，才能向共产主义社会过渡"], a: "ABCD"},
{ch: "第六章", q: "下列属于社会主义的基本原则的有（    ）。", o: ["A.解放 and 发展生产力，创造高度发达的生产力和比资本主义更高的劳动生产率", "B.建立 and 完善生产资料公有制，逐步消灭剥削，消除两极分化，达到共同富裕", "C.对个人消费实行“各尽所能，按需分配”制度", "D.实现社会全面进步 and 人的全面发展，并最终向共产主义社会迈进"], a: "ABD"},
{ch: "第六章", q: "社会主义首先在经济文化相对落后的国家取得胜利，以下说法正确的有（    ）。", o: ["A.是由革命的客观形势 and 主观条件所决定", "B.并不违背生产关系一定要适合生产力状况的规律", "C.生产力高度发展的原因", "D.高度社会化的资本主义大生产作为社会主义革命的物质前提"], a: "AB"},
{ch: "第六章", q: "在共产主义社会，物质财富（   ），消费资料（   ）；社会关系（   ），人们精神境界极大提高；每个人得到（   ），人类实现从必然王国向自由王国的飞跃。", "o": ["A.极大丰富", "B.按需分配", "C.高度和谐", "D.自由而全面的发展"], "a": "ABCD"},
{ch: "第六章", q: "社会主义从空想发展到科学，是因为马克思、恩格斯在新的历史条件下创立了（    ）。", o: ["A.唯物史观", "B.剩余价值学说", "C.无产阶级革命学说", "D.无产阶级政党学说"], "a": "AB"},
{ch: "第六章", q: "科学社会主义自产生之后，逐步与工人运动相结合，指导无产阶级政党的革命斗争，并在这个过程中不断完善 and 发展。1864年，国际工人协会（第一国际）应运而生。1871年巴黎公社革命爆发。巴黎公社革命（    ）。", o: ["A.是第一国际精神的产儿", "B.是无产阶级夺取政权的第一次伟大尝试", "C.证明了社会主义革命可以首先在一个或者几个国家获得胜利", "D.使社会主义从理想变为现实"], "a": "AB"},
{ch: "第六章", q: "在俄国社会主义革命取得胜利的初期，特别是实行新经济政策期间，列宁对苏维埃俄国如何建设社会主义进行了深刻的理论思考，提出了许多精辟的论述。列宁对马克思主义的重大贡献，也是他留给后人的最宝贵的思想遗产是（    ）。", o: ["A.能够正视国情，面对一系列新情况 and 新问题，不拘泥于书本上已有的结论，而是“根据经验来谈论社会主义”", "B.一切从实际出发，尊重千百万群众的实践，勇于探索，大胆创新", "C.努力把马克思主义基本原理同俄国的具体实际相结合，探索出一条适合俄国国情的社会主义道路", "D.实现了工业化 and 农业集体化，形成了建设社会主义的苏联模式"], "a": "ABC"},
{ch: "第六章", q: "从16世纪初期兴起的社会主义思潮算起，社会主义运动至今已经有500多年的历史。社会主义是在曲折中发展、在开拓中前进的。站在新时代中国特色社会主义新的历史起点上，学习掌握科学社会主义基本原则，深入总结社会主义运动的历史经验，对于我们推进世界社会主义事业 具有重要意义。科学社会主义基本原则（    ）。", o: ["A.是社会主义事业发展规律的集中体现", "B.是马克思主义政党领导人民进行社会主义革命、建设、改革的基本遵循", "C.规定了各个国家的无产阶级政党与自己国家实际相结合的具体制度 and 革命方法", "D.在后来的社会主义革命 and 建设中得到了证实、丰富 and 发展"], "a": "ABD"},
{ch: "第六章", q: "马克思、恩格斯在《共产党宣言》1872年德文版序言中指出，“不管最近25年来的情况发生了多大的变化，这个宣言中所阐述的一般原理整个说来直到现在还是完全正确的……这些原理的实际运用，正如宣言中所说的，随时随地都要以当时的历史条件为转移”。这一论述为无产阶级政党正确认识 and 对待科学社会主义基本原则提供了科学的方法指导。正确认识 and 对待科学社会主义基本原则，必须（    ）。", o: ["A.始终坚持科学社会主义基本原则，反对任何背离科学社会主义基本原则的错误倾向", "B.善于把科学社会主义基本原则与本国实际 and 时代特征相结合，创造性地回答 and 解决社会主义革命、建设、改革中的重大问题", "C.严格遵循科学社会主义提供的解决特殊问题的具体方案，在实践中准确无误地贯彻这些方案", "D.紧跟时代 and 实践的发展，在不断总结新鲜经验中进一步丰富 and 发展科学社会主义基本原则"], "a": "ABD"},
{ch: "第六章", q: "“由于历史进程的曲折而不得不开始社会主义革命的那个国家愈落后，它由旧的资本主义关系过渡到社会主义关系就愈困难。”列宁的这段话说明，无产阶级及其政党可以在经济文化相对落后的国家取得政权，建立起崭新的社会主义制度，但是，在这样的国家建设社会主义必然具有长期性。其原因主要有（    ）。", "o": ["A.生产力发展状况的制约", "B.经济基础 and 上层建筑发展状况的制约", "C.国际环境的严峻挑战", "D.马克思主义执政党对社会主义发展道路 and 建设规律的探索 and 认识需要一个长期的过程"], "a": "ABCD"},
{ch: "第六章", q: "“‘履不必同，期于适足；治不必同，期于利民。’世界上没有放之四海而皆准的发展道路。只有能够持续造福人民的发展道路，才是最有生命力的。”社会主义发展道路多样性的原因有（    ）。", "o": ["A.各国人口因素 and 自然地理环境的不同是造成社会主义发展道路多样性的决定因素", "B.历史文化传统的差异性是造成不同国家社会主义发展道路多样性的重要条件", "C.各国生产力发展状况 and 社会发展阶段决定了社会主义发展道路具有不同的特点", "D.时代 and 实践的不断发展是造成社会主义发展道路多样性的现实原因"], "a": "BCD"},
{ch: "第六章", q: "探索社会主义发展道路，必须（    ）。", "o": ["A.坚持对待马克思主义的科学态度", "B.从当时当地的历史条件出发，坚持“走自己的路”", "C.充分吸收人类一切优秀文明成果", "D.坚持问题导向，从马克思主义经典作家的著作中寻找具体问题的答案"], "a": "ABC"},
{ch: "第六章", q: "习近平指出：“社会主义从来都是在开拓中前进的。”这是对社会主义历史进程的全面总结，也是对社会主义事业发展的深刻启示。社会主义在开拓中前进，是因为（    ）。", "o": ["A.社会主义是亿万人民群众的伟大实践", "B.社会主义是崭新的事业，社会主义实践是一个不断探索的过程", "C.实践探索中出现某种曲折并不改变社会主义的前进趋势", "D.推进社会主义实践发展必须有开拓奋进的精神状态"], "a": "ABCD"},
{ch: "第六章", q: "19世纪初期以圣西门、傅立叶、欧文为代表的批判的空想社会主义者，他们（    ）。", "o": ["A.在理论上致力于对社会制度的分析", "B.对资本主义旧制度的辛辣批判，包含着许多切中要害的见解", "C.对社会主义新制度的描绘，闪烁着诸多天才的火花", "D.阐明了资本主义制度下雇佣奴隶制的本质，为启发工人觉悟提供了极为宝贵的材料"], "a": "ABC"},
{ch: "第六章", q: "马克思、恩格斯适应社会的需要，在新的历史条件下创立 and 发展了（  ），为实现社会主义从空想到科学的飞跃奠定了坚实的理论基础。", "o": ["A.唯物史观", "B.辩证唯物主义", "C.劳动价值理论", "D.剩余价值学说"], "a": "AD"},
{ch: "第六章", q: "社会主义发展史的两次飞跃是（   ）。", "o": ["A.社会主义由空想到科学的发展", "B.早期空想社会主义到空想平均共产主义的发展", "C.空想平均共产主义到批判的空想社会主义的发展", "D.社会主义由理论到实践"], "a": "AD"},
{ch: "第六章", q: "苏联解体、东欧巨变，社会主义在一些国家出现严重曲折，但是社会主义中国在改革开放中却迅速发展起来。这说明（   ）。", "o": ["A.社会主义只是历史发展中的偶然现象", "B.人类社会由资本主义向社会主义转变过程中暂时的倒退是难以避免的规律性现象", "C.马克思主义学说过时了", "D.社会主义代替资本主义虽然是不可逆转的历史趋势，但社会主义的发展并非一帆风顺"], "a": "BD"},
{ch: "第六章", q: "下列关于“无产阶级政党”说法正确的是（   ）。", "o": ["A.无产阶级政党是无产阶级反对资产阶级的斗争发展到一定阶段的产物", "B.无产阶级要从自发走向自觉并取得斗争的胜利，必须建立起自己的革命政党", "C.无产阶级政党由无产阶级中的先进分子所组成，是各国工人运动中最坚决的、始终推动运动前进的部分", "D.无产阶级政党是以科学理论武装起来的政党"], "a": "ABCD"},
{ch: "第六章", q: "无产阶级反抗资产阶级的斗争主要有（   ）三种形式。", "o": ["A.文化斗争", "B.经济斗争", "C.政治斗争", "D.思想斗争"], "a": "BCD"},
{ch: "第七章", q: "下列哪些是对人类解放正确的理解？（  ）。", "o": ["A.完全摆脱自然力和社会关系", "B.获得绝对自由", "C.从自然必然性奴役下解放出来", "D.从社会必然性奴役下解放出来"], "a": "CD"},

// --- 智能抽题与系统控制逻辑 ---
let currentExamQuestions = []; // 存储当前试卷的所有题目

// 章节列表
const chapters = ["导论", "第一章", "第二章", "第三章", "第四章", "第五章", "第六章", "第七章"];

// 智能抽题函数：按章节比例等概率抽取
function startQuiz() {
    currentExamQuestions = [];
    
    // 1. 抽取单选题 (共120题，每章尽量均分 120/8 = 15题)
    chapters.forEach(ch => {
        const chSingles = questionBank.single.filter(item => item.ch === ch);
        const shuffled = chSingles.sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, 15); // 每章抽15题
        currentExamQuestions = currentExamQuestions.concat(selected);
    });

    // 2. 抽取多选题 (共10题，随机从题库抽取)
    const allMultis = [...questionBank.multi];
    const shuffledMultis = allMultis.sort(() => 0.5 - Math.random());
    const selectedMultis = shuffledMultis.slice(0, 10);
    currentExamQuestions = currentExamQuestions.concat(selectedMultis);

    // 渲染考卷
    renderQuiz();

    // 切换界面显示
    document.getElementById("start-card").style.display = "none";
    document.getElementById("quiz-area").style.display = "block";
    document.getElementById("float-progress").style.display = "block";
    
    // 初始化进度条
    updateProgress();
    window.scrollTo(0, 0);
}

// 动态渲染试卷到 HTML 页面
function renderQuiz() {
    const listContainer = document.getElementById("questions-list");
    listContainer.innerHTML = ""; 

    currentExamQuestions.forEach((item, index) => {
        const isMulti = index >= 120; 
        const qTypeLabel = isMulti ? "【多选题】" : "【单选题】";
        const scoreLabel = isMulti ? "(1分)" : "(0.5分)";
        const inputType = isMulti ? "checkbox" : "radio";

        const qCard = document.createElement("div");
        qCard.className = "question-card";
        qCard.id = `q-card-${index}`;

        const qMeta = document.createElement("div");
        qMeta.className = "question-meta";
        qMeta.innerText = `第 ${index + 1} 题 / 所属章节：${item.ch} ${qTypeLabel} ${scoreLabel}`;
        qCard.appendChild(qMeta);

        const qTitle = document.createElement("div");
        qTitle.className = "question-title";
        qTitle.innerText = item.q;
        qCard.appendChild(qTitle);

        const oList = document.createElement("ul");
        oList.className = "option-list";

        item.o.forEach(opt => {
            const optLetter = opt.charAt(0); 
            const oItem = document.createElement("li");
            oItem.className = "option-item";
            
            const inputNode = document.createElement("input");
            inputNode.type = inputType;
            inputNode.name = `q-input-${index}`;
            inputNode.value = optLetter;
            inputNode.id = `q-${index}-opt-${optLetter}`;
            
            oItem.onclick = (e) => {
                // 如果该题已经提交过，则锁定点击事件
                if (inputNode.disabled) return;

                if (e.target !== inputNode) {
                    inputNode.checked = !inputNode.checked;
                }
                if (!isMulti) {
                    const siblings = oList.querySelectorAll(".option-item");
                    siblings.forEach(s => s.classList.remove("selected"));
                }
                
                if (inputNode.checked) {
                    oItem.classList.add("selected");
                } else {
                    oItem.classList.remove("selected");
                }
                updateProgress();
            };

            const labelNode = document.createElement("label");
            labelNode.htmlFor = inputNode.id;
            labelNode.innerText = opt;
            labelNode.style.cursor = "pointer";
            labelNode.style.width = "100%";

            oItem.appendChild(inputNode);
            oItem.appendChild(labelNode);
            oList.appendChild(oItem);
        });
        qCard.appendChild(oList);

        // --- 新增：为每道题添加独立的提交按钮 ---
        const singleSubmitBtn = document.createElement("button");
        singleSubmitBtn.className = "single-submit-btn";
        singleSubmitBtn.innerText = "提交本题答案";
        singleSubmitBtn.style.cssText = "margin-top: 10px; padding: 6px 15px; background: var(--primary-color, #007bff); color: #fff; border: none; border-radius: 4px; cursor: pointer;";
        
        singleSubmitBtn.onclick = () => {
            checkSingleQuestion(index, item);
            singleSubmitBtn.style.display = "none"; // 提交后隐藏当前按钮
        };
        qCard.appendChild(singleSubmitBtn);
        // ----------------------------------------

        const expDiv = document.createElement("div");
        expDiv.className = "explanation";
        expDiv.id = `explanation-${index}`;
        expDiv.innerHTML = `<strong>正确答案：</strong> <span style="color:var(--correct-color, #28a745); font-weight:bold;">${item.a}</span><br><small style="color:#666;">解析提示：请对照全国通编马原教材有关【${item.ch}】的核心表述及论证逻辑进行复习。</small>`;
        qCard.appendChild(expDiv);

        listContainer.appendChild(qCard);
    });
}

// 新增：单题即时判断算法
function checkSingleQuestion(index, item) {
    const inputs = document.getElementsByName(`q-input-${index}`);
    
    // 1. 收集用户选项
    let userAnswers = [];
    for (let i = 0; i < inputs.length; i++) {
        if (inputs[i].checked) {
            userAnswers.push(inputs[i].value);
        }
    }
    
    // 如果用户未选任何选项，提示拦截
    if (userAnswers.length === 0) {
        alert("请先选择选项后再提交！");
 singleSubmitBtn.style.display = "block"; 
        return;
    }

    const userAnsStr = userAnswers.sort().join("");
    const correctAnsStr = item.a.split("").sort().join("");
    const isCorrect = userAnsStr === correctAnsStr;

    // 2. 渲染高亮样式
    const oList = document.getElementById(`q-card-${index}`).querySelectorAll(".option-item");
    oList.forEach(oItem => {
        oItem.classList.remove("selected");
        const val = oItem.querySelector("input").value;
        
        if (item.a.includes(val)) {
            // 样式兼容：如果原 CSS 未定义 --correct-color，默认使用绿色
            oItem.style.backgroundColor = "#e8f5e9"; 
            oItem.style.color = "#2e7d32";
            oItem.classList.add("correct");
        } else if (userAnsStr.includes(val) && !item.a.includes(val)) {
            oItem.style.backgroundColor = "#ffebee";
            oItem.style.color = "#c62828";
            oItem.classList.add("wrong");
        }
        // 锁定输入
        oItem.querySelector("input").disabled = true;
    });

    // 3. 显示本题解析
    document.getElementById(`explanation-${index}`).style.display = "block";
}
// 实时更新悬浮条的答题进度
function updateProgress() {
    let answered = 0;
    for (let i = 0; i < currentExamQuestions.length; i++) {
        const inputs = document.getElementsByName(`q-input-${i}`);
        let hasChecked = false;
        for (let j = 0; j < inputs.length; j++) {
            if (inputs[j].checked) {
                hasChecked = true;
                break;
            }
        }
        if (hasChecked) answered++;
    }
    document.getElementById("answered-count").innerText = answered;
}

// 交卷与智能评分分析算法
function submitQuiz() {
    // 确认交卷提示
    if (!confirm("确定要交卷并查看分数与错题分析吗？")) {
        return;
    }

    let singleScore = 0.0;
    let multiScore = 0.0;
    let wrongSingleCount = 0;
    let wrongMultiCount = 0;

    currentExamQuestions.forEach((item, index) => {
        const isMulti = index >= 120;
        const inputs = document.getElementsByName(`q-input-${index}`);
        
        // 收集用户的选择
        let userAnswers = [];
        for (let i = 0; i < inputs.length; i++) {
            if (inputs[i].checked) {
                userAnswers.push(inputs[i].value);
            }
        }
        // 将用户的选择和正确答案格式化为排序后的字符串进行比对
        const userAnsStr = userAnswers.sort().join("");
        const correctAnsStr = item.a.split("").sort().join("");

        const isCorrect = userAnsStr === correctAnsStr;

        // 获取该题所有的选项 DOM 节点用于高亮变色
        const oList = document.getElementById(`q-card-${index}`).querySelectorAll(".option-item");
        
        // 样式还原与重置
        oList.forEach(oItem => {
            oItem.classList.remove("selected");
            const val = oItem.querySelector("input").value;
            
            // 策略高亮：如果是正确选项，标绿；如果是用户选错的选项，标红
            if (item.a.includes(val)) {
                oItem.classList.add("correct");
            } else if (userAnsStr.includes(val) && !item.a.includes(val)) {
                oItem.classList.add("wrong");
            }
            // 锁定所有输入框，禁止二次修改
            oItem.querySelector("input").disabled = true;
            oItem.onclick = null; 
        });

        // 计分
        if (isCorrect) {
            if (!isMulti) {
                singleScore += 0.5;
            } else {
                multiScore += 1.0;
            }
        } else {
            if (!isMulti) {
                wrongSingleCount++;
            } else {
                wrongMultiCount++;
            }
        }

        // 显示解析和正确答案
        document.getElementById(`explanation-${index}`).style.display = "block";
    });

    const totalScore = singleScore + multiScore;

    // 组装答题报告
    document.getElementById("final-score").innerText = `${totalScore.toFixed(1)} 分`;
    document.getElementById("score-details").innerHTML = `
        您的考卷批阅完毕！<br>
        <strong>单选题：</strong> 正确 ${120 - wrongSingleCount} 题，错误 ${wrongSingleCount} 题，得分 <strong>${singleScore.toFixed(1)}</strong> 分（满分60分）。<br>
        <strong>多选题：</strong> 正确 ${10 - wrongMultiCount} 题，错误 ${wrongMultiCount} 题，得分 <strong>${multiScore.toFixed(1)}</strong> 分（满分10分）。<br>
        <span style="color:#666; font-size:13px; display:block; margin-top:10px;">温馨提示：正确的答案和解析已在上方试卷中为您标出（绿色为正确项，红色为您的错选项）。</span>
    `;

    // 隐藏答题按钮和悬浮进度条，显示答题报告
    document.getElementById("submit-btn").style.display = "none";
    document.getElementById("float-progress").style.display = "none";
    document.getElementById("result-card").style.display = "block";

    // 自动置顶方便看分
    window.scrollTo(0, 0);
}
</script>
