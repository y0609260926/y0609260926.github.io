        {ch: "导论", q: "恩格斯于1820年11月28日出生在德国巴门市的一个工厂主家庭。他称自己一生所做的事就是“拉第二小提琴”。恩格斯不仅与马克思一起创立马克思主义，参加并指导国际工人运动，而且在传播和发展马克思主义方面作出了杰出的贡献。恩格斯全面阐述马克思主义理论体系的著作是（   ）。", o: ["A.《共产党宣言》", "B.《家庭、私有制和国家的起源》", "C.《反杜林论》", "D.《自然辩证法》"], a: "C"},

        {ch: "导论", q: "马克思主义的理论品质是（   ）。", o: ["A.自我批判", "B.与时俱进", "C.不迷信权威", "D.批判与继承的统一"], a: "B"},

        {ch: "导论", q: "《资本论》的影响力经150多年风雨而不衰，至今对我们分析、理解现实经济问题依然具有很强的指导意义。马克思经济学说的核心内容和基石是（   ）。", o: ["A.商品二因素理论", "B.价值规律理论", "C.劳动二重性理论", "D.剩余价值理论"], a: "D"},
        {ch: "导论", q: "在马克思主义的经典著作中，被誉为“工人阶级圣经”的是（   ）。", o: ["A.《共产党宣言》", "B.《反杜林论》", "C.《资本论》", "D.《德意志意识形态》"], a: "C"},
        {ch: "导论", q: "1844年8月底，马克思和恩格斯在巴黎会面。这次会面使他们发现彼此的基本观点完全一致，于是开始了在科学理论研究和革命活动中的长期合作。马克思和恩格斯第一次合作的著作是（   ）。", o: ["A.《神圣家族》", "B.《德意志意识形态》", "C.《哲学的贫困》", "D.《共产党宣言》"], a: "A"},

        {ch: "导论", q: "十九世纪的欧洲，标志着现代无产阶级作为独立的政治力量登上了历史舞台的，是（  ）。", o: ["A.卢德运动", "B.工业革命", "C.三大工人运动", "D.1830年法国七月革命"], a: "C"},

        {ch: "导论", q: "（  ）提出了科学社会主义革命可能在一国或数国首先发生并取得胜利的论断。", o: ["A.马克思", "B.恩格斯", "C.列宁", "D.斯大林"], a: "C"},
        {ch: "导论", q: "科学社会主义从理论变为现实的标志是（  ）。", o: ["A.巴黎公社", "B.俄国十月革命的胜利", "C.中国新民主主义革命的胜利", "D.世界反法西斯战争的胜利"], a: "B"},
        {ch: "导论", q: "列宁在领导俄国革命和建设的过程中，把马克思主义基本原理与俄国实际相结合，创立了（  ）。", o: ["A.马克思主义", "B.列宁主义", "C.布尔什维克主义", "D.毛泽东思想"], a: "B"},
        {ch: "导论", q: "（  ）年，列宁和布尔什维克党领导俄国工人阶级和革命人民夺取了十月社会革命的胜利。", o: ["A.1915", "B.1916", "C.1917", "D.1918"], a: "C"},
        {ch: "导论", q: "（  ）是当代中国马克思主义、二十一世纪马克思主义，是中华文化和中国精神的时代精华，实现了马克思主义中国化时代化新的飞跃。", o: ["A.邓小平理论", "B.“三个代表”重要思想", "C.科学发展观", "D.习近平新时代中国特色社会主义思想"], a: "D"},
        {ch: "导论", q: "中国共产党从成立起，就把（  ）确立为指导思想，并在不断探索中把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合。", o: ["A.列宁主义", "B.恩格斯主义", "C.恩格斯列宁主义", "D.马克思列宁主义"], a: "D"},
        {ch: "导论", q: "（  ）是马克思主义的政治立场。", o: ["A.人民至上", "B.群众利益", "C.人民利益", "D.群体观念"], a: "A"},
        {ch: "导论", q: "最终实现（  ），既是无产阶级解放的事业，也是广大人民群众和全人类解放的事业。", o: ["A.全面小康", "B.共同富裕", "C.社会主义", "D.共产主义"], a: "D"},
        {ch: "导论", q: "马克思主义是对（  ）本质和规律的正确反映。", o: ["A.自然、社会和人类思维发展", "B.自然和社会", "C.自在自然和人化自然", "D.客观世界和主观世界"], a: "A"},
        {ch: "导论", q: "马克思主义的基本特征，如果用一句话来概括，就是（  ）的统一。", o: ["A.科学性和实践性", "B.科学性和发展性", "C.科学性和革命性", "D.科学性和人民性"], a: "C"},
        {ch: "导论", q: "黑格尔的哲学体系中包涵丰富的辩证法思想，他第一次试图把整个自然界，历史和精神的世界描述为是运动和发展的，并努力揭示这种运动和发展的内在联系。马克思将这种辩证法思想称作是黑格尔哲学体系的（   ）。", o: ["A.唯心主义本质", "B.欺骗性外壳", "C.合理内核", "D.基本内核"], a: "C"},
        {ch: "导论", q: "路德维希·费尔巴哈由于不了解实践活动的意义，不能正确理解人的本质，所以只能从抽象的人出发去考察历史，最终也陷入了唯心主义的泥潭。但与黑格尔不同，他的唯心主义主要表现在（   ）。", o: ["A.对自然界的认识领域", "B.对社会历史的认识领域", "C.对科学发展规律的认识领域", "D.对技术发展规律的认识领域"], a: "B"},
        {ch: "导论", q: "致力于实现以劳动人民为主体的最广大人民群众的根本利益，这是马克思主义的（   ）。", o: ["A.最重要的理论品质", "B.最崇高的社会理想", "C.最鲜明的政治立场", "D.最根本的世界观和方法论"], a: "C"},
        {ch: "导论", q: "“哲学把无产阶级当作自己的物质武器，同样，无产阶级把哲学当作自己的精神武器”，这个论断的含义是（   ）。", o: ["A.马克思主义是无产阶级的世界观和方法论", "B.哲学的存在方式是物质", "C.无产阶级的存在方式是精神", "D.无产阶级掌握哲学就由自为阶级转变为自在阶级"], a: "A"},

        // 第一章
        {ch: "第一章", q: "哲学上两大基本派别是（   ）。", o: ["A.辩证法和形而上学", "B.唯物主义和唯心主义", "C.可知论和不可知论", "D.反映论和先验论"], a: "B"},
        {ch: "第一章", q: "恩格斯认为，全部哲学，特别是近代哲学的重大的基本问题是（   ）。", o: ["A.哲学与人类生存活动之间的内在联系问题", "B.人与周围世界的基本联系问题", "C.思维和存在的关系问题", "D.关于人的本质问题"], a: "C"},
        {ch: "第一章", q: "划分唯物主义和唯心主义的标准是（   ）。", o: ["A.如何回答社会与自然的关系问题", "B.如何回答理想与现实的关系问题", "C.如何回答物质与意识谁是本原的问题", "D.如何回答物质与运动的关系问题"], a: "C"},
        {ch: "第一章", q: "唯物主义一元论同唯心主义一元论对立的根本点在于（   ）。", o: ["A.世界发展动力问题", "B.意识本质问题", "C.世界本质问题", "D.实践本质问题"], a: "C"},
        {ch: "第一章", q: "中国古代哲人荀子说：“天行有常，不为尧存，不为桀亡。”这是一种（   ）。", o: ["A.宿命论观点", "B.唯意志论观点", "C.机械唯物论观点", "D.朴素唯物论观点"], a: "D"},
        {ch: "第一章", q: "列宁对辩证唯物主义物质范畴的定义是通过（   ）。", o: ["A.物质与意识的关系界定的", "B.个别与一般的关系界定的", "C.哲学与具体科学的关系界定的", "D.认识与实践的关系界定的"], a: "A"},
        {ch: "第一章", q: "唯心主义的两种基本形式是（   ）。", o: ["A.形而上学唯心主义和辩证唯心主义", "B.主观唯心主义和客观唯心主义", "C.彻底的唯心主义和不彻底的唯心主义", "D.自然观上的唯心主义和历史观上的唯心主义"], a: "B"},
        {ch: "第一章", q: "马克思主义哲学关于物质范畴的正确理解是（   ）。", o: ["A.物质是各种实物的总和", "B.物质范畴是从各种物的总和中抽象出来的", "C.物质的唯一特性是它可以被感知", "D.物质是自然界中具体的物质形态"], a: "B"},
        {ch: "第一章", q: "《坛经》中记载：“时有风吹幡动，一僧曰风动，一僧曰幡动，议论不已。惠能进曰：不是风动，不是幡动，仁者心动。”这段话表明惠能关于运动的基本观点是（   ）。", o: ["A.运动是物质的根本属性", "B.运动与物质是不可分割的", "C.精神运动是物质运动的一种形式", "D.精神是运动的主体"], a: "D"},
        {ch: "第一章", q: "主张“世界上除了运动着的物质之外，什么也没有”的观点，属于（   ）。", o: ["A.否认人的意识存在的自然唯物主义", "B.主张世界统一于物质的辩证唯物主义", "C.否认时间与空间存在性的唯心主义", "D.把人的意识理解成某种特殊的“精细物质”的机械唯物主义"], a: "B"},
        {ch: "第一章", q: "辩证唯物主义所说的静止，是指运动的（   ）。", o: ["A.必要准备", "B.外在表现", "C.一种特殊状态", "D.一种必然结果"], a: "C"},
        {ch: "第一章", q: "相对静止是指（   ）。", o: ["A.事物绝对不动", "B.事物永恒不变", "C.事物运动的特殊状态", "D.事物运动的普遍状态"], a: "C"},
        {ch: "第一章", q: "任何意识都是人脑对客观世界的（   ）。", o: ["A.主观反映", "B.歪曲反映", "C.虚幻反映", "D.正确反映"], a: "A"},
        {ch: "第一章", q: "“人不能两次踏进同一条河流”和“人一次也不能踏进同一条河流”，这两种说法（   ）。", o: ["A.都是辩证法的观点", "B.都是诡辩论的观点", "C.前者是辩证法的观点，后者是诡辩论的观点", "D.前者是诡辩论的观点，后者是辩证法的观点"], a: "C"},
        {ch: "第一章", q: "世界上唯一不变的是变。这一论断的含义是（   ）。", o: ["A.变是世界的本原", "B.世界上只有变，没有不变", "C.变是绝对的，不变是相对的", "D.变与不变是绝对对立的"], a: "C"},
        {ch: "第一章", q: "“风定花犹落，鸟鸣山更幽”形象地表达了动和静的辩证关系是（   ）。", o: ["A.静不是动，动不是静", "B.静中有动，动中有静", "C.动是必然的，静是偶然的", "D.动是静的原因，静是动的结果"], a: "B"},
        {ch: "第一章", q: "“坐地日行八万里，巡天遥看一千河”的著名诗句所蕴含的哲理是（   ）。", o: ["A.物质运动的客观性和时空的主观性的统一", "B.物质运动的无限性和时空的有限性的统一", "C.物质运动的多样性和静止的单一性的统一", "D.物质运动的绝对性和静止的相对性的统一"], a: "D"},
        {ch: "第一章", q: "物质的根本属性是（   ）。", o: ["A.时间", "B.空间", "C.存在", "D.运动"], a: "D"},
        {ch: "第一章", q: "下列各项正确反映物质和运动关系的是（   ）。", o: ["A.运动是内容，物质是其形式", "B.运动是现象，物质是其本质", "C.运动是暂时的，物质是永恒的", "D.运动是物质的固有属性，物质是运动的主体"], a: "D"},
        {ch: "第一章", q: "“塘基种桑、桑叶养蚕、蚕沙喂鱼、鱼粪肥塘、塘泥壅桑”，浙江湖州的这一“桑基鱼塘系统”凝结着江南水乡千百年来的劳动智慧，被联合国粮农组织认定为“全球重要农业文化遗产”。这一古老的中国农业智慧体现的哲理主要是（   ）。", o: ["A.事物是普遍联系的", "B.“两点论”与“重点论”相结合", "C.绝对运动中包含着相对静止", "D.原因与结果互相渗透"], a: "A"},
        {ch: "第一章", q: "民间有一种迷信说法叫作“喜鹊叫喜，乌鸦叫丧”。这句话的错误在于否定了联系的（   ）。", o: ["A.普遍性", "B.客观性", "C.多样性", "D.条件性"], a: "B"},
        {ch: "第一章", q: "久旱缺雨时，下雨对庄稼生长有益；雨涝成灾时，下雨对庄稼生长有害。这说明（   ）。", o: ["A.事物的联系是普遍的无条件的", "B.事物的联系是现实的具体的", "C.事物的运动是客观的绝对的", "D.事物发展的根本原因是事物的内部矛盾"], a: "B"},
        {ch: "第一章", q: "唯物辩证法认为世界是普遍联系的，联系是指（   ）。", o: ["A.事物之间和事物内部诸要素之间的相互影响、相互作用和相互制约", "B.对立面之间的同一性和斗争性的关系", "C.对一事物存在 and 发展发生作用和影响的各种因素的总和", "D.矛盾的普遍性与特殊性之间的关系"], a: "A"},
        {ch: "第一章", q: "（   ）是揭示事物产生、发展和衰亡过程中的不同趋势的一对范畴。", o: ["A.必然与偶然", "B.原因与结果", "C.本质与现象", "D.内容与形式"], a: "A"},
        {ch: "第一章", q: "“人的意识不仅反映客观世界，而且通过指导实践改变和创造客观世界”的观点属于（   ）。", o: ["A.正确表达了意识的能动性", "B.夸大了意识的作用", "C.唯意志论的观点", "D.主观唯心主义的观点"], a: "A"},
        {ch: "第一章", q: "必然性和偶然性的关系是（   ）。", o: ["A.偶然性通过必然性表现出来", "B.必然性通过偶然性表现出来", "C.必然性是偶然性的表现形式", "D.必然性为偶然性开辟道路"], a: "B"},
        {ch: "第一章", q: "在社会主义现代化建设过程中，我们始终坚持以经济建设为中心，同时又注意抓好精神文明建设、民主法制建设和其他工作。这种做法体现了唯物辩证法的（   ）。", o: ["A.矛盾同一性和斗争性相统一的原理", "B.矛盾的普遍性和特殊性相统一的原理", "C.实践和认识相统一的原理", "D.“两点论”和“重点论”相统一的原理"], a: "D"},
        {ch: "第一章", q: "矛盾问题的精髓是（   ）。", o: ["A.主要矛盾和次要矛盾的关系问题", "B.矛盾的同一性和斗争性的关系问题", "C.矛盾的普遍性和特殊性的关系问题", "D.矛盾的主要方面和次要方面的关系问题"], a: "C"},
        {ch: "第一章", q: "马克思说：“搬运夫和哲学家之间的原始差别要比家犬和猎犬之间的差别小得多。他们之间的鸿沟是分工造成的。”这表明人的才能（   ）。", o: ["A.与人的先天生理素质没有关联", "B.主要来源于后天的实践", "C.取决于人的主观努力的程度", "D.是由人的社会政治地位决定的"], a: "B"},
        {ch: "第一章", q: "马克思主义认为，世界的真正的统一性在于它的（   ）。", o: ["A.实践性", "B.运动性", "C.物质性", "D.客观性"], a: "C"},
        {ch: "第一章", q: "在人与世界的相互作用中，人与世界同时得到了改变，并获得日益丰富的内容。造成这一变化的基础是（   ）。", o: ["A.自然界自身的运动", "B.人的意识的能动作用", "C.人的实践活动", "D.工具的制造与使用"], a: "C"},
        {ch: "第一章", q: "“特别能吃苦、特别能战斗、特别能攻关、特别能奉献”的载人航天精神，是我国航天事业取得辉煌成就的重要因素，它说明（   ）。", o: ["A.精神是第一性的，物质是第二性的", "B.精神的力量可以变成物质的力量", "C.精神的力量可以代替物质的力量", "D.先有精神，后有物质"], a: "B"},
        {ch: "第一章", q: "人工智能的出现对哲学意识论的意义是（   ）。", o: ["A.否定了意识对物质的能动性", "B.根本改变了人类意识活动中的主体性", "C.降低了人在意识活动中的主体性", "D.表明意识活动与其他物质形式的同一性"], a: "D"},
        {ch: "第一章", q: "人们先设计图纸，然后根据图纸施工建成大楼，这说明（   ）。", o: ["A.意识决定物质", "B.意识创造物质", "C.意识对物质有能动作用", "D.意识依赖于物质"], a: "C"},
        {ch: "第一章", q: "广大农民在致富的过程中深切体会到：“要富口袋，先富脑袋。”这一说法在哲学上的含义是（   ）。", o: ["A.精神是第一性的，物质是第二性的", "B.精神的力量可以变成物质的力量", "C.精神的力量可以代替物质的力量", "D.先有精神，后有物质"], a: "B"},
        {ch: "第一章", q: "物质和意识的对立只有在非常有限的范围内才有绝对的意义，超过这个范围便是相对的了，这个范围是指（   ）。", o: ["A.物质和意识何者为第一性", "B.物质和意识是否具有同一性", "C.物质和意识何者更为重要", "D.物质和意识何者与社会生活的关系更密切"], a: "A"},
        {ch: "第一章", q: "意识的本质是指它是（   ）。", o: ["A.人脑主观自生的", "B.人脑分泌的特殊物质", "C.人脑对客观存在的反映", "D.可以脱离被反映者"], a: "C"},
        {ch: "第一章", q: "“动中有静，静中有动”说的是（   ）。", o: ["A.形而上学和诡辩论的统一", "B.绝对运动和相对静止的统一", "C.物质和运动的统一", "D.连续性和非连续性的统一"], a: "B"},
        {ch: "第一章", q: "有人认为，既然人的意识是对客观外部世界的反映，那么人脑里的“鬼”“神”意识就是对外在世界上鬼神真实存在的反映。这种观念的错误在于（   ）。", o: ["A.夸大意识的能动作用", "B.把意识看成是物质的产物", "C.认为意识是对存在的直观反映", "D.混淆了人类意识自然演化的阶段"], a: "C"},
        {ch: "第一章", q: "意识是客观世界的主观映象，这表明（   ）。", o: ["A.意识来源于人脑", "B.意识是联结主体和客体的中介", "C.意识是客观精神的主观映象", "D.意识的内容是客观的、形式是主观的"], a: "D"},
        {ch: "第一章", q: "列宁的物质定义揭示物质的唯一特性是（   ）。", o: ["A.运动", "B.物质可以认识", "C.物质能为感官感知", "D.客观实在性"], a: "D"},
        {ch: "第一章", q: "下列选项关于本质和现象的关系，叙述正确的是（   ）。", o: ["A.本质决定现象", "B.现象决定本质", "C.本质和现象是彼此分隔的", "D.假象不反映事物的本质"], a: "A"},
        {ch: "第一章", q: "习近平总书记强调，“历史是最好的教科书”“历史的经验值得注意”“历史的教训更应引以为戒”“中国革命历史是最好的营养剂”。人们能够从历史中汲取经验教训，是因为（   ）。", o: ["A.历史规律和自然规律存在着惊人的相似性", "B.人类历史发展存在着不以人的意志为转移的规律", "C.历史总是在循环往复中不断向前发展", "D.人类已经完全掌握了历史发展的内在规律"], a: "B"},
        {ch: "第一章", q: "下列关于发展的论述正确的是（   ）。", o: ["A.发展是指事物的运动和变化", "B.发展是指一种前进的和上升运动", "C.发展是指事物发生的一切改变", "D.新出现的事物一定代表着发展"], a: "B"},
        {ch: "第一章", q: "运动和物质的关系是（   ）。", o: ["A.运动可以脱离物质", "B.物质和运动不可分割", "C.物质可以离开运动", "D.运动和物质时分时合"], a: "B"},
        {ch: "第一章", q: "“从辩证的观点来看，运动可以表现在它的对立面中，即表现在静止中”。这句话所蕴含的哲理是（   ）。", o: ["A.静止既是绝对的又是相对的", "B.静止不是一种运动", "C.运动不能表现为一种静止", "D.运动和静止是相互依赖的，不了解静止就不能了解运动"], a: "D"},
        {ch: "第一章", q: "运动是物质的根本属性是指（   ）。", o: ["A.不存在静止", "B.运动是物质的存在方式", "C.静止不是运动", "D.运动和静止没有任何关系"], a: "B"},
        {ch: "第一章", q: "运动和静止的关系是（   ）。", o: ["A.具体和抽象的关系", "B.内容和形式的关系", "C.绝对和相对的关系", "D.现象 and 本质的关系"], a: "C"},
        {ch: "第一章", q: "“盛年不重来，一日难再晨”，体现了时间的（   ）。", o: ["A.广延性", "B.相对性", "C.一维性", "D.稳定性"], a: "C"},
        {ch: "第一章", q: "时间的一维性是指（   ）。", o: ["A.可逆性", "B.无限性", "C.不可逆性", "D.间隔性"], a: "C"},
        {ch: "第一章", q: "时间是指物质运动的（   ）。", o: ["A.广延性", "B.持续性", "C.绝对性", "D.规律性"], a: "B"},
        {ch: "第一章", q: "“橘生淮南则为橘，生于淮北则为枳，叶徒相似，其实味不同。所以然者何？水土异也。”橘逾淮为枳说明了（   ）。", o: ["A.事物的发展变化以时间地点和条件为转移", "B.事物的普遍联系是通过中介来实现的", "C.任何实体事物都是普遍联系之网上的一个网结", "D.事物的变化和发展是一个过程"], a: "A"},
        {ch: "第一章", q: "有一副对联，上联是“橘子洲，洲旁舟，舟走洲不行”，下联是“天心阁，阁中鸽，鸽飞阁不飞”。这形象的说明了运动和静止是相互依存的。静止是（   ）。", o: ["A.运动的衡量尺度", "B.运动的内在原因", "C.运动的普遍状态", "D.运动的存在方式"], a: "A"},
        {ch: "第一章", q: "在唯物辩证法的科学体系中，揭示事物发展动力和源泉的规律是（   ）。", o: ["A.量变质变规律", "B.对立统一规律", "C.否定之否定规律", "D.本质决定现象规律"], a: "B"},
        {ch: "第一章", q: "在哲学史中我们可以看到，各种唯心主义派别之间的差异和矛盾，常常有利于唯物主义的发展，这一事实说明（   ）。", o: ["A.矛盾一方克服另一方促使事物发展", "B.矛盾一方的发展可以为另一方的发展提供条件", "C.矛盾双方中每一方的自身矛盾，都可以为另一方的发展所利用", "D.矛盾双方的融洽促使事物发展"], a: "C"},
        {ch: "第一章", q: "主要矛盾和矛盾的主要方面原理在方法论上应坚持（   ）。", o: ["A.均衡论", "B.一点论", "C.重点论", "D.二元论"], a: "C"},
        {ch: "第一章", q: "主要矛盾和次要矛盾、矛盾的主要方面和次要方面辩证关系原理要求我们（   ）。", o: ["A.坚持均衡论和重点论的统一", "B.坚持均衡论和一点论的统一", "C.坚持两点论和一点论 the 统一", "D.坚持两点论和重点论的统一"], a: "D"},
        {ch: "第一章", q: "杜甫诗曰：“挽弓当挽强，用箭当用长，射人先射马，擒贼先擒王。”这首诗蕴含的哲理是（   ）。", o: ["A.看问题要分清主流和支流", "B.承认矛盾客观性，正确对待矛盾", "C.既要看到矛盾主要方面，又要看到矛盾次要方面", "D.抓主要矛盾，抓中心，抓关键"], a: "D"},
        {ch: "第一章", q: "在唯物辩证法看来，水果同苹果、梨、香蕉、桃子等的关系属于（   ）。", o: ["A.全体和部分的关系", "B.共性和个性的关系", "C.本质和现象的关系", "D.内容和形式的关系"], a: "B"},
        {ch: "第一章", q: "发展的实质是新事物的产生和旧事物的灭亡。新、旧事物的区别在于（   ）。", o: ["A.出现时间的先后", "B.形式的新旧", "C.力量的大小对比", "D.同历史前进方向是否符合"], a: "D"},
        {ch: "第一章", q: "事物的质是指（   ）。", o: ["A.事物的规模和发展程度", "B.事物中所包含的维持其存在的方面", "C.事物保持其质的量的限度", "D.使事物成为它自身并区别于他事物的内在规定性"], a: "D"},
        {ch: "第一章", q: "在人类意识的产生过程中，起决定作用的是（   ）。", o: ["A.自然界的变化", "B.能够使用工具和制造工具的劳动", "C.语言和思维的形成", "D.脑量的增加"], a: "B"},
        {ch: "第一章", q: "意识对物质有反作用，这种反作用是（   ）。", o: ["A.无限的", "B.受客观条件制约的，归根结底还是由物质决定的", "C.被动的", "D.可以为所欲为的"], a: "B"},
        {ch: "第一章", q: "物质的唯一特性是客观实在性，客观实在是指（   ）。", o: ["A.人类能够实在感知的自然事物", "B.物质的具体形态和具体结构", "C.存在于人的意识之外，不以人的意志为转移", "D.看得见摸得着的实物"], a: "C"},
        {ch: "第一章", q: "运动和静止的关系是（   ）。", o: ["A.具体和抽象的关系", "B.内容和形式的关系", "C.现象和本质的关系", "D.绝对和相对的关系"], a: "D"},
        {ch: "第一章", q: "“一切以条件、地点和时间为转移”，这是（   ）。", o: ["A.唯物辩证法的观点", "B.取消了人的主观能动性的观点", "C.夸大了客观条件作用的观点", "D.机械唯物主义的观点"], a: "A"},
        {ch: "第一章", q: "没有上，就无所谓下；没有先进，就无所谓落后；没有正确，就无所谓错误。这说明（   ）。", o: ["A.矛盾双方是相互排斥的", "B.矛盾双方是相互渗透的", "C.矛盾双方是相互依存的", "D.矛盾双方是相互转化的"], a: "C"},
        {ch: "第一章", q: "“马者，所以命形也；白者，所以命色也。命色者非命形也，故曰白马非马。”从唯物辩证法的观点看，“白马非马”这一命题的错误在于（   ）。", o: ["A.割裂了事物本质与现象之间的联系", "B.割裂了事物共性和个性之间的联系", "C.混淆了事物内容和形式之间的区别", "D.颠倒了事物形态和功能之间的关系"], a: "B"},
        {ch: "第一章", q: "下列关于矛盾同一性在事物发展中的作用表述不正确的是（   ）。", o: ["A.同一性是一种矛盾统一体向另一种矛盾统一体过渡的决定力量", "B.同一性是事物存在和发展的前提", "C.同一性使矛盾双方相互吸取有利于自身的因素，在相互作用中各自得到发展", "D.同一性规定着事物转化的可能和发展的趋势"], a: "A"},
        {ch: "第一章", q: "“和而不同，同则不和”，这种对和谐的看法表明（   ）。", o: ["A.和谐与矛盾是排斥的", "B.和谐和矛盾是同一的", "C.和谐包含着矛盾", "D.有矛盾就没有和谐"], a: "C"},
        {ch: "第一章", q: "2022年6月16日，和若铁路正式通车运营，引发社会关注。这是一条典型的沙漠铁路，因地制宜制定治沙方案体现了（   ）。", o: ["A.反映的摹写性", "B.真理的相对性", "C.联系的普遍性", "D.矛盾的特殊性"], a: "D"},
        {ch: "第一章", q: "医学科学证明，如果人的大脑皮层受损，就会丧失思维能力，没有意识。这说明（   ）。", o: ["A.人脑是意识的源泉", "B.人脑是意识的物质器官", "C.人脑健康自然会有正确的意识", "D.意识是对外界事物的正确反映"], a: "B"},
        {ch: "第一章", q: "在工作中防止“过”或“不及”的关键在于（   ）。", o: ["A.抓住事物的主要矛盾", "B.认识事物的量", "C.确定事物的质", "D.把握事物的度"], a: "D"},
        {ch: "第一章", q: "事物发展过程中的“度”是指（   ）。", o: ["A.事物质变的关节点", "B.事物质变的临界点", "C.保持事物质的稳定性的数量界限", "D.事物保持一定量的质的限度"], a: "C"},
        {ch: "第一章", q: "做事情要区分可能性和不可能性，二者的区别在于（   ）。", o: ["A.人的主观努力程度", "B.对人是否有利", "C.现实中有无根据和条件", "D.是否符合人的主观愿望"], a: "C"},
        {ch: "第一章", q: "“勿以善小而不为，勿以恶小而为之”说明（   ）。", o: ["A.质变是由量变引起的", "B.质变与量变是相互渗透的", "C.量变是由质变引起的", "D.质变在事物发展中起重要作用"], a: "A"},
        {ch: "第一章", q: "“拔苗助长”的事例是（   ）。", o: ["A.重视可能性的表现", "B.忽视可能性的表现", "C.违反事物发展规律的表现", "D.发挥主观能动性的表现"], a: "C"},
        {ch: "第一章", q: "中国古代哲学家荀子说：“心不使焉，则白黑在前而目不见，雷鼓在侧而耳不闻。”这段话表明人的意识具有（   ）。", o: ["A.客观性", "B.能动性", "C.对象性", "D.任意性"], a: "B"},
        {ch: "第一章", q: "马克思主义哲学大厦的基石是（   ）。", o: ["A.世界是联系和发展的原理", "B.世界是运动变化的原理", "C.世界统一于物质的原理", "D.世界统一于精神的原理"], a: "C"},
        {ch: "第一章", q: "（   ）揭示了事物普遍联系的根本内容和变化发展的内在动力，从根本上回答了事物为什么会发展的问题。", o: ["A.对立统一规律", "B.量变质变规律", "C.否定之否定规律", "D.世界物质统一性原理"], a: "A"},
        {ch: "第一章", q: "近年来，一些幼儿园违背幼儿身心发展规律和认知特点，提前教授小学内容，“小学化”倾向比较严重，影响身心健康发展。说明（   ）。", o: ["A.质变是量变的必然结果", "B.尊重客观规律是正确发挥主观能动性的前提", "C.只有正确的认识可以指导实践", "D.正确的认识是客观规律性与主观能动性统一的基础"], a: "B"},
        {ch: "第一章", q: "定期体检对预防疾病十分重要，“心理体检”也应该得到重视，因为（   ）。", o: ["A.感觉和心理是人区别于动物的根本标志", "B.意识具有调控人的行为和生理活动的作用", "C.主观世界与客观世界的发展具有完全同步性", "D.人的本质属性是包括身体和心理在内的各种自然属性之和"], a: "B"},
        {ch: "第一章", q: "人类思维从个别到一般，又由一般到个别的最常见的推理形式是（   ）。", o: ["A.分析与综合", "B.归纳与演绎", "C.抽象与具体", "D.逻辑与历史"], a: "B"},
        {ch: "第一章", q: "（   ）强调思维的整体性、全局性、长期性，是高瞻远瞩、统揽全局、善于把握事物发展总体趋势和方向的能力。", o: ["A.系统思维能力", "B.战略思维能力", "C.历史思维能力", "D.创新思维能力"], a: "B"},
        {ch: "第一章", q: "相信“意念移物”，甚至相信可以用意念来直接改变物质结构，就是信奉（   ）。", o: ["A.主张精神主宰客观物质世界的主观唯心论", "B.主张精神是脱离人脑独立存在的客观唯心论", "C.认为人的思想是特殊物质的机械唯物主义", "D.认为人具有主观能动性的实践唯物主义"], a: "A"},
        {ch: "第一章", q: "唯物辩证法的否定之否定规律揭示了事物发展的（   ）。", o: ["A.方向和道路", "B.形式和状态", "C.结构和功能", "D.源泉和动力"], a: "A"},
        {ch: "第一章", q: "量变质变规律揭示了事物发展的（   ）。", o: ["A.方向和道路", "B.形式和状态", "C.结构和功能", "D.源泉和动力"], a: "B"},
        {ch: "第一章", q: "唯物主义和唯心主义这两个专门的哲学术语有着特定的含义和确定的标准，是指（   ）。", o: ["A.对世界本原究竟是物质还是精神的回答", "B.对存在和思维是否具有同一性的回答", "C.对社会存在与社会意识关系的回答", "D.对世界是怎样存在的问题的回答"], a: "A"},
        {ch: "第一章", q: "唯物主义一元论同唯心主义一元论对立的根本点在于（   ）。", o: ["A.世界发展动力问题", "B.意识本质问题", "C.世界本原问题", "D.实践本质问题"], a: "C"},
        {ch: "第一章", q: "在马克思主义普遍原理指导下，从中国的基本国情出发，走自己的路。这体现了（   ）。", o: ["A.矛盾的同一性和斗争性的的统一", "B.矛盾的普遍性和特殊性的统一", "C.事物发展的量变和质变的统一", "D.事物发展的前进性和曲折性的统一"], a: "B"},
        {ch: "第一章", q: "矛盾的两种基本属性是（   ）。", o: ["A.现象和本质", "B.现实和可能", "C.对立和统一", "D.必然和偶然"], a: "C"},
        {ch: "第一章", q: "下列关于矛盾同一性在事物发展中的作用表述不正确的是（   ）。（重题校验）", o: ["A.同一性是一种矛盾统一体向另一种矛盾统一体过渡的决定力量", "B.同一性是事物存在和发展的前提", "C.同一性使矛盾双方相互吸取有利于自身的因素，在相互作用中各自得到发展", "D.同一性规定着事物转化的可能和发展的趋势"], a: "A"},
        {ch: "第一章", q: "以下关于矛盾斗争性的说法正确的是（   ）。", o: ["A.斗争本身就是发展", "B.斗争性是无条件的，绝对的", "C.任何斗争都能促进事物的发展", "D.斗争在事物发展中始终处于主要的方面"], a: "B"},
        {ch: "第一章", q: "“一把钥匙开一把锁”“因地制宜”“因材施教”，这些话所体现的哲学原理是（   ）。", o: ["A.矛盾的普遍性", "B.矛盾的斗争性", "C.矛盾的特殊性", "D.矛盾的同一性"], a: "C"},
        {ch: "第一章", q: "人们认识世界和改造世界的根本方法是（   ）。", o: ["A.分析与综合的方法", "B.归纳与演绎的方法", "C.逻辑和历史相统一的方法", "D.矛盾分析方法"], a: "D"},
        {ch: "第一章", q: "辩证法所要回答的是（   ）。", o: ["A.世界的本原是什么的问题", "B.世界的本质是什么的问题", "C.世界的状况是怎么样的问题", "D.世界是否可知的问题"], a: "C"},
        {ch: "第一章", q: "“概念的辩证法本身就变成只是现实世界的辩证运动的自觉的反映...”这段话表明，主观辩证法与客观辩证法的关系是（   ）。", o: ["A.反映与被反映的关系", "B.唯心主义与唯物主义的关系", "C.抽象与具体的关系", "D.唯心辩证法与唯物辩证法的关系"], a: "A"},
        {ch: "第一章", q: "“沉舟侧畔千帆过，病树前头万木春。”这两句诗包含的哲学道理是（   ）。", o: ["A.矛盾是事物发展的动力", "B.事物是本质 and 现象的统一", "C.事物的发展是量变和质变的统一", "D.新事物代替旧事物是事物发展的总趋势"], a: "D"},
        {ch: "第一章", q: "下列关于发展概念论述不正确的是（   ）。", o: ["A.发展是一种前进的运动", "B.发展是一种上升的运动", "C.发展是一种循环往复、永不停息的运动", "D.发展的实质是新事物的产生和旧事物的灭亡"], a: "C"},
        {ch: "第一章", q: "下列关于原因和结果的关系，论述不正确的是（   ）。", o: ["A.有因必有果", "B.有果必有因", "C.一定会存在因果报应", "D.原因和结果在一定条件下可以相互转化"], a: "C"},
        {ch: "第一章", q: "否定之否定规律在（   ）。", o: ["A.事物完成一个发展周期才能完整表现出来", "B.事物发展的任何阶段上都表现出来", "C.事物经过量变向质变的转变后表现出来", "D.事物经过一次否定后表现出来"], a: "A"},
        {ch: "第一章", q: "现象有真象和假象之分，真象和假象的区别在于（   ）。", o: ["A.真象从正面表现本质，假象从反面歪曲地表现本质", "B.真象深藏于事物内部", "C.真象表现本质，假象不表现本质", "D.真象是真实的，假象是一种错觉"], a: "A"},
        {ch: "第一章", q: "联系具有普遍性，其含义不包括以下哪项：（   ）。", o: ["A.任何事物内部的不同部分和要素之间都是相互联系的", "B.联系是无条件的，世界上任何两个事物都是有联系的", "C.整个世界是相互联系的统一整体", "D.任何事物都不能孤立存在"], a: "B"},

        {ch: "第一章", q: "矛盾的特殊性是指（   ）。", o: ["A.每一事物的矛盾不包含共性", "B.构成事物一切要素的总和", "C.每一事物内部所包含的矛盾及每一个矛盾各个方面都有其特点", "D.矛盾斗争的对抗形式"], a: "C"},

        {ch: "第一章", q: "人类思维从个别到一般，又由一般到个别的最常见的推理形式是（   ）。（重题校验）", o: ["A.分析与综合", "B.归纳与演绎", "C.抽象与具体", "D.逻辑与历史"], a: "B"},
        {ch: "第一章", q: "有这样一道数学题：90%x90%x90%x90%x90%=?其答案为约59%。每个环节都打点折扣，最终成绩就不及格。这里蕴含的辩证法道理是（   ）。", o: ["A.肯定中包含否定", "B.量变引起质变", "C.必然性通过偶然性开辟道路", "D.可能和现实是相互转化的"], a: "B"},

        {ch: "第一章", q: "有强大的对手才有更优秀的自己。这一事例说明（   ）。", o: ["A.斗争性在推动事物发展的过程中始终处于主要的方面", "B.事物发展总是呈现出线性上升的姿态", "C.矛盾一方克服另一方是矛盾解决的唯一形式", "D.矛盾双方可以利用对方的发展使自己获得发展"], a: "D"},

        {ch: "第一章", q: "唯物辩证法的总特征是（   ）。", o: ["A.联系的观点 and 发展的观点", "B.物质第一性、意识第二性的观点", "C.运动和静止辩证统一的观点", "D.对立统一的观点"], a: "A"},

        {ch: "第二章", q: "“判定认识或理论之是否真理...真理的标准只能是社会的实践。”这说明（  ）。", o: ["A.实践是认识的来源", "B.实践是认识发展的动力", "C.实践是认识的目的", "D.实践是检验认识真理性的唯一标准"], a: "D"},
        {ch: "第二章", q: "感性认识和理性认识是统一的认识过程中的两个阶段，它们的区别在于（  ）。", o: ["A.感性认识反映事物的现象，理性认识反映事物的本质", "B.感性认识来源于社会实践，理性认识来源于抽象思维", "C.感性认识来源于感性具体，理性认识来源于理性具体", "D.感性认识包含错误，理性认识则完全正确"], a: "A"},
        {ch: "第二章", q: "实践作为检验真理的标准，既是确定的又是不确定的，其不确定性是因为（    ）。", o: ["A.有些真理是根本无法通过实践来加以检验的", "B.任何实践检验都需要一定的逻辑证明作为其补充的手段", "C.任何实践都会受到主客观条件的制约", "D.不同的人，不同的阶级各有其不同的实践标准"], a: "C"},
        {ch: "第二章", q: "习近平指出：“我们党现阶段提出和实施的理论和路线方针政策，之所以正确，就是因为它们都是以我国现时代的社会存在为基础的。” 段话说明（  ）。", o: ["A.实践是认识的来源", "B.实践是认识的发展动力", "C.实践是认识的目的", "D.实践是检验认识真理性的唯一标准"], a: "A"},
        {ch: "第二章", q: "习近平指出“……实践如果没有正确理论的指导，也容易盲人骑瞎马夜半临深池”说明（  ）。", o: ["A.实践对理论有决定作用", "B.理论创新为实践创新提供科学的行动指南", "C.理论比实践更为重要", "D.实践比理论重要"], a: "B"},
        {ch: "第二章", q: "某一认识成为真理的决定性条件，并不在于它采取何种主观形式，而在于它（  ）。", o: ["A.是不是被大多数人所接受", "B.能正确地反映对象的本质和规律", "C.是不是具有绝对性", "D.是不是能够满足人的需要"], a: "B"},
        {ch: "第二章", q: "真理和谬误的区别在于（  ）。", o: ["A.真理是主体对客体的反映，谬误是主体自生的", "B.真理是有用的，谬误是有害的", "C.真理是绝对的，谬误是相对的", "D.真理是对事物的正确反映，谬误是对事物的歪曲反映"], a: "D"},
        {ch: "第二章", q: "轻视感性认识而片面夸大理性认识的作用，会导致（  ）。", o: ["A.宿命论", "B.唯理论", "C.诡辩论", "D.经验论"], a: "B"},
        {ch: "第二章", q: "真理与谬误之间的相互关系是（  ）。", o: ["A.在任何情况下都是绝对对立的", "B.没有相互转化的可能性", "C.在一定条件下能够相互转化", "D.两者之间没有原则区别"], a: "C"},
        {ch: "第二章", q: "下列不属于价值的基本特性的是（  ）。", o: ["A.价值具有中介性", "B.价值具有主体性和客观性", "C.价值具有多维性", "D.价值具有社会历史性"], a: "A"},
        {ch: "第二章", q: "对马克思主义既要坚持，又要在实践中丰富和发展。这种正确态度的理论基础是（    ）。", o: ["A.认识是主体对客体的能动反映的原理", "B.实践是认识的来源 and 目的原理", "C.真理的绝对性和真理的相对性统一的原理", "D.能动的反映是摹写和创造相统一的原理"], a: "C"},
        {ch: "第二章", q: "真理的相对性是指（    ）。", o: ["A.不含有绝对性质的真理", "B.包含有错误因素的真理", "C.人们在一定条件下对客观事物及其本质和发展规律的正确认识总是有限度的", "D.暂时正确的真理"], a: "C"},
        {ch: "第二章", q: "理论创新和实践创新的良性互动关系不包括（  ）。", o: ["A.二者相互促进、辩证统一，不断实现更高阶段的创新发展", "B.中国特色社会主义是一个不断创新发展的过程", "C.二者之间可以形成相互激发、共同促进的因果关系", "D.理论创新与实践创新一直具有不同步性，极易产生矛盾关系"], a: "D"},
        {ch: "第二章", q: "最鳖脚的建筑师从一开始就比最灵巧的蜜蜂高明的地方，是他在用蜂蜡建筑蜂房以前，已经在自己的头脑中把它建成了。说的是实践具有（    ）。", o: ["A.普遍性", "B.绝对性", "C.客观实在性", "D.自觉能动性"], a: "D"},
        {ch: "第二章", q: "理性认识是关于事物的（    ）。", o: ["A.本质、全体、内部联系和事物自身规律性的认识", "B.外部联系的片面反映", "C.生动具体的外部形象的反映", "D.现象的直观反映"], a: "A"},
        {ch: "第二章", q: "辩证微观主义认为，认识的主体和客体的关系（    ）。", o: ["A.只是反映与被反映的关系", "B.只是改造与被改造的关系", "C.是指导和被指导的关系", "D.不仅是认识和被认识的关系，而且首先是改造和被改造的关系"], a: "D"},
        {ch: "第二章", q: "认识的过程首先是从实践到认识的过程。由感性认识能动地飞跃到理性认识，也就是“从生动的直观到抽象的思维”，这是认识运动的（  ）。", o: ["A.第一次飞跃", "B.第二次飞跃", "C.第三次飞跃", "D.fourth次飞跃"], a: "A"},
        {ch: "第二章", q: "从实践到认识，再从认识到实践，实现了人们认识具体事物的辩证运动过程。经历了两次飞跃，实践与认识的运动就算完成了吗?回答是（    ）。", o: ["A.完成了", "B.没有完成", "C.依具体情况而定", "D.既完成了，又没有完成"], a: "D"},
        {ch: "第二章", q: "真理尺度与价值尺度是否达到了具体的、历史的统一，必须通过（  ）来验证。", o: ["A.感性认识", "B.自由", "C.理性认识", "D.实践"], a: "D"},
        {ch: "第二章", q: "谬误与真理的关系是对立统一的，因此谬误（  ）。", o: ["A.永远也不能变为真理", "B.在一定条件下能够向真理转化", "C.是对客观事物的正确反映", "D.含在相对真理之中的"], a: "B"},

        {ch: "第二章", q: "“要根据时代变化和实践发展...坚持理论指导和实践探索辩证统一...”这一论述从理论上深刻揭示了（  ）的内在联系。", o: ["A.理论创新与实践创新", "B.真理与谬误", "C.实践与认识", "D.真理与价值"], a: "A"},
        {ch: "第二章", q: "“只有音乐才能激起人的音乐感；对于没有音乐感的耳朵来说，最美的音乐也毫无意义。”这表明（  ）。", o: ["A.人的认识是主体与客体相互作用的过程和结果", "B.人的感觉能力决定认识的产生和发展", "C.人的认识能力是由人的生理结构决定的", "D.事物因人的感觉而存在"], a: "A"},
        {ch: "第二章", q: "（  ）是真理的本质属性。", o: ["A.绝对性", "B.相对性", "C.客观性", "D.无限性"], a: "C"},

        {ch: "第二章", q: "马克思主义认为，实践是（    ）。", o: ["A.主体创造客体的活动", "B.作为主体的人的日常活动", "C.主体适应客观环境的活动", "D.主客体之间相互作用的过程"], a: "D"},
        {ch: "第二章", q: "“社会一旦有技术上的需要，这种需要就会比十所大学更能把科学推向前进。”恩格斯的这段话是指（    ）。", o: ["A.实践是认识的发展动力", "B.实践为认识提供了可能", "C.实践使认识得以产生和发展", "D.实践是检验认识真理性的唯一标准"], a: "A"},

        {ch: "第二章", q: "对一个复杂事物的正确认识往往需要经过（   ）。", o: ["A.由感性认识到理性认识，再由理性认识回到感性认识", "B.由感性认识到理性认识，再由理性认识回到实践的两次飞跃", "C.由实践到认识，由认识到实践的一次完成", "D.由实践到认识，由认识到实践的多次反复"], a: "D"},
        {ch: "第二章", q: "“人的智力是按如何学会改造自然界而发展的”这句话说明（    ）。", o: ["A.实践是认识的根源", "B.实践是认识的动力", "C.人的认识具有主观能动性", "D.实践是检验认识正确与否的标准"], a: "B"},
        {ch: "第二章", q: "列宁在谈到检验真理的实践标准时指出...“这个标准也是这样的确定，以便同唯心主义和不可知论的一切变种进行无情的斗争。”这句话说明（    ）。", o: ["A.实践不是检验真理的唯一标准", "B.实践标准不可靠", "C.实践标准是不确定的", "D.实践标准是绝对性和相对性的统一"], a: "D"},

        {ch: "第二章", q: "作为改造世界活动的实践的基本特征是（  ）。", o: ["A.人的自觉的能动的活动", "B.精神的活动", "C.群体的活动", "D.个人的生活活动"], a: "A"},
        {ch: "第二章", q: "习近平指出：“理论创新只能从问题开始。理论创新的过程就是发现问题、解决问题的过程。”这段话说明（  ）。", o: ["A.投身实践，深入调查，获取十分丰富和合乎实际的感性材料", "B.感性认识是认识过程的初级阶段", "C.感性认识上升到理性认识必须通过理论创新", "D.感性认识和理性认识的统一是认识过程的两个方面"], a: "A"},
        {ch: "第二章", q: "“真理绝不会因为有人不承认它而感到苦恼”。希勒的话说明真理具有（    ）。", o: ["A.具体性", "B.条件性", "C.客观性", "D.客观实在性"], a: "C"},
        {ch: "第二章", q: "实践作为检验认识真理性的标准的确定性即绝对性，是指实践作为检验认识真理性标准的（  ）。", o: ["A.客观性", "B.真实性", "C.唯一性", "D.条件性"], a: "C"},
        {ch: "第二章", q: "“没有革命的理论，就不会有革命的行动。”这一论断的含义是（  ）。", o: ["A.革命理论比革命行动更重要", "B.革命理论派生出了革命行动", "C.革命理论对革命行动具有指导意义", "D.革命理论最终决定革命运动的成败"], a: "C"},
        {ch: "第二章", q: "人们往往会由于特定条件下的特殊需要而实现它的某一种或几种价值，同时却要放弃它的其他价值，这体现了价值的（  ）。", o: ["A.客观性", "B.主体性", "C.社会历史性", "D.多维性"], a: "D"},
        {ch: "第二章", q: "经过我国几代领导集体的努力，蕴含鲜明时代内涵的治国理政总体方略与时俱进，不断发展，这体现的哲理是（  ）。", o: ["A.人类社会是一个不断变化发展的过程", "B.真理反映的对象是客观事物及其规律", "C.真理性的认识随着实践发展而发展", "D.真理是否正确必须经过实践的检验"], a: "C"},
        {ch: "第二章", q: "下列活动属于最基本的实践活动的是（  ）。", o: ["A.医生给病人做手术", "B.科学家进行化学实验", "C.农民播种小麦", "D.外交官到他国访问"], a: "C"},
        {ch: "第二章", q: "我国科学家屠呦呦采用科学的实验方法探寻疟疾的新疗法，这说明（    ）。", o: ["A.采用科学的实验方法探寻疟疾的新疗法，符合价值尺度", "B.任何实践是真理尺度和价值尺度的统一", "C.真理尺度必须以价值尺度为前提", "D.拯救了成千上万疟疾患者的生命，符合真理尺度"], a: "B"},
        {ch: "第二章", q: "“从物到感觉和思想”是关于认识本质问题上的（  ）。", o: ["A.唯物主义反映论的认识路线", "B.形而上学直观反映论的认识路线", "C.唯心主义先验论的认识路线", "D.唯心主义经验论的认识路线"], a: "A"},
        {ch: "第二章", q: "牛顿说：“如果说我比别人看得更远些，那是因为我站在巨⼈的肩膀上。”这句话肯定（  ）。", o: ["A.直接经验的作用", "B.间接经验的作用", "C.感性认识的作用", "D.实践的作用"], a: "B"},

        {ch: "第二章", q: "辩证唯物主义认识论和旧唯物主义认识论的本质区别在于是否脱离（   ）。", o: ["A.实践活动", "B.辩证法", "C.反映论", "D.实践和辩证法"], a: "D"},

        {ch: "第二章", q: "一个完整的认识过程需要经过两次飞跃。下列选项中属于第二次飞跃的是（   ）。", o: ["A.调查研究，了解情况", "B.深入思考，形成理论", "C.精心安排，制定计划", "D.执行计划，付诸实践"], a: "D"},
        {ch: "第二章", q: "解放思想、与时俱进，就是要（   ）。", o: ["A.不受任何框框的束缚，思想上达到绝对自由", "B.不受任何约束，做到随心所欲", "C.抛弃原有的一切观念，重新评价", "D.突破落后观念的束缚，坚持实事求是"], a: "D"},

        {ch: "第二章", q: "社会科学改造社会说明了（   ）。", o: ["A.实践是认识的基础", "B.认识是实践的来源", "C.实践决定认识", "D.认识反作用于实践"], a: "D"},

        // 第三章
        {ch: "第三章", q: "社会历史观的基本问题是（  ）。", o: ["A.存在和思维的关系问题", "B.认识和实践的关系问题", "C.社会存在与社会意识的关系问题", "D.运动和静止的关系问题"], a: "C"},
        {ch: "第三章", q: "社会存在和发展的基础及决定力量是（  ）。", o: ["A.人口因素", "B.自然地理环境", "C.国家政权", "D.物质生产方式"], a: "D"},
        {ch: "第三章", q: "划分唯物史观和唯心史观的根本标准是（  ）。", o: ["A.是否承认社会存在决定社会意识", "B.是否承认社会意识具有相对独立性", "C.是否承认社会发展具有规律性", "D.是否承认阶级和阶级斗争"], a: "A"},
        {ch: "第三章", q: "“吃、喝、住、穿，这是人生的第一需要”的观点属于（   ）。", o: ["A.历史唯物主义的观点", "B.历史唯心主义的观点", "C.利己主义的观点", "D.庸俗唯物主义的观点"], a: "A"},
        {ch: "第三章", q: "经济基础是（  ）。", o: ["A.一定历史阶段上生产力和生产关系的总和", "B.一定历史阶段上经济基础和上层建筑的总和", "C.一定历史阶段上科学技术和经济管理的总和", "D.一定发展阶段的生产力所决定的生产关系的总和"], a: "D"},
        {ch: "第三章", q: "（  ）是人类社会生存和发展永恒的、必要的条件，是人们生活和生产的自然基础。", o: ["A.人口因素", "B.自然地理环境", "C.物质生产方式", "D.国家政权"], a: "B"},
        {ch: "第三章", q: "生产方式是（  ）。", o: ["A.生产力各要素的有机统一", "B.生产关系各方面的有机统一", "C.经济基础与上层建筑的统一", "D.生产力与生产关系的统一"], a: "D"},
        {ch: "第三章", q: "生产关系是人们在物质生产过程中结成的（  ）。", o: ["A.人与自然的关系", "B.人与人的物质利益关系", "C.管理与被管理的关系", "D.分工协作关系"], a: "B"},
        {ch: "第三章", q: "（  ）是人类社会赖以存在和发展的基础，是人类其他一切活动的首要前提。", o: ["A.自然地理环境", "B.人口因素", "C.物质生产方式", "D.国家政权"], a: "C"},
        {ch: "第三章", q: "生产力是指人们（  ）。", o: ["A.改造精神世界的能力", "B.改造主观世界的能力", "C.改造人类社会的能力", "D.改造和影响自然的能力"], a: "D"},
        {ch: "第三章", q: "人类社会发展的根本动力是（  ）。", o: ["A.阶级斗争", "B.改革开放", "C.科学技术革命", "D.社会基本矛盾"], a: "D"},
        {ch: "第三章", q: "人口因素对社会发展的作用表现在（  ）。", o: ["A.人口增长是引起革命的根源", "B.人口增长是资本主义社会劳动者贫困失业的根源", "C.人口因素对社会发展可以起加速或延缓作用", "D.人口因素是社会进步的决定力量"], a: "C"},
        {ch: "第三章", q: "“英雄创造历史”，这个观点的实质是（  ）。", o: ["A.唯物史观", "B.唯心史观", "C.经验主义", "D.自然主义"], a: "B"},
        {ch: "第三章", q: "上层建筑由两部分组成，即（  ）。", o: ["A.政治法律制度与军队警察等武装力量", "B.生产关系和政治制度", "C.政权和政治法律制度及其设施", "D.政治上层建筑和观念上层建筑"], a: "D"},
        {ch: "第三章", q: "在整个上层建筑中，政治上层建筑居主导地位，其核心是（  ）。", o: ["A.国家政权", "B.政治法律思想", "C.道德、艺术", "D.政党"], a: "A"},
        {ch: "第三章", q: "经济基础决定上层建筑，就是说（  ）。", o: ["A.一切社会的上层建筑都要在它的经济基础建立之后才能产生", "B.一切社会的上层建筑都根源于经济基础", "C.一切社会的上层建筑的变化都是同经济基础变化同步的", "D.社会中一切经济基础成分都决定着社会的上层建筑性质"], a: "B"},
        {ch: "第三章", q: "社会基本矛盾是（  ）。", o: ["A.社会存在与社会意识的矛盾", "B.物质生产和精神生产的矛盾", "C.生产和消费的矛盾", "D.生产力与生产关系、经济基础与上层建筑之间的矛盾"], a: "D"},
        {ch: "第三章", q: "人类通过实践活动在不断改造世界过程中推动社会发展和进步。社会的发展和进步集中表现为（  ）。", o: ["A.社会形态的更替", "B.社会生产力的发展", "C.人类自身得到改造和发展", "D.人类对社会规律的认识和改造"], a: "A"},
        {ch: "第三章", q: "（  ）是人类在生产实践中形成的改造和影响自然以使其适合社会需要的物质力量。", o: ["A.生产力", "B.生产关系", "C.社会存在", "D.社会意识"], a: "A"},
        {ch: "第三章", q: "生产关系所体现的是生产过程中（  ）。", o: ["A.人与自然的关系", "B.人与人的政治关系", "C.人与人的思想关系", "D.人与人的经济关系"], a: "D"},
        {ch: "第三章", q: "上层建筑对社会发展的作用性质取决于它（    ）", o: ["A.是否符合经济基础的要求", "B.是否符合统治阶级的愿望", "C.是否推动经济基础的发展", "D.所服务的经济基础的性质"], a: "D"},
        {ch: "第三章", q: "区分不同生产方式、判定不同社会经济结构的客观依据是（  ）。", o: ["A.生产工具", "B.生产资料所有制关系", "C.生产中人和人的关系", "D.生产分配关系"], a: "B"},
        {ch: "第三章", q: "生产力和生产关系、经济基础和上层建筑这两对社会基本矛盾的关系是（  ）。", o: ["A.前者和后者相互决定、相互制约", "B.前者和后者并行不悖", "C.以后者为基础，推动前者矛盾的解决", "D.以前者为基础，两者相互制约，互相作用"], a: "D"},
        {ch: "第三章", q: "马克思指出，“社会形态发展是自然历史过程”，这是指（  ）。", o: ["A.社会形态的发展与自然界的发展完全一样", "B.社会形态的发展也是自发的过程", "C.社会形态的发展是客观的、有规律的发展过程", "D.社会形态的发展与主体的活动无关"], a: "C"},
        {ch: "第三章", q: "（  ）是先进生产力的集中体现和主要标志，是第一生产力。", o: ["A.社会存在", "B.生产关系", "C.劳动工具", "D.科学技术"], a: "D"},
        {ch: "第三章", q: "人民群众创造历史总要受到社会历史条件的制约，其根本的条件是指（  ）。", o: ["A.生产力和生产关系的状况", "B.人们头脑中的传统观念", "C.科学文化的发展情况", "D.人们的社会关系水平"], a: "A"},
        {ch: "第三章", q: "社会存在属于社会生活的物质方面，是社会实践和物质生活各种条件的总和，它是（  ）。", o: ["A.生产方式、地理环境和人口因素 the 统一", "B.生产力和生产关系的统一", "C.生产方式和社会形态的统一", "D.经济基础和上层建筑的统一"], a: "A"},
        {ch: "第三章", q: "下列关于人民群众的表述不正确的是（  ）。", o: ["A.人民群众是一切对社会历史发展起推动作用的人", "B.人民群众是指社会人口中的绝大多数", "C.人民群众是人类社会历史的主体", "D.人民群众包括全部社会成员"], a: "D"},
        {ch: "第三章", q: "下列关于经济基础与上层建筑二者之间关系表述，不正确的是（  ）。", o: ["A.经济基础决定上层建筑", "B.上层建筑对经济基础具有反作用", "C.上层建筑的反作用不必服从于经济基础的性质和客观要求", "D.经济基础与上层建筑的相互作用构成二者的矛盾运动"], a: "C"},
        {ch: "第三章", q: "（  ）是指社会各阶级在国家中的地位，表明国家政权掌握在哪个阶级手里...", o: ["A.国体", "B.政体", "C.国家", "D.民主"], a: "A"},
        {ch: "第三章", q: "（  ）是经济上占会配地位的阶级为维护其根本利益而建立起来的强制性的暴力机关。", o: ["A.国家", "B.阶级", "C.国体", "D.政体"], a: "A"},
        {ch: "第三章", q: "（  ）是指社会各阶级在国家中的地位，表明国家政权掌握在哪个阶级手里。（重题）", o: ["A.国家", "B.阶级", "C.国体", "D.政体"], a: "C"},
        {ch: "第三章", q: "（  ）是指统治阶级实现其阶级统治的具体组织形式，也是政治构成形式。", o: ["A.国家", "B.阶级", "C.国体", "D.政体"], a: "D"},
        {ch: "第三章", q: "社会形态更替归根结底是社会基本矛盾运动的结果。其中具有最终决定意义的是（  ）。", o: ["A.人民的意志和选择", "B.生产资料所有权的归属", "C.社会生产力的发展", "D.对本民族特点的把握程度"], a: "C"},
        {ch: "第三章", q: "（  ）是指在一定历史条件下的现实的个人、群众、阶级、民族、国家之间在物质和精神上相互往来、相互作用、彼此联系的活动。", o: ["A.文明", "B.交往", "C.守正", "D.创新"], a: "B"},
        {ch: "第三章", q: "（  ）是人类创造的所有物质成果、精神成果和制度成果的总和，是标志社会进步程度的范畴。", o: ["A.文明", "B.交往", "C.守正", "D.创新"], a: "A"},
        {ch: "第三章", q: "区分不同生产方式、判定社会经济结构性质的客观依据是（  ）。（与22题略微不同）", o: ["A.生产关系", "B.产品的分配关系", "C.生产资料所有制关系", "D.生产中人与人的关系"], a: "C"},
        {ch: "第三章", q: "由意识形态和政治法律制度及设施、政治组织等两部分构成的上层建筑建立在（  ）。", o: ["A.一定的物质基础之上", "B.一定的制度基础之上", "C.一定的文明基础之上", "D.一定的经济基础之上"], a: "D"},
        {ch: "第三章", q: "世界历史形成和发展的基础是（  ）。", o: ["A.生产方式的发展变革", "B.地理科学的逐渐完善", "C.意识形态的普遍认同", "D.信息技术的广泛应用"], a: "A"},
        {ch: "第三章", q: "我国初级阶段实行以公有制为主体、多种所有制共同发展，遵循了（  ）。", o: ["A.生产力决定生产关系的原理", "B.经济基础决定上层建筑的原理", "C.生产力具有自我增值能力的原理", "D.社会经济制度决定生产力状况的原理"], a: "A"},
        {ch: "第三章", q: "（  ）是社会基本矛盾在阶级社会中的表现。", o: ["A.守正创新", "B.阶级斗争", "C.科技革命", "D.改革改良"], a: "B"},
        {ch: "第三章", q: "社会意识相对独立性的突出表现是（  ）。", o: ["A.社会意识的历史继承性", "B.各种社会意识之间的相互影响", "C.社会意识对社会存在具有能动的反作用", "D.社会意识对社会存在变化上的滞后性"], a: "C"},
        {ch: "第三章", q: "改革在人类历史上具有普遍性，它是（  ）。", o: ["A.社会制度更替的一种形式", "B.是社会制度的自我完善和发展", "C.统治阶级向被统治阶级妥协", "D.革命阶级发动对反动阶级的斗争"], a: "B"},
        {ch: "第三章", q: "唯物史观就是“关于现实的人及其历史发展的科学”。人的本质是（  ）。", o: ["A.从所有个体的人身上抽象出来的自然属性", "B.单个人天生就具有的东西", "C.一切社会关系的总和", "D.人的自然属性和社会属性的综合"], a: "C"},
        {ch: "第三章", q: "（  ）是社会基本矛盾所引起的广泛而深刻的社会变革的统称。", o: ["A.社会革命", "B.意识形态", "C.科技革命", "D.改革改良"], a: "A"},
        {ch: "第三章", q: "美国跨越了奴隶社会和封建社会...中国一些少数民族直接过渡到社会主义社会。说明（  ）。", o: ["A.五种社会形态划分的理论是错误的", "B.社会形态更替没有任何规律可以遵循", "C.它们违背了历史发展规律", "D.社会形态更替的形式具有多样性"], a: "D"},
        {ch: "第三章", q: "阶级斗争在社会发展中的巨大作用突出表现在（  ）。", o: ["A.自每个新社会诞生以后的整个发展过程中", "B.社会形态更替的质变过程中", "C.每一个社会的各个发展阶段", "D.某个社会阶段完结以前的瞬间"], a: "B"},
        {ch: "第三章", q: "（  ）蕴含着人类的思想智慧、价值追求和审美情趣，是一个国家、一个民族的灵魂。", o: ["A.文化", "B.科技", "C.思维", "D.存在"], a: "A"},
        {ch: "第三章", q: "（  ）是社会基本矛盾运动中最基本的动力因素，是社会进步的根本内容，是衡量社会进步的根本尺度。", o: ["A.生产关系", "B.生产力", "C.上层建筑", "D.经济基础"], a: "B"},
        {ch: "第三章", q: "社会意识的（    ）是指，社会意识在从根本上受到社会存在决定的同时，还具有自身特有的发展形式和发展规律。", o: ["A.直接现实性", "B.相对性", "C.决定性", "D.相对独立性"], a: "D"},
        {ch: "第三章", q: "社会历史观的基本问题是（  ）。（重复题）", o: ["A.存在与思维的关系问题", "B.社会存在与社会意识的关系问题", "C.物质与意识的关系问题", "D.生产力与生产关系的关系问题"], a: "B"},
        {ch: "第三章", q: "在对待社会历史发展及其规律问题上，历来存在着两种根本对立的观点。这两种对立的观点是（  ）。", o: ["A.唯物主义与唯心主义", "B.原始唯心主义与形而上学唯物主义", "C.唯物史观与唯心史观", "D.唯我论与不可知论"], a: "C"},
        {ch: "第三章", q: "唯心史观的根本错误在于它片面夸大了（  ）。", o: ["A.人的作用", "B.地理环境的作用", "C.物质生产的作用", "D.英雄人物的意识和意志的作用"], a: "D"},
        {ch: "第三章", q: "社会意识的本质特点是（  ）。", o: ["A.独立于社会存在之外的精神实体", "B.依赖和反映社会存在", "C.全人类的共同意识", "D.社会阶级意识中带有共性的内容"], a: "B"},
        {ch: "第三章", q: "社会意识对社会存在的反作用的性质取决于（  ）。", o: ["A.观念上层建筑和政治上层建筑的关系", "B.社会的性质和人类解放的程度", "C.剥削阶级与被剥削阶级斗争的状况", "D.它为之服务的经济基础的性质和它所武装的阶级社会势力的性质"], a: "D"},
        {ch: "第三章", q: "生产力是指人们（  ）。（重复题）", o: ["A.改造客观世界的能力", "B.解决生产发展问题的能力", "C.掌握和运用知识的能力", "D.改造和影响自然的能力"], a: "D"},
        {ch: "第三章", q: "衡量生产力发展水平的客观依据是（  ）。", o: ["A.劳动者的素质", "B.生产工具", "C.生产管理的科学化程度", "D.科学技术水平"], a: "B"},
        {ch: "第三章", q: "人和物的要素之所以能够变成现实的生产力，是因为（  ）。", o: ["A.正确调整分配关系以及由它决定的消费关系", "B.把科学技术物化在机器工具等生产资料中所产生的必然结果", "C.一定的生产资料所有制形式能够把诸要素结合起来", "D.劳动对象范围不断扩大和生产工具的不断改进"], a: "C"},
        {ch: "第三章", q: "下面关于生产力决定生产关系，理解不正确的是（  ）。", o: ["A.生产力状况决定生产关系的性质", "B.生产关系是为适应生产力发展需要而产生的", "C.生产力的发展决定生产关系的变革", "D.生产关系必须完全适合生产力的发展才能存在"], a: "D"},
        {ch: "第三章", q: "下列各项，哪一个不属于政治上层建筑（  ）。", o: ["A.政治法律思想", "B.政党", "C.国家政权机构", "D.法庭"], a: "A"},
        {ch: "第三章", q: "在生产力和生产关系、经济基础和上层建筑这两对社会运动的基本矛盾中（  ）。", o: ["A.两对矛盾是并列统一的关系", "B.两对矛盾是相互排斥、相互对立的关系", "C.生产力和生产关系的矛盾运动起决定性作用", "D.经济基础和上层建筑的矛盾起决定性作用"], a: "C"},
        {ch: "第三章", q: "人口因素是构成社会物质生活条件的重要方面，它是指（  ）。", o: ["A.人民群众的文化素质和道德觉悟", "B.人们从事生产劳动的积极性和创造性", "C.人口的分布状况和受教育程度", "D.人口的数量、素质和结构等状况对社会发展的制约和影响作用"], a: "D"},
        {ch: "第三章", q: "地理环境在社会存在和发展中的重要作用表现在（  ）。", o: ["A.它是划分社会经济形态的依据", "B.它是人类社会存在和发展的永恒的、必要的条件", "C.它是社会制度变更的决定力量", "D.它是社会性质的决定性因素"], a: "B"},
        {ch: "第三章", q: "在社会主义条件下，上层建筑对经济基础的保护从根本上说就是（  ）。", o: ["A.为了实现共同富裕", "B.为了尽早实现社会主义现代化强国", "C.辨别最广大人民群众的物质利益", "D.为了保障最广大人民群众的物质利益"], a: "C"},
        {ch: "第三章", q: "中国特色社会主义进入新时代的重要标志和依据是（  ）。", o: ["A.改革进入攻坚阶段", "B.新的主要矛盾的形成和出现", "C.全面建成小康社会目标的实现", "D.经济发展进入新常态"], a: "B"},
        {ch: "第三章", q: "坚持以人民为中心的思想，创造性地运用和发展了唯物史观关于（  ）的基本原理。", o: ["A.生产关系要适应生产力发展的基本原理", "B.社会历史发展基本规律原理", "C.人民群众创造历史的基本原理", "D.社会意识具有相对独立性的原理"], a: "C"},
        {ch: "第三章", q: "社会意识形态是指（  ）。", o: ["A.个人意识和群体意识的总和", "B.包括社会心理在内的不同层次的社会意识的总和", "C.政治法律思想、道德、宗教、艺术、哲学和大部分社会科学", "D.社会科学、自然科学和思维科学所构成的意识形态总和"], a: "C"},
        {ch: "第三章", q: "人类历史向世界历史转变是（  ）的结果。", o: ["A.生产力发展", "B.生产关系变革", "C.资本主义生产方式出现和世界扩张", "D.人类的普遍交往"], a: "C"},
        {ch: "第三章", q: "（  ）创造了人类文明新形态，具有世界历史意义。", o: ["A.中国特色社会主义", "B.中国式现代化", "C.人类命运共同体", "D.中华优秀传统文化"], a: "B"},
        {ch: "第三章", q: "阶级斗争在社会发展中的巨大作用突出表现在（  ）。（重题）", o: ["A.自每个新社会诞生以后的整个发展过程中", "B.社会形态更替的质变过程中", "C.每一个社会的各个发展阶段", "D.某个社会阶段完结以前的瞬间"], a: "B"},
        {ch: "第三章", q: "人类历史归根结底是（  ）。", o: ["A.生产发展的历史", "B.阶级斗争的历史", "C.社会革命的历史", "D.人的发展和进步的历史"], a: "A"},
        {ch: "第三章", q: "智能生物识别新技术快速发展应用，人们对隐私保护引发担忧，说明了（  ）。", o: ["A.总是阻碍新技术的健康发展", "B.只能落后于新技术发展", "C.与新技术发展具有不平衡性", "D.归根到底是新技术发展的内在动力"], a: "C"},
        {ch: "第三章", q: "恩格斯说：“一切社会变迁和政治变革的终极原因...应当到生产方式的变更中去寻找”这段话包含的哲学道理是（  ）。", o: ["A.经济基础决定上层建筑", "B.思想变革是政治变革的先导", "C.经济哲学是时代精神的精华", "D.经济基础的革命性变革才是真正的革命的思想"], a: "A"},
        {ch: "第三章", q: "国家的实质是（  ）。", o: ["A.一个阶级统治另一个阶级的工具", "B.各阶级利益的调解者", "C.人们相互约定的组织", "D.整个社会的代表者"], a: "A"},
        {ch: "第三章", q: "不是人们的意识决定人们的存在，相反，是人们的社会存在决定人们的意识。这是唯物史观对（   ）。", o: ["A.哲学基本问题的正确回答", "B.哲学观基本问题的正确回答", "C.历史观基本问题的正确回答", "D.世界观基本问题的正确回答"], a: "C"},
        {ch: "第三章", q: "唯物史观认为，人类的第一个历史活动是（   ）。", o: ["A.吃喝穿住", "B.物质生活资料的生产", "C.人的自觉意识活动", "D.结成社会关系"], a: "B"},
        {ch: "第三章", q: "“发展着自己的物质生产和物质交往的人们...也改变着自己的思维和思维的产物。”这段话说明社会意识是（   ）。", o: ["A.人们思维发展的产物", "B.人类社会发展需要的产物", "C.人类社会发展的产物", "D.人们社会物质生产和物质交往的产物"], a: "D"},
        {ch: "第三章", q: "社会意识对社会存在的反映，主要是对（   ）。", o: ["A.物质资料生产方式的反映", "B.科学文化的反映", "C.统治阶级意志的反映", "D.社会规律的反映"], a: "A"},
        {ch: "第三章", q: "社会意识根源于（   ）。", o: ["A.社会生活的物质条件", "B.反映社会存在的社会意识", "C.作为社会主体的人民群众的心理", "D.英雄人物成为杰出人物 the 意愿"], a: "A"},
        {ch: "第三章", q: "人类是社会的主体，历史活动就是人的活动，因此人可以（   ）。", o: ["A.创造社会发展规律", "B.消灭社会发展规律", "C.改变社会发展规律", "D.认识和利用社会发展规律"], a: "D"},
        {ch: "第三章", q: "“任何英雄人物的历史作用都不能超出他们所处的历史条件所许可的范围”是（   ）。", o: ["A.宿命论观点", "B.机械论观点", "C.历史循环论观点", "D.唯物史观观点"], a: "D"},
        {ch: "第三章", q: "英雄史观的理论出发点是主张（   ）。", o: ["A.人是社会历史的主体", "B.人的意识对社会存在具有能动作用", "C.社会意识决定社会存在", "D.社会运动受偶然性支配"], a: "C"},
        {ch: "第三章", q: "衡量生产力水平的客观尺度主要是（   ）。", o: ["A.劳动者的技术水平的高低", "B.劳动产品质量的好坏", "C.劳动资料特别是生产工具的发展水平", "D.劳动对象的广度和深度"], a: "C"},
        {ch: "第三章", q: "在生产关系中起决定作用的是（   ）。", o: ["A.生产资料所有制", "B.产品的分配形式", "C.人们在生产过程中的地位和相互关系", "D.交换和消费关系"], a: "A"},
        {ch: "第三章", q: "下列观点中，哪一个不属于生产关系对生产力有能动反作用原理（   ）。", o: ["A.拔高的生产关系能使生产力获得“跨越式”发展", "B.生产关系适合生产力发展的客观要求时，就促进生产力发展", "C.生产关系不适合生产力发展的客观要求时，就阻碍生产力发展", "D.在一定条件下，生产关系对生产力的反作用尤为突出"], a: "A"},
        {ch: "第三章", q: "阶级不是从来就有的，任何时候阶级“都是自己时代的经济关系的产物”。那么，阶级产生的直接原因（   ）。", o: ["A.一部分人对另一部分人的暴力掠夺", "B.社会产品的分配不均", "C.剩余产品的出现", "D.生产资料私有制的形成"], a: "D"},
        {ch: "第三章", q: "历史人物分为杰出人物和反动人物，杰出人物是（   ）。", o: ["A.对历史发展起促进作用的伟大人物", "B.专指无产阶级伟大的思想家、政治家", "C.专指历史上被剥削阶级的政治代表", "D.专指杰出的科学家、教育家、艺术家"], a: "A"},
        {ch: "第三章", q: "社会形态是指同生产力发展一定阶段相适应的（   ）。", o: ["A.生产方式和生产过程的统一体", "B.基本经济制度和经济体制的统一体", "C.经济基础和上层建筑的统一体", "D.经济体制和上层建筑的统一体"], a: "C"},
        {ch: "第三章", q: "人们的历史选择性，归根结底是（   ）。", o: ["A.客观规律的决定性", "B.人民群众的选择性", "C.领导人的决定性", "D.领导人的选择性"], a: "A"},
        {ch: "第三章", q: "“人民群众是历史的创造者”这个观点的理论出发点是（   ）。", o: ["A.社会革命是历史火车头的原理", "B.阶级斗争是阶级社会发展直接动力的原理", "C.社会存在决定社会意识的原理", "D.社会意识相对独立性的原理"], a: "C"},
        {ch: "第三章", q: "对历史人物的评价原则是（   ）。", o: ["A.坚持为现实服务的原则", "B.坚持为政治服务的原则", "C.坚持传统观念的原则", "D.坚持历史主义与阶级分析的原则"], a: "D"},
        {ch: "第三章", q: "人民群众创造历史的活动首先是（   ）。", o: ["A.生产活动", "B.政治活动", "C.精神活动", "D.科学活动"], a: "A"},

        // 第四章
        {ch: "第四章", q: "社会经济的两种基本形态是（  ）。", o: ["A.商品经济和市场经济", "B.公有制经济和非公有制经济", "C.自然经济和商品经济", "D.计划经济和自然经济"], a: "C"},
        {ch: "第四章", q: "一定社会财富的物质内容由（  ）。", o: ["A.使用价值构成", "B.交换价值构成", "C.价值构成", "D.货币构成"], a: "A"},
        {ch: "第四章", q: "两种商品可以按一定比例相互交换的原因，在于它们（  ）。", o: ["A.有不同的使用价值", "B.都是具体劳动的产物", "C.对人们有共同的效应", "D.在生产中都耗费了一般的人类劳动"], a: "D"},
        {ch: "第四章", q: "生产商品的劳动分具体劳动和抽象劳动，其中具体劳动的作用是（  ）。", o: ["A.创造新价值", "B.创造剩余价值", "C.创造必要价值", "D.创造使用价值"], a: "D"},
        {ch: "第四章", q: "生产商品的劳动二重性即具体劳动和抽象劳动，是指（  ）。", o: ["A.两种独立存在的劳动", "B.同一劳动过程中先后出现的两种不同劳动", "C.同一劳动过程的两个方面", "D.不同劳动过程的不同劳动形式"], a: "C"},
        {ch: "第四章", q: "决定商品价值量的社会必要劳动时间（  ）。", o: ["A.以抽象劳动为尺度", "B.以私人劳动为尺度", "C.以剩余劳动为尺度", "D.以简单劳动为尺度"], a: "D"},
        {ch: "第四章", q: "资本主义相对过剩人口是指（      ）。", o: ["A.人口增长超过生活资料增长而出现的人口过剩", "B.劳动力供给超过资本对劳动力需求而出现的人口过剩", "C.人口增长超过资本增长而出现的人口过剩", "D.人口增长超过生产资料增长而出现的人口过剩"], a: "B"},
        {ch: "第四章", q: "商品内在的使用价值和价值的矛盾，其完备的外在表现（  ）。", o: ["A.商品和商品之间的对立", "B.具体劳动和抽象劳动之间的对立", "C.资本和劳动之间的对立", "D.商品和货币之间的对立"], a: "D"},
        {ch: "第四章", q: "“我们从小麦的滋味中尝不出种植小麦的人是俄国的农奴...并不反映任何社会生产关系。”马克思的这段话表明（  ）。", o: ["A.商品的使用价值在质上是一样的", "B.商品的使用价值与具体劳动无关", "C.使用价值是历史范畴", "D.使用价值是商品的自然属性"], a: "D"},
        {ch: "第四章", q: "价值规律调节社会劳动在各部门的分配是通过（  ）。", o: ["A.价格始终同价值相等实现的", "B.价格高于价值实现的", "C.价格低于价值实现的", "D.价格围绕价值上下波动实现的"], a: "D"},
        {ch: "第四章", q: "商品的价值量由生产商品的社会必要劳动时间决定。社会必要劳动时间是在（  ）。", o: ["A.同类商品的生产者之间的竞争中实现的", "B.不同部门之间的竞争中实现的", "C.商品的生产者和消费者之间的竞争中实现的", "D.商品的生产者和销售者之间的竞争中实现的"], a: "A"},
        {ch: "第四章", q: "价值规律是（  ）。", o: ["A.自然经济的基本规律", "B.商品经济的基本规律", "C.产品交换经济的基本规律", "D.资本主义经济的基本规律"], a: "B"},
        {ch: "第四章", q: "价值规律的表现形式主要是（  ）。", o: ["A.商品价格同价值相等", "B.之商品价值同价格相等", "C.商品价值围绕价格波动", "D.商品价格围绕价值波动"], a: "D"},
        {ch: "第四章", q: "社会必要劳动时间...制造某种使用价值所需要的劳动时间，它是以（  ）为尺度的。", o: ["A.简单劳动", "B.具体劳动", "C.复杂劳动", "D.个别劳动"], a: "A"},
        {ch: "第四章", q: "在商品经济条件下，解决私人劳动和社会劳动之间矛盾的唯一途径是（  ）。", o: ["A.按劳分配", "B.扩大再生产", "C.经济危机", "D.商品交换"], a: "D"},
        {ch: "第四章", q: "商品的使用价值和价值的矛盾、生产商品的具体劳动和抽象劳动的矛盾，根源于（  ）。", o: ["A.生产社会化和生产资料资本主义私人占有之间的矛盾", "B.商品和货币的矛盾", "C.简单劳动和复杂劳动的矛盾", "D.私人劳动和社会劳动的矛盾"], a: "D"},
        {ch: "第四章", q: "理解马克思主义政治经济学的枢纽是（  ）。", o: ["A.剩余价值学说", "B.生产价格理论", "C.劳动二重性理论", "D.劳动力商品理论"], a: "C"},
        {ch: "第四章", q: "资本主义扩大再生产的源泉是（  ）。", o: ["A.资本集中", "B.资本积累", "C.资本循环", "D.资本周转"], a: "B"},
        {ch: "第四章", q: "劳动力成为商品是（    ）。", o: ["A.一切社会经济制度共有的", "B.简单商品经济的前提", "C.自然经济转化为商品经济的决定性条件", "D.货币转化为资本的前提条件"], a: "D"},
        {ch: "第四章", q: "劳动力商品的价值是由（  ）。", o: ["A.生产和再生产劳动力商品所需要的社会必要劳动时间决定的", "B.生理、道德和社会因素决定的", "C.无产阶级和资产阶级的力量对比决定的", "D.劳动力生存和繁衍后代所需要的生活资料价值决定的..."], a: "A"},
        {ch: "第四章", q: "以生产资料形态存在的资本的是（    ）。", o: ["A.不变资本", "B.可变资本", "C.全部预付资本", "D.部分预付资本"], a: "A"},
        {ch: "第四章", q: "用来购买劳动力的那部分资本是（  ）。", o: ["A.不变资本", "B.可变资本", "C.全部预付资本", "D.部分预付资本"], a: "B"},
        {ch: "第四章", q: "马克思将资本划分为不变资本与可变资本的根据是（  ）。", o: ["A.资本不同部分在剩余价值生产中的不同作用", "B.资本不同部分在周转中的不同方式", "C.资本在循环中的不同职能", "D.资本不同部分的物质形态是否改变"], a: "A"},
        {ch: "第四章", q: "剩余价值产生的唯一源泉是（    ）。", o: ["A.雇佣劳动者的剩余劳动", "B.雇佣劳动者的必要劳动", "C.雇佣劳动者的具体劳动", "D.雇佣劳动者的抽象劳动"], a: "A"},
        {ch: "第四章", q: "绝对剩余价值是（    ）。", o: ["A.个别资本家改进技术、提高劳动生产率的结果", "B.社会劳动生产率普遍提高的结果", "C.必要劳动时间不变，延长工作日的结果", "D.工作日不变，缩短必要劳动时间的结果"], a: "C"},
        {ch: "第四章", q: "相对剩余价值是（    ）。", o: ["A.个别资本家改进技术、提高劳动生产率的结果", "B.社会劳动生产率普遍提高的结果", "C.必要劳动时间不变，延长工作日的结果", "D.工作日不变，缩短必要劳动时间的结果"], a: "D"},
        {ch: "第四章", q: "绝对剩余价值的生产和相对剩余价值的生产都是依靠（    ）。", o: ["A.延长工作日获得的", "B.提高劳动生产率获得的", "C.减少工人的必要劳动时间获得的", "D.延长工人的剩余劳动时间获得的"], a: "D"},
        {ch: "第四章", q: "商品的本质因素是（  ）。", o: ["A.使用价值", "B.价值", "C.价格", "D.具体劳动"], a: "B"},
        {ch: "第四章", q: "资本主义生产的根本目的是（    ）。", o: ["A.促进生产力的发展", "B.促进社会进步", "C.增加社会财富", "D.追求剩余价值"], a: "D"},
        {ch: "第四章", q: "资本主义生产的实质是（    ）。", o: ["A.社会化大生产", "B.国家化大生产", "C.剩余价值生产", "D.现代商品生产"], a: "C"},
        {ch: "第四章", q: "在资本主义商品生产条件下，单个资本家改进技术、改善管理的主观动机是（    ）。", o: ["A.追求超额剩余价值", "B.获取相对剩余价值", "C.降低资本有机构成", "D.增加必要劳动时间"], a: "A"},

        {ch: "第四章", q: "在生产过程中，劳动力商品所创造的新价值是指（   ）。", o: ["A.剩余价值", "B.商品价值", "C.劳动力自身的价值", "D.劳动力价值和剩余价值"], a: "D"},
        {ch: "第四章", q: "商品的使用价值和价值的矛盾，其完备的外在表现形式是（    ）。（重复题）", o: ["A.商品与商品的对立", "B.商品与货币的对立", "C.资本与雇佣劳动的对立", "D.生产者与消费者的对立"], a: "B"},
        {ch: "第四章", q: "资本积累的实质是（   ）。", o: ["A.资本家为了社会进步", "B.资本家省吃俭用的结果", "C.剩余价值资本化", "D.资本家用无偿占有的剩余价值榨取更多的剩余价值"], a: "D"},
        {ch: "第四章", q: "资本积累的真正来源是（   ）。（重复题）", o: ["A.工人创造的剩余价值", "B.劳动生产率的提高", "C.大资本吞并中小资本的结果", "D.资本家节俭的结果"], a: "A"},

        {ch: "第四章", q: "社会必要劳动时间中的“正常生产条件”是（   ）。", o: ["A.全社会各部门的平均技术装备水平", "B.全社会大多数部门的技术装备水平", "C.某一生产部门内部的先进技术装备水平", "D.某一生产部门内部大多数产品已经达到的技术装备水平"], a: "D"},

        {ch: "第五章", q: "国家垄断资本主义是（  ）。", o: ["A.私人企业与私人垄断资本融合在一起的垄断资本主义", "B.私人垄断资本与工业垄断资本融合在一起的垄断资本主义", "C.国家政权与私人垄断资本融合在一起的垄断资本主义", "D.银行垄断资本与工业垄断资本融合在一起的垄断资本主义"], a: "C"},

        {ch: "第五章", q: "国家垄断资本主义的出现（  ）。", o: ["A.从根本上改变了资本的本性", "B.从根本上改变了资本主义矛盾", "C.并没有一定程度促进生产力的发展", "D.并没有根本改变垄断资本主义的性质"], a: "D"},

        {ch: "第五章", q: "操纵国民经济命脉，并在实际上控制国家政权的少数垄断资本家或垄断资本家集团是（  ）。", o: ["A.产业资本家", "B.银行资本家", "C.金融寡头", "D.资本主义国家"], a: "C"},

        {ch: "第五章", q: "为经济全球化提供了坚实的物质基础和根本推动力的是（   ）。", o: ["A.科学技术的进步和生产力的发展", "B.跨国公司在全球范围内的迅速发展", "C.各国经济体制的变革和国际经济组织的发展", "D.金融自由化与金融创新"], a: "A"},

        {ch: "第五章", q: "资本主义经济发展中，资本集中的直接后果是（    ）。", o: ["A.社会总资本急剧增加", "B.社会就业率明显提高", "C.个别资本规模迅速扩大", "D.绝对剩余价值总量快速增长"], a: "C"},
