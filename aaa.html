<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>海城市中心医院 - 体检报告单</title>
    <style>
        :root {
            --primary-color: #000000;
            --border-color: #333333;
            --stamp-color: rgba(200, 30, 30, 0.9);
        }

        body {
            font-family: "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
            color: #000000;
        }

        /* 控制面板 */
        .control-panel {
            max-width: 800px;
            margin: 0 auto 20px auto;
            background: #ffffff;
            padding: 12px;
            border: 1px solid var(--border-color);
            text-align: right;
        }

        .btn {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #000000;
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 0;
            cursor: pointer;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #333333;
        }

        /* 报告单 A4 容器 */
        .report-container {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            background: #ffffff;
            padding: 20mm;
            box-sizing: border-box;
            border: 1px solid #000000;
            position: relative;
        }

        /* 医院页眉 */
        .header {
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 12px;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-family: "SimSun", "Songti SC", "STSong", serif;
            font-size: 30px;
            color: var(--primary-color);
            letter-spacing: 3px;
            font-weight: bold;
        }

        .header .subtitle {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 个人信息区域 */
        .info-section {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 140px;
            grid-gap: 15px;
            margin-bottom: 25px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-column: span 3;
            grid-gap: 15px;
        }

        .info-item {
            display: flex;
            align-items: center;
            font-size: 14px;
        }

        .info-item label {
            font-weight: bold;
            width: 75px;
            color: #000000;
        }

        .info-item input {
            border: none;
            border-bottom: 1px solid var(--border-color);
            border-radius: 0;
            width: 100%;
            padding: 4px;
            font-size: 14px;
            outline: none;
        }

        /* 照片上传区域 */
        .photo-container {
            grid-row: span 2;
            border: 1px dashed var(--border-color);
            border-radius: 0;
            height: 160px;
            width: 130px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            overflow: hidden;
            cursor: pointer;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .photo-placeholder {
            font-size: 12px;
            color: #000000;
            text-align: center;
            padding: 10px;
        }

        .photo-container input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* 检查指标表格 */
        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--primary-color);
            border-left: 4px solid var(--primary-color);
            padding-left: 8px;
            margin: 25px 0 12px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            font-size: 14px;
            text-align: left;
        }

        th {
            background-color: #ffffff;
            color: #000000;
            font-weight: bold;
        }

        table input {
            border: none;
            width: 100%;
            height: 100%;
            font-size: 14px;
            outline: none;
            background: transparent;
            font-family: inherit;
        }

        /* 结论区域 */
        .conclusion-box {
            border: 1px solid var(--border-color);
            border-radius: 0;
            padding: 15px;
            min-height: 120px;
            margin-bottom: 40px;
        }

        .conclusion-box textarea {
            width: 100%;
            height: 100px;
            border: none;
            resize: none;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            line-height: 1.6;
            color: #000000;
        }

        /* 签名与印章区域 */
        .footer-sign {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 60px;
            position: relative;
        }

        .sign-item {
            font-size: 14px;
        }

        .sign-item input {
            border: none;
            border-bottom: 1px solid var(--border-color);
            border-radius: 0;
            width: 140px;
            text-align: center;
            outline: none;
            font-family: inherit;
        }

        /* 电子印章 */
        .stamp-wrapper {
            position: absolute;
            right: 50px;
            bottom: -15px;
            pointer-events: none;
        }

        .official-stamp {
            width: 115px;
            height: 115px;
            border: 3px solid var(--stamp-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transform: rotate(-10deg);
        }

        .stamp-text {
            color: var(--stamp-color);
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            position: absolute;
            width: 85px;
            height: 85px;
            line-height: 1.4;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stamp-center {
            border-top: 1px solid var(--stamp-color);
            padding-top: 2px;
            margin-top: 2px;
            font-size: 11px;
        }

        .star {
            color: var(--stamp-color);
            font-size: 16px;
            position: absolute;
            top: 14px;
        }

        /* 打印样式适配 */
        @media print {
            body {
                background: none;
                padding: 0;
            }
            .control-panel, .photo-placeholder, .photo-container input[type="file"] {
                display: none !important;
            }
            .report-container {
                border: none !important;
                margin: 0;
                padding: 10mm;
            }
            input, textarea {
                border-bottom: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <button class="btn" onclick="window.print()">打印报告 / 保存为 PDF</button>
    </div>

    <div class="report-container">
        <div class="header">
            <h1>海城市中心医院体检报告单</h1>
            <div class="subtitle">Haicheng Central Hospital Medical Examination Report</div>
        </div>

        <div class="info-section">
            <div class="info-grid">
                <div class="info-item">
                    <label>姓名：</label>
                    <input type="text" value="张三">
                </div>
                <div class="info-item">
                    <label>性别：</label>
                    <input type="text" value="男">
                </div>
                <div class="info-item">
                    <label>年龄：</label>
                    <input type="text" value="24 岁">
                </div>
                <div class="info-item">
                    <label>体检号：</label>
                    <input type="text" value="HCE2026062501">
                </div>
                <div class="info-item">
                    <label>科室/单位：</label>
                    <input type="text" value="临床医学部">
                </div>
                <div class="info-item">
                    <label>联系电话：</label>
                    <input type="text" value="138-xxxx-xxxx">
                </div>
            </div>
            
            <div class="photo-container" id="photoContainer">
                <div class="photo-placeholder" id="placeholderText">点击此处<br>上传照片</div>
                <img id="avatarPreview" src="" alt="个人照片">
                <input type="file" id="photoInput" accept="image/*">
            </div>
        </div>

        <div class="section-title">一、基础体检指标 (General Indicators)</div>
        <table>
            <thead>
                <tr>
                    <th style="width: 45%;">检查项目</th>
                    <th style="width: 35%;">检查结果</th>
                    <th style="width: 20%;">单位</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><input type="text" value="身高 (Height)"></td>
                    <td><input type="text" value="175"></td>
                    <td><input type="text" value="cm"></td>
                </tr>
                <tr>
                    <td><input type="text" value="体重 (Weight)"></td>
                    <td><input type="text" value="70"></td>
                    <td><input type="text" value="kg"></td>
                </tr>
                <tr>
                    <td><input type="text" value="体重指数 (BMI)"></td>
                    <td><input type="text" value="22.8"></td>
                    <td><input type="text" value="kg/m²"></td>
                </tr>
                <tr>
                    <td><input type="text" value="收缩压 (SBP)"></td>
                    <td><input type="text" value="120"></td>
                    <td><input type="text" value="mmHg"></td>
                </tr>
                <tr>
                    <td><input type="text" value="舒张压 (DBP)"></td>
                    <td><input type="text" value="80"></td>
                    <td><input type="text" value="mmHg"></td>
                </tr>
                <tr>
                    <td><input type="text" value="心率 (Heart Rate)"></td>
                    <td><input type="text" value="75"></td>
                    <td><input type="text" value="次/分"></td>
                </tr>
            </tbody>
        </table>

        <div class="section-title">二、体检结论与建议 (Conclusion & Recommendations)</div>
        <div class="conclusion-box">
            <textarea>总评结论：
1. 本次基础体检各项生理指标（血压、心率、BMI）均在正常范围内。
2. 建议继续保持良好的作息规律和均衡饮食。

建议：
定期复查，随诊。</textarea>
        </div>

        <div class="footer-sign">
            <div class="sign-item">
                主检医生：<input type="text" value="李医生">
            </div>
            <div class="sign-item">
                报告日期：<input type="text" id="reportDate" value="2026-06-25">
            </div>

            <div class="stamp-wrapper">
                <div class="official-stamp">
                    <span class="star">★</span>
                    <div class="stamp-text">
                        <div>海城市中心医院<br><span class="stamp-center">体检专用章</span></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // 处理照片上传预览
        const photoInput = document.getElementById('photoInput');
        const avatarPreview = document.getElementById('avatarPreview');
        const placeholderText = document.getElementById('placeholderText');

        photoInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    avatarPreview.src = e.target.result;
                    avatarPreview.style.display = 'block';
                    placeholderText.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        // 自动初始化当前日期
        const dateInput = document.getElementById('reportDate');
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        dateInput.value = `${yyyy}-${mm}-${dd}`;
    </script>
</body>
</html>
